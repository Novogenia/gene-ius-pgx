<style>
  :root{
    --plum:#5E0047; --plum-700:#400031; --plum-050:#FBF6F9; --plum-100:#F3E8EF;
    --ok:#12A150; --warn:#F08A00; --crit:#E12D2D;
    --ok-t:#0d7d3e; --warn-t:#b06400; --crit-t:#b62220;
    --ok-bg:#EFF9F3; --warn-bg:#FEF6EA; --crit-bg:#FDEFEE;
    --ok-ln:#C4E6D2; --warn-ln:#F3D9AE; --crit-ln:#F2C4C2;
    --ink:#1A1620; --muted:#645D6B; --faint:#948C9B;
    --line:#E7E4EA; --line2:#DCD8E0; --bg:#EFEDF1; --panel:#F7F6F9; --cardw:352px;
    --blue:#1f6fb2;
    --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code",ui-monospace,Consolas,monospace;
    --sh:0 2px 5px rgba(30,10,30,.05),0 14px 34px -16px rgba(40,0,35,.26);
    --sh-lg:0 18px 48px -14px rgba(40,0,35,.34);
    color-scheme:light;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
  .hidden{display:none!important}
  button{font:inherit}

  /* ---------- Shell: vollfl&auml;chige Plum-Sidebar (Design-Vorlage) ---------- */
  .shell{display:grid;grid-template-columns:264px 1fr;align-items:stretch;min-height:100vh}
  @media(max-width:1080px){.shell{grid-template-columns:1fr}}
  nav.rail{background:linear-gradient(178deg,#5E0047 0%,#4d003a 70%,#420031 100%);padding:26px 16px 20px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
  @media(max-width:1080px){nav.rail{position:static;height:auto}}
  .brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:800;font-size:17.5px;letter-spacing:-.015em;padding:2px 6px 30px}
  .brand .logo{width:36px;height:36px;border-radius:11px;background:radial-gradient(120% 120% at 20% 15%,#9DBF00 0%,transparent 52%),rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
  .brand small{display:block;font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#d8b6cd;margin-top:2px}
  .nav-item{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:11px;border:0;background:transparent;
    font-size:14.5px;font-weight:600;letter-spacing:0;color:#e0c7d8;cursor:pointer;text-align:left;width:100%;
    white-space:normal;line-height:1.25;transition:.15s}
  .nav-item .ni{flex:none;display:grid;place-items:center;color:currentColor;opacity:.9}
  .nav-item .ni svg{width:20px;height:20px}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item[aria-current="true"]{background:rgba(255,255,255,.15);color:#fff;font-weight:700}
  .nav-item[aria-current="true"] .ni{opacity:1}
  .nav-badge{margin-left:auto;font-size:11px;font-weight:800;min-width:22px;height:22px;padding:0 7px;border-radius:999px;
    display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .nb-crit{background:var(--crit);color:#fff} .nb-warn{background:var(--warn);color:#fff}
  .patient{margin-top:auto;display:flex;align-items:center;gap:11px;padding:13px 10px 4px;border-top:1px solid rgba(255,255,255,.14)}
  .patient .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#9DBF00,#5E0047);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
  .patient b{font-size:13.5px;color:#fff}.patient span{font-size:11px;color:#cfa9c2}
  main#main{padding:26px 30px 70px;min-width:0}
  @media(max-width:640px){main#main{padding:18px 16px 60px}}

  .sec-title{display:inline-block;font-size:clamp(18px,2.2vw,23px);font-weight:800;letter-spacing:-.015em;color:#fff;
    background:linear-gradient(120deg,var(--plum) 0%,#7d1668 100%);padding:11px 22px;border-radius:999px;box-shadow:0 9px 24px -11px rgba(94,0,71,.75);margin:0 0 8px}
  .sec-sub{margin:0 0 20px;color:var(--muted);font-size:13.5px;max-width:74ch}
  .box{background:#fff;border-radius:20px;box-shadow:var(--sh)}
  .box-h{display:flex;align-items:center;gap:11px;padding:16px 20px;cursor:pointer}
  .box-h h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--plum);padding:6px 14px;border-radius:999px}
  .box-h .bh-note{font-size:12.5px;color:var(--muted);margin-left:4px}
  .box-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
  .box.open .box-h .chev{transform:rotate(180deg)}
  .box-body{display:none;padding:0 20px 20px}
  .box.open .box-body{display:block}
  .box-always{padding:0 20px 18px}

  /* ---------- Kennzahlen (Vorlage: Label oben, Icon + Zahl darunter) ---------- */
  .dashgrid{display:grid;grid-template-columns:repeat(auto-fill,var(--cardw));justify-content:start;gap:14px}
  @media(max-width:420px){.dashgrid{grid-template-columns:1fr}}
  .dashgrid .card{margin-bottom:0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:16px;margin-bottom:24px}
  .kpi{border-radius:16px;padding:16px 18px 17px;box-shadow:0 2px 5px rgba(30,10,30,.07);border:0;color:#fff}
  .kpi .kl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.95;line-height:1.25;margin-bottom:12px}
  .kpi .krow{display:flex;align-items:center;gap:14px}
  .kpi .kic{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
  .kpi .kic svg{width:24px;height:24px;color:#fff}
  .kpi .ktx{min-width:0}
  .kpi b{display:block;font-size:33px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
  .kpi span{display:block;font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.25;opacity:.94}
  .k-teal{background:#74AFA9} .k-plum{background:#6d1259} .k-blue{background:#3C5C86}
  .k-ok{background:#7EB98C} .k-warn{background:#E9A34A} .k-crit{background:#DC6A62}
  .kpi.k-ev{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .kpi.k-ev .kl{color:var(--faint);opacity:1}
  .kpi.k-ev .kic{background:var(--plum-050)}.kpi.k-ev .kic svg{color:var(--plum)}
  .kpi.k-ev .evrow{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .kpi.k-ev .evrow b{display:inline;font-size:14px;font-weight:750;letter-spacing:0;line-height:1.2}
  .dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:#d8d1dc;display:block}.dots i.on{background:var(--plum)}

  /* ---------- Dashboard-Hero ---------- */
  .hero{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:34px 36px;margin-bottom:22px}
  .hero .eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--plum);margin-bottom:14px}
  .hero h1{margin:0;font-size:clamp(28px,4.4vw,46px);font-weight:800;line-height:1.06;letter-spacing:-.03em;max-width:22ch}
  .hero h1 em{font-style:normal;color:var(--plum)}
  .hero p{margin:14px 0 0;font-size:15.5px;color:var(--muted);max-width:62ch;line-height:1.55}
  @media(max-width:640px){.hero{padding:24px 20px}}

  /* ---------- Alternativen-Modal ---------- */
  .altpick{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(680px,94vw);max-height:90vh;overflow:auto;
    background:#fff;border-radius:22px;box-shadow:var(--sh-lg);z-index:90;opacity:0;pointer-events:none;transition:.24s}
  .altpick.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .altpick .ap-b{padding:20px 22px 22px}
  .altpick .apnote{font-size:13px;color:var(--muted);margin:0 0 14px}
  .altpick .card{pointer-events:none}
  .altpick .cardwrap,.altpick .apcur{width:var(--cardw);max-width:100%}
  .altpick .cardwrap:hover .card{border-color:var(--plum);box-shadow:0 4px 10px rgba(94,0,71,.16)}
  .altnote{border-radius:13px;padding:12px 14px;margin-bottom:14px;background:var(--plum-050);
    border:1.5px solid #E7D3E0}
  .altnote.mixed{background:var(--warn-bg);border-color:var(--warn-ln)}
  .altnote .an-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;color:var(--plum);margin-bottom:6px}
  .altnote.mixed .an-h{color:var(--warn-t)}
  .altnote .an-p{font-size:12.5px;line-height:1.55;color:#3c3540}
  .altnote .an-p b{color:var(--plum)} .altnote.mixed .an-p b{color:var(--warn-t)}
  .altnote .an-p2{font-size:11.5px;color:var(--muted);margin-top:7px;padding-top:7px;
    border-top:1px solid rgba(0,0,0,.07)}
  .apcur{border:1.5px dashed var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:16px;background:var(--panel);font-size:12.5px;color:var(--muted)}
  .apcur b{color:var(--ink)}

  /* ---------- Interaktions-Popup ---------- */
  .scrim{position:fixed;inset:0;background:rgba(30,10,26,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.22s;z-index:80}
  .scrim.open{opacity:1;pointer-events:auto}
  .ixmodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(780px,94vw);max-height:92vh;overflow:auto;
    background:#fff;border-radius:22px;box-shadow:var(--sh-lg);z-index:90;opacity:0;pointer-events:none;transition:.24s}
  .ixmodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .ix-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
  .ix-h .ixic{width:36px;height:36px;border-radius:10px;background:var(--plum-050);display:grid;place-items:center;color:var(--plum);flex:none}
  .ix-h h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--plum)}
  .ix-h .x{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
  .ix-h .x:hover{border-color:var(--plum);color:var(--plum)}
  .ix-b{padding:22px 24px 24px}
  .ixpair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0 46px;align-items:start}
  @media(max-width:620px){.ixpair{grid-template-columns:1fr;gap:16px}}
  .ixdrug{border:2px solid var(--plum);border-radius:14px;padding:12px 14px;background:#fff}
  .ixdrug.two{grid-column:2;margin-top:64px}
  @media(max-width:620px){.ixdrug.two{grid-column:1;margin-top:0}}
  .ixdrug .idl{font-size:11.5px;color:var(--muted);font-weight:650}
  .ixdrug .idn{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
  .ixdrug .idu{font-size:11.5px;color:var(--muted);margin-top:5px}
  .ixdrug .idu b{color:#4b4451}
  #ixsvg{position:absolute;inset:0;pointer-events:none}
  .ixfound{margin-top:22px;border:1.5px solid var(--line2);border-radius:16px;padding:18px 20px;background:var(--panel)}
  .ixfound .ixft{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
  .ixcols{display:grid;grid-template-columns:repeat(3,1fr);gap:0 20px}
  @media(max-width:620px){.ixcols{grid-template-columns:1fr;gap:16px}}
  .ixcol{padding:0 4px}
  .ixcol+.ixcol{border-left:1px solid var(--line2);padding-left:20px}
  @media(max-width:620px){.ixcol+.ixcol{border-left:0;padding-left:4px;border-top:1px solid var(--line2);padding-top:14px}}
  .ixcol h4{margin:0 0 7px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--plum)}
  .ixcol p{margin:0;font-size:13.5px;line-height:1.5;color:#3c3540}
  .ixsrc{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}

  /* ---------- Handy-Ansicht (Merkliste) ---------- */
  .phonewrap{display:flex;justify-content:center;padding:4px 0 10px}
  .phone{width:392px;max-width:100%;background:var(--panel);border:11px solid #1d1520;border-radius:44px;padding:16px 13px 22px;box-shadow:0 26px 60px -22px rgba(40,0,35,.55)}
  .phone .notch{width:104px;height:6px;border-radius:99px;background:#1d1520;opacity:.32;margin:0 auto 15px}
  .phone h2{margin:0 0 15px;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--plum);line-height:1.2;padding:0 4px}
  .phone .card{margin-bottom:11px;border-radius:17px}
  .phone .chead{padding:14px 15px;gap:11px}
  .phone .pill{width:0;height:0;display:none}
  .phone .cname{font-size:19px}
  .phone .cbrands{font-size:12.5px;white-space:normal}
  .phone .cstate{width:58px}
  .phone .cstate svg.st{width:40px;height:40px}
  .phone .cstate .sw{font-size:11px;letter-spacing:.04em}
  .phone .cchev{display:none}
  .phone .mchips{display:flex;flex-wrap:wrap;gap:7px;padding:0 15px 15px}
  .mchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:750;border:1.5px solid}
  .mchip svg{width:15px;height:15px;flex:none}
  .mchip.b-ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-t)}
  .mchip.b-warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn-t)}
  .mchip.b-crit{background:var(--crit-bg);border-color:var(--crit-ln);color:var(--crit-t)}

  /* ---------- Medikamentenkarte (Design-Vorlage: wei&szlig;e Box, Status rechts) ---------- */
  /* EINE Kartengroesse ueberall: feste Breite, identische Innenmasse */
  .card{width:var(--cardw);max-width:100%;border-radius:18px;border:1px solid var(--line);margin-bottom:14px;
    box-shadow:var(--sh);background:#fff;transition:opacity .2s,box-shadow .2s}
  .card:hover{box-shadow:0 4px 8px rgba(30,10,30,.06),0 18px 40px -18px rgba(40,0,35,.32)}
  .c-ok,.c-warn,.c-crit{background:#fff}
  .card.faded{opacity:.42;filter:grayscale(.7)}
  .chead{position:relative;display:flex;align-items:center;gap:10px;padding:13px 30px 13px 13px;cursor:pointer;min-width:0}
  .pill{flex:none;width:42px;height:42px}
  .cmain{flex:1 1 auto;min-width:0;overflow:hidden}
  .cname{font-size:15.5px;font-weight:800;letter-spacing:-.004em;line-height:1.15;color:#221c26;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cbrands{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cbrands b{color:#4b4451;font-weight:700}
  .cbrands .nobr{color:var(--faint);font-style:italic}
  /* feste Spalte + zentriert -> Symbole aller Ratings exakt untereinander */
  .cstate{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .cstate svg.st{width:29px;height:29px;flex:none;display:block}
  .cstate .sw{font-size:11px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;text-align:center;line-height:1.1}
  .cchev{position:absolute;right:10px;bottom:9px;width:18px;height:18px;color:var(--faint);transition:transform .2s}
  .card.open .cchev{transform:rotate(180deg)}
  .cbody{display:none;padding:0 13px 14px}
  .card.open .cbody{display:block}
  .cdiv{height:1px;background:var(--line);margin:0 0 12px}

  /* Sub-Themen: farbig eingef&auml;rbt nach Zustand */
  .infogrid{display:grid;grid-template-columns:1fr;gap:8px}
  .ibox{border:1.5px solid;border-radius:12px;padding:10px 11px;display:flex;align-items:center;gap:9px;text-align:left}
  .ibox.b-ok{background:var(--ok-bg);border-color:var(--ok-ln)}
  .ibox.b-warn{background:var(--warn-bg);border-color:var(--warn-ln)}
  .ibox.b-crit{background:var(--crit-bg);border-color:var(--crit-ln)}
  .ibox .ic{flex:none;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(30,10,30,.09)}
  .ibox .ic svg{width:19px;height:19px}
  .ibox .itx{min-width:0}
  .ibox .il{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2}
  .ibox .iv{margin-top:2px;font-size:13px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
  .t-ok{color:var(--ok-t)}.t-warn{color:var(--warn-t)}.t-crit{color:var(--crit-t)}
  .s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-crit{color:var(--crit)}

  .btn{border-radius:11px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--line2);background:#fff;color:var(--ink);font-size:13px;font-weight:750;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:.15s}
  .btn:hover{border-color:var(--plum);color:var(--plum)}
  .btn-plum{background:var(--plum);color:#fff;border-color:var(--plum)}
  .btn-plum:hover{background:var(--plum-700);color:#fff}
  .btn-wide{width:100%;justify-content:center;margin-top:14px}
  .btn.act-on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-t)}
  .btn.act-fav{background:#FEF8EC;border-color:#E8B23A;color:#8a6100}
  .btn:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

  /* ---------- Suche / Filter ---------- */
  .toolbar{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px}
  .searchwrap{position:relative}
  .searchwrap svg{position:absolute;left:13px;top:12px;color:var(--faint)}
  .searchwrap input{width:100%;font:inherit;font-size:14.5px;padding:11px 12px 11px 40px;border:1.5px solid var(--line2);border-radius:12px;background:var(--panel)}
  .searchwrap input:focus{outline:0;border-color:var(--plum);background:#fff;box-shadow:0 0 0 4px var(--plum-100)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .fchip{border:1.5px solid var(--line2);background:#fff;font-size:12px;font-weight:700;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
  .fchip:hover{border-color:var(--plum);color:var(--plum)}
  .fchip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
  .fchip.f-crit[aria-pressed="true"]{background:var(--crit);border-color:var(--crit)}
  .fchip.f-warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
  .fchip.f-fav[aria-pressed="true"]{background:var(--gold,#E8B23A);border-color:#E8B23A;color:#3d2a00}
  .fav{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--faint)}
  .fav.on{color:#E8B23A;border-color:#E8B23A;background:#FEF8EC}
  .listcount{font-size:12px;color:var(--muted);margin:2px 0 10px 4px}

  /* ---------- Split: Liste | Arbeitsfl&auml;che ---------- */
  .split{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);gap:14px;align-items:start}
  .dragarrow{position:sticky;top:24px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:96px}
  .dragarrow .daline{flex:1;width:2px;min-height:26px;background:linear-gradient(var(--line2),transparent)}
  .dragarrow .dahead{width:48px;height:48px;border-radius:50%;background:var(--plum);color:#fff;
    display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(94,0,71,.7);animation:danudge 2.4s ease-in-out infinite}
  .dragarrow .dahead svg{color:#fff}
  .dragarrow .datx{font-size:11.5px;font-weight:800;line-height:1.35;text-align:center;color:var(--plum);letter-spacing:.01em}
  .dragarrow .datx span{font-weight:600;color:var(--muted)}
  @keyframes danudge{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
  @media(prefers-reduced-motion:reduce){.dragarrow .dahead{animation:none}}
  @media(max-width:1180px){.split{grid-template-columns:1fr} .dragarrow{display:none}}
  .col-scroll{max-height:78vh;overflow:auto;padding-right:4px}
  .wsurface{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:20px 20px 22px;position:relative;min-height:420px}
  .wstitle{font-size:clamp(24px,2.9vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 4px;color:#221c26}
  .wssub{font-size:13px;color:var(--muted);margin:0 0 18px}
  /* Karten schmaler halten &mdash; rechts bleibt ein Streifen fuer Aktionen und Interaktionen */
  .wscols{display:block;position:relative;z-index:1}
  /* Legende: zurueckhaltend unter der Liste */
  .wslegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px;
    padding-top:16px;border-top:1px solid var(--line)}
  @media(max-width:820px){.wslegend{grid-template-columns:1fr}}
  .wsleg{border-radius:11px;padding:9px 11px;background:#fff;border:1.5px solid var(--line2);
    text-align:left;font:inherit;cursor:pointer;transition:.14s;display:block;width:100%}
  .wsleg:hover{border-color:var(--plum);background:var(--plum-050)}
  .wsleg .lr1{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .wsleg .lr1 svg{width:15px;height:15px}
  .wsleg .n{margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px;font-weight:800;
    border-radius:999px;min-width:21px;height:19px;padding:0 6px;display:grid;place-items:center;letter-spacing:0;color:#fff}
  .wsleg .lr2{font-size:11.5px;font-weight:600;line-height:1.35;margin-top:4px;color:var(--muted)}
  .wsleg .lr3{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:750;margin-top:6px;color:var(--plum);opacity:.85}
  .wsleg .lr3 svg{width:12px;height:12px}
  .wsleg:hover .lr3{opacity:1}
  .wsleg.h-crit .lr1,.wsleg.h-crit .lr1 svg{color:var(--crit-t)} .wsleg.h-crit .n{background:var(--crit)}
  .wsleg.h-warn .lr1,.wsleg.h-warn .lr1 svg{color:var(--warn-t)} .wsleg.h-warn .n{background:var(--warn)}
  .wsleg.h-ok .lr1,.wsleg.h-ok .lr1 svg{color:var(--ok-t)} .wsleg.h-ok .n{background:var(--ok)}
  /* Aktionsicons im Randstreifen rechts der Karte */
  .wsactions{position:absolute;top:50%;transform:translateY(-50%);right:-44px;z-index:4;
    display:flex;flex-direction:column;gap:6px}
  .wsactions .wbtn{width:34px;height:34px;border-radius:10px}
  .wbtn.del:hover{border-color:var(--crit);color:var(--crit);background:var(--crit-bg)}
  .replrow{display:flex;align-items:center;justify-content:center;gap:7px;margin:-2px 0 8px;color:var(--plum);
    font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .wsurface.hot{outline:2px dashed var(--plum);outline-offset:-6px;background:var(--plum-050)}
  .ws-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ws-head h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--plum);padding:6px 14px;border-radius:999px}
  #wsvg{position:absolute;inset:0;pointer-events:none;z-index:6}
  #wsvg .ixbtn{transition:transform .15s;transform-origin:center}
  #wsvg .ixbtn:hover{transform:scale(1.12)}
  #wsvg .ixbtn.crit{animation:ixpulse 1.9s ease-in-out infinite}
  @keyframes ixpulse{0%,100%{opacity:1}50%{opacity:.72}}
  @media(prefers-reduced-motion:reduce){#wsvg .ixbtn.crit{animation:none}}
  .wrow{position:relative;z-index:1;display:block;width:var(--cardw);max-width:100%;margin-bottom:14px}
  .wrow.menuopen,.altpair.menuopen{z-index:60}
  .wrow .card{min-width:0;margin-bottom:0}
  .wtools{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:14px;position:relative}
  .wbtn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .wbtn.good{border-color:var(--ok-ln);background:var(--ok-bg);color:var(--ok)}
  .wbtn.alt{border-color:var(--warn-ln);background:var(--warn-bg);color:var(--warn-t)}
  .wbtn:hover{border-color:var(--plum);color:var(--plum)}
  .altmenu{position:absolute;top:56px;right:0;z-index:70;background:#fff;border:1.5px solid var(--line2);border-radius:14px;box-shadow:var(--sh-lg);min-width:250px;padding:7px;display:none}
  .altmenu.open{display:block}
  .altmenu .amh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:7px 10px 5px}
  .altmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer}
  .altmenu button:hover{background:var(--plum-050)}
  .altmenu button b{font-size:13.5px;font-weight:750}
  .altmenu button span{font-size:11.5px;color:var(--muted)}
  .altpair{position:relative;z-index:1;display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
  .altpair>div{flex:1;min-width:0}
  .altarrow{flex:none;display:grid;place-items:center;color:var(--plum);width:34px}
  .ws-empty{border:2px dashed var(--line2);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}

  /* ---------- Detailseite ---------- */
  .detail-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .glchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 13px;border-radius:999px;color:#fff}
  .gl-cpic{background:#1f6fb2}.gl-dpwg{background:#7a1668}.gl-fda{background:#4a6b18}.gl-cpnds{background:#a0522d}
  .doserec{font-size:21px;font-weight:800;line-height:1.35;letter-spacing:-.015em;color:#241d27}
  .strength{font-size:13.5px;color:#3c3540;margin-top:12px}
  .strength b{color:var(--plum)}
  /* Eine Box fuer Beurteilung und Leitlinie */
  .abox{border-radius:16px;border:2px solid;overflow:hidden;background:#fff;margin:2px 0 4px}
  .abox.s-crit{border-color:var(--crit)} .abox.s-warn{border-color:var(--warn)} .abox.s-ok{border-color:var(--ok)}
  .abox .ab-h{display:flex;align-items:center;gap:9px;padding:10px 14px;color:#fff;
    font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  .abox .ab-h svg{color:#fff}
  .abox.s-crit .ab-h{background:#D02A2A} .abox.s-warn .ab-h{background:#E08000} .abox.s-ok .ab-h{background:#12A150}
  .abox .ab-badge{margin-left:auto;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;
    font-size:11.5px;letter-spacing:.05em}
  .abox .ab-plain{padding:13px 15px;font-size:14.5px;line-height:1.55;color:#2e2733}
  .abox .ab-sep{height:1px;background:var(--line);margin:0 15px}
  .abox .ab-g{padding:12px 15px 14px;background:var(--plum-050)}
  .abox .ab-gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;color:var(--plum);margin-bottom:7px}
  .abox .ab-gh svg{color:var(--plum)}
  .abox .ab-gt{font-family:var(--mono);letter-spacing:.02em;background:#fff;border:1px solid #E7D3E0;
    border-radius:7px;padding:2px 8px}
  .abox .ab-gx{font-size:14px;line-height:1.6;color:#2e2733}
  .abox .ab-gs{font-size:11px;color:var(--muted);margin-top:7px}
  .abox .ab-none{padding:11px 15px 13px;font-size:12.5px;color:var(--faint);font-style:italic}
  .reccard{margin-top:14px;border:1.5px solid var(--plum);border-radius:14px;overflow:hidden;background:var(--plum-050)}
  .reccard .rech{display:flex;align-items:center;gap:8px;background:var(--plum);color:#fff;padding:9px 14px;
    font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  .reccard .rech svg{color:#fff}
  .reccard .recgt{padding:11px 14px 0;font-size:12px;font-weight:800;color:var(--plum);
    letter-spacing:.04em;text-transform:uppercase}
  .reccard .recgt b{font-family:var(--mono)}
  .reccard .rectx{padding:5px 14px 11px;font-size:14px;line-height:1.55;color:#2e2733}
  .reccard .recsrc{padding:0 14px 12px;font-size:11px;color:var(--muted)}
  .protext{margin-top:14px;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#37303c;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px}
  .srclink{color:var(--blue);font-weight:700;text-decoration:underline;font-size:13px}
  .srcrow{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap}

  /* Gen-Karte Variante D: kompakt, Symbolpaar in der Kopfzeile, Skala unten */
  .genegrid{display:grid;grid-template-columns:repeat(auto-fill,var(--cardw));justify-content:start;gap:14px}
  @media(max-width:420px){.genegrid{grid-template-columns:1fr}}
  .genebox{background:#fff;border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 15px 13px;text-align:left;cursor:pointer;transition:.15s}
  /* Pastellton der Karte zeigt den Zustand des Gens auf einen Blick */
  .genebox.b-crit{background:var(--crit-bg);border-color:var(--crit-ln)}
  .genebox.b-warn{background:var(--warn-bg);border-color:var(--warn-ln)}
  .genebox.b-ok{background:var(--ok-bg);border-color:var(--ok-ln)}
  .genebox.b-ultra{background:#E8F5EC;border-color:#B6DFC6}
  /* auf Pastellgrund werden nur die INAKTIVEN Segmente aufgehellt -
     das aktive muss seine Ampelfarbe behalten */
  .genebox.b-crit .gscale .gs-seg:not(.on),.genebox.b-warn .gscale .gs-seg:not(.on),
  .genebox.b-ok .gscale .gs-seg:not(.on),.genebox.b-ultra .gscale .gs-seg:not(.on){background:rgba(255,255,255,.8)}
  .genebox .gb-ic{background:#fff!important}
  .genebox:hover{border-color:var(--plum);box-shadow:0 4px 10px rgba(94,0,71,.14)}
  .genebox.flat{cursor:default}.genebox.flat:hover{border-color:var(--line);box-shadow:var(--sh)}
  .gb-top{display:flex;align-items:center;gap:11px}
  .gb-ic{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center}
  .gb-ic svg{width:34px;height:44px}
  .gi-ok{background:var(--ok-bg);color:var(--ok-t)}.gi-warn{background:var(--warn-bg);color:var(--warn-t)}
  .gi-crit{background:var(--crit-bg);color:var(--crit-t)}.gi-ultra{background:#E8F5EC;color:#0b6b36}
  .gb-tx{flex:1;min-width:0}
  .genebox .gn{font-family:var(--mono);font-size:16px;font-weight:800;line-height:1.1;color:var(--ink)}
  .genebox .gs{font-size:14px;font-weight:800;margin-top:3px;line-height:1.2;letter-spacing:-.01em}
  .genepair{flex:none;display:flex;gap:5px;width:52px}
  /* Symbolpaar links, Skala rechts - oben ausgerichtet, damit das Paar
     auf einer Linie mit den Segmenten sitzt und nicht mit den Beschriftungen */
  .gsrow{display:flex;align-items:flex-start;gap:14px;margin-top:14px}
  .gsrow .genepair{padding-top:1px}
  .gsbar{flex:1;min-width:0}
  /* Metabolisierertyp bricht nur an sinnvollen Stellen und nie mitten im Wort */
  .genebox .gs{overflow-wrap:normal;word-break:keep-all;text-wrap:balance}
  .genepair svg{flex:1}
  .gscale{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
  .gs-seg{height:7px;border-radius:2px;background:#E4E0E7}
  .gs-seg.s0.on{background:var(--crit)}.gs-seg.s1.on{background:var(--warn)}
  .gs-seg.s2.on{background:var(--ok)}.gs-seg.s3.on{background:#0b6b36}
  /* Beschriftung einzeilig: Grossbuchstaben und Sperrung wurden zu breit und
     haben Woerter mitten im Wort umgebrochen */
  .gs-lab{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:7px}
  .gs-lab span{font-size:11px;font-weight:700;letter-spacing:-.01em;color:var(--faint);
    text-align:center;line-height:1.15;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gs-lab span.on{color:var(--ink);font-weight:800}
  /* Allel-Details in der Gen-Karte */
  .gexp{display:none;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  .genebox.open .gexp{display:block}
  .genebox.open .gchev{transform:rotate(180deg)}
  .gchev{flex:none;width:17px;height:17px;color:var(--faint);transition:transform .2s}
  .gsec{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--plum);margin:0 0 8px}
  .gsec.sp{margin-top:14px}
  .gyour{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
  .gyour .ga{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;border:1.5px solid;font-size:12.5px}
  .gyour .ga b{font-family:var(--mono);font-size:13.5px;font-weight:800}
  .gyour .ga span{margin-left:auto;font-weight:700;font-size:11.5px}
  .ga.f-ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-t)}
  .ga.f-warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn-t)}
  .ga.f-crit{background:var(--crit-bg);border-color:var(--crit-ln);color:var(--crit-t)}
  .ga.f-ultra{background:#E8F5EC;border-color:#B6DFC6;color:#0b6b36}
  .achips{display:flex;flex-wrap:wrap;gap:5px}
  .ach{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);color:var(--muted)}
  .ach.mine{background:var(--plum);border-color:var(--plum);color:#fff}
  .ach.f-ok{border-color:var(--ok-ln)}.ach.f-warn{border-color:var(--warn-ln)}.ach.f-crit{border-color:var(--crit-ln)}
  .ach.mine.f-ok,.ach.mine.f-warn,.ach.mine.f-crit,.ach.mine.f-ultra{background:var(--plum);border-color:var(--plum);color:#fff}
  .gmore{margin-top:12px;width:100%;justify-content:center}

  /* Gen-Modal */
  .genemodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(820px,94vw);max-height:92vh;overflow:auto;
    background:#fff;border-radius:22px;box-shadow:var(--sh-lg);z-index:90;opacity:0;pointer-events:none;transition:.24s}
  .genemodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .genemodal .gm-b{padding:20px 22px 24px}
  /* ---- Erklaer-Popup ---- */
  .infomodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(600px,94vw);max-height:88vh;overflow:auto;
    background:#fff;border-radius:20px;box-shadow:0 40px 90px -30px rgba(30,0,26,.6);opacity:0;pointer-events:none;transition:.22s;z-index:90}
  .infomodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .infomodal .if-b{padding:20px 24px 24px;font-size:14px;line-height:1.6;color:#3c3540}
  .infomodal .if-b p{margin:0 0 12px} .infomodal .if-b p:last-child{margin-bottom:0}
  .infomodal .if-b b{color:var(--plum)}
  .infomodal .if-b .ex{background:var(--plum-050);border-left:3px solid var(--plum);border-radius:0 11px 11px 0;
    padding:11px 14px;font-size:13px;margin:0 0 12px}
  /* Fragezeichen-Knopf */
  .ihelp{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--plum);background:#fff;color:var(--plum);
    font:inherit;font-size:12px;font-weight:800;line-height:1;cursor:pointer;display:inline-grid;place-items:center;
    vertical-align:middle;margin-left:6px;padding:0;transition:.14s}
  .ihelp:hover{background:var(--plum);color:#fff}
  .hero .ihelp,.wsleg .ihelp,.kpi .ihelp{border-color:currentColor;color:inherit;background:rgba(255,255,255,.001)}
  .hero .ihelp{border-color:var(--plum);color:var(--plum)}
  .wsleg .ihelp:hover,.kpi .ihelp:hover{background:#fff;color:var(--ink)}

  .genelist{margin-top:6px}
  .gitem{border:1.5px solid var(--line2);border-radius:14px;margin-bottom:9px;background:#fff}
  .gitem-h{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer}
  .gitem-h .gname{font-family:var(--mono);font-weight:800;font-size:15px}
  .gitem-h .gstat{font-size:13px;font-weight:750}
  .gitem-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
  .gitem.open .chev{transform:rotate(180deg)}
  .gitem-b{display:none;padding:0 15px 15px}
  .gitem.open .gitem-b{display:block}
  /* ---- Navigations-Gruppen ---- */
  .nav-group{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#c79cb8;
    padding:16px 14px 6px;line-height:1.2}
  .nav-group:first-child{padding-top:0}
  .nav-badge.nb-plain{background:rgba(255,255,255,.2);color:#fff}

  /* ---- Geltungsbereich-Hinweis: eigene Liste vs. Datenbank ---- */
  .scope{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:13px 16px;margin:0 0 18px;
    font-size:13.5px;line-height:1.5;border:1.5px solid}
  .scope svg{flex:none;margin-top:1px}
  .scope a{color:inherit;font-weight:800}
  .scope-db{background:var(--plum-050);border-color:#E7D3E0;color:#4a3c46}
  .scope-db svg{color:var(--plum)} .scope-db b{color:var(--plum)}
  .scope-me{background:var(--ok-bg);border-color:var(--ok-ln);color:#2c4638}
  .scope-me svg{color:var(--ok-t)} .scope-me b{color:var(--ok-t)}

  /* ---- Grosse Filterbuttons ---- */
  .bigfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px;margin-bottom:16px}
  .bf{text-align:left;border-radius:15px;padding:13px 15px 14px;cursor:pointer;border:2px solid transparent;
    box-shadow:0 2px 6px rgba(30,10,30,.16);transition:.14s;font:inherit;color:#fff}
  .bf .bfn{display:block;font-size:28px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .bf .bfl{display:block;font-size:14.5px;font-weight:800;margin-top:5px;line-height:1.2}
  .bf .bft{display:block;font-size:11.5px;font-weight:600;line-height:1.35;margin-top:4px;color:rgba(255,255,255,.92)}
  .bf-all,.bf-watch{background:var(--plum)} .bf-crit{background:#D02A2A}
  .bf-warn{background:#E08000} .bf-ok{background:#12A150}
  .bf:hover{transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(30,10,30,.5)}
  /* aktiv gewaehlt: weisser Ring plus dunklerer Grundton */
  .bf[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--ink),0 8px 20px -8px rgba(30,10,30,.5)}
  .bf-all[aria-pressed="true"],.bf-watch[aria-pressed="true"]{background:var(--plum-700)}
  .bf-crit[aria-pressed="true"]{background:#A81E1E}
  .bf-warn[aria-pressed="true"]{background:#B36400}
  .bf-ok[aria-pressed="true"]{background:#0B7B3C}

  /* ---- Startblock und Aufforderung ---- */
  .start{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:22px 24px 24px;margin-bottom:20px}
  .start .st-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px}
  .start .st-head>div{flex:1;min-width:260px}
  .start .st-eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ok-t);margin-bottom:8px}
  .start h2{margin:0;font-size:clamp(22px,2.7vw,30px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
  .start p{margin:8px 0 0;font-size:14.5px;color:var(--muted);line-height:1.5;max-width:60ch}
  .start-empty{text-align:center;padding:38px 26px 34px;border:2px dashed #E0C9D8;background:var(--plum-050)}
  .start-empty .st-ic{width:74px;height:74px;border-radius:50%;background:#fff;border:2px solid #E7D3E0;
    display:grid;place-items:center;margin:0 auto 16px;color:var(--plum)}
  .start-empty h2{max-width:24ch;margin:0 auto}
  .start-empty p{margin:11px auto 0}
  .cta{flex:none;border:0;border-radius:13px;background:var(--plum);color:#fff;cursor:pointer;font:inherit;
    font-size:15.5px;font-weight:800;padding:15px 24px;display:inline-flex;align-items:center;gap:10px;
    box-shadow:0 6px 18px -6px rgba(94,0,71,.6);transition:.14s}
  .cta:hover{background:var(--plum-700)} .cta svg{color:#fff}
  .start-empty .cta{margin-top:20px}

const D_TXT=["Abacavir is not recommended. High risk of hypersensitivity (~6% of patients) due to the presence of at least one *57:01 allele.","Avoid amitriptyline use.","Avoid moderate and strong CYP2D6 inhibitors. Initiate therapy with recommended standard of care dosing.","Avoid tricyclic use due to potential lack of efficacy. Consider alternative drug not metabolized by CYP2D6. If a TCA is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Utilize therapeutic drug monitoring to guide dose adjustments.","Be alert to reduced efficacy or select alternative drug (e.g., methylphenidate, clonidine).","Be extra alert to insufficient response. Consider dose increase by 200%.","Be extra alert to insufficient response. Consider dose increase by 400%.","Be extra alert to insufficient response. Consider dose increase by 50-100%.","Check INR more frequently.","Choose an alternative agent that is not dependent on CYP2C19 metabolism as primary therapy in lieu of voriconazole. Such agents include isavuconazole, liposomal amphotericin B, and posaconazole.","Consider a 25-50% reduction of recommended starting dose and titrate to response or use an alternative drug not metabolized by CYP2D6.","Consider an alternative drug not predominantly metabolized by CYP2C19.","In patients with a heart failure, select alternative drug (e.g., bisoprolol, carvedilol) or reduce dose by 75%. For other indications, be alert to ADEs (e.g., bradycardia, cold extremities) or select alternative drug (e.g., atenolol, bisoprolol).","Increase starting dose 1.5 to 2 times recommended starting dose. Total starting dose should not exceed 0.3mg/kg/day. Use therapeutic drug monitoring to guide dose adjustments.","Increased risk for reduced response to clopidogrel. Consider alternative drug. Prasugrel is not or to a much smaller extent metabolized by CYP2C19 but is associated with an increased bleeding risk compared to clopidogrel","Increased risk of cisplatin-induced ototoxicity (hearing loss) in pediatric patients. Alternative treatments may be prescribed when they have demonstrated equal efficacy, manageable and acceptable toxicity, less ototoxicity, and are considered options within the current standards of care.","Initiate therapy with recommended starting dose. If patient does not respond to recommended maintenance dosing, consider alternative drug not predominantly metabolized by CYP2C19.","Insufficient data to allow calculation of dose adjustment. Select alternate drug - not tramadol or codeine - or be alert to symptoms of insufficient pain relief.","Prescribe a lower dose or consider an alternative statin (e.g. pravastatin or rosuvastatin); consider routine CK surveillance.","Reduce dose by 50% or select alternative drug (e.g., flupenthixol, quetiapine, olanzapine, clozapine).","Reduce dose by 50% or select alternative drug (e.g., pimozide, flupenthixol, fluphenazine, quetiapine, olanzapine, clozapine).","Reduce dose by 50%, record ECG, monitor plasma concentration.","Reduce dose by 70%, record ECG, monitor plasma concentration.","Reduce initial dose by 30% for patients receiving more than 250 mg/m2. Increase dose in response to neutrophil count.","Reduce maximum dose to 10 mg/day (67% of the maximum recommended daily dose).","Select alterantive drug. Fluorouracil or capecitabine are not suitable alternatives because both are also metabolized by DPD.","Select alterantive drug. Tegafur is not a suitable alternative because this drug is also metabolized by DPD.","Select alternative drug (e.g., acetaminophen, NSAID, morphine-not tramadol or oxycodone) or be alert to symptoms of insufficient pain relief.","Select alternative drug (e.g., citalopram, sertraline) or adjust dose to clinical response and monitor (O-desmethyl)venlafaxine plasma concentration.","Select alternative drug (e.g., quetiapine,olanzapine, clozapine) or be extra alert to ADEs and adjust dose to clinical response.","Select alternative drug (not oxycodone or codeine) or be alert to symptoms of insufficient pain relief.","Select alternative drug not predominantly metabolized by CYP2D6.","Select alternative drug or reduce dose by 50%. Increase dose in response of hematologic monitoring and efficacy.","Select and alternative drug not predominantly metabolized by CYP2D6 (i.e. granisetron).","Start with reduced doses (reduce by 30-50%) and adjust doses of thioguanine based on degree of myelosuppression and disease-specific guidelines. Allow 2-4 weeks to reach steady state after each dose adjustment. In setting of myelosuppression, and depending on other therapy, emphasis should be on reducing thioguanine over other agents.","Start with reduced doses (start at 30-70% of full dose) and adjust doses based on degree of myelosuppression and disease-specific guidelines. Allow 2-4 weeks to reach steady state after each dose adjustment. In those who require a dosage reduction based on myelosuppression, the median dose may be ~40% lower (44 mg/m2) than that tolerated in wild-type patients (75 mg/m2). In setting of myelosuppression, and depending on other therapy, emphasis should be on reducing mercaptopurine over other agents.","There is no need to avoid prescribing of atazanavir based on UGT1A1 genetic test result. Inform the patient that some patients stop atazanavir because of jaundice (yellow eyes and skin), but that this patient&rsquo;s genotype makes this unlikely.","Use standard loading dose and reduce maintenance dose by 25%. Evaluate response and serum concentration after 7-10 days. Be alert to ADEs (e.g., ataxia, nystagmus, dysarthria, sedation)."];

  grp.sort((x,y)=>RANK[listSev(x)]-RANK[listSev(y)]||DRUGS[x].name.localeCompare(DRUGS[y].name));

  if(i<0)workspace.push(id); else {workspace.splice(i,1);delete altChoice[id];}
  render();

  const on=workspace.includes(id);
  return `<button class="heartbtn ${on?'on':''}" onclick="toggleWs('${id}',event)"

  return `<div class="lirow">${cardHtml(id,ctx)}${addBtnHtml(id)}</div>`;

/* Reihenfolge der Gene: langsam, intermedi&auml;r, normal, ultraschnell */
const GORDER=[0,1,2,3];
function sortedGenes(){
  return Object.keys(PHENO).sort((a,b)=>
    GORDER.indexOf(PHENO[a].lvl)-GORDER.indexOf(PHENO[b].lvl)||a.localeCompare(b));
}

function geneReportCard(g){
  const lvl=PHENO[g].lvl, sv=GSEV[lvl], gn=GENO[g];
  const tested=testedAlleles(g), mine=geneCopies(g).map(c=>c[0]);
  const chips=tested.map(a=>{const fn=alleleFn(g,a),c=AFNC[fn]||'warn';
    const isMine=mine.some(m=>m===a);
    return `<span class="ach f-${c} ${isMine?'mine':''}" title="${a}: ${fn}">${a}</span>`;}).join('');
  return `<div class="rgene s-${sv}">
    <div class="rg-card">${geneCardHtml(g,{flat:true})}</div>
    <div class="rg-info">
      <div class="rg-type t-${sv==='ultra'?'ok':sv}">${LVL[lvl].t}

      <div class="achips">${chips}</div>
      <div class="rg-meta">Genotyp <b class="mono">${gn?gn.genotyp:'&mdash;'}</b>
        &middot; beeinflusst <b>${GENE_DRUGS[g]||0}</b> Wirkstoffe der Datenbank
        &middot; Leitlinien: ${(ANNOS[g]&&ANNOS[g].length)?'CPIC / DPWG':'&mdash;'}</div>
    </div>
  </div>`;
}

function plainSentence(g){
  const cps=geneCopies(g), fns=cps.map(c=>c[1]);
  const nNorm=fns.filter(f=>f==='normal').length;
  const nOff=fns.filter(f=>f==='keine'||f==='Mangel').length;
  const nLow=fns.filter(f=>f==='reduziert'||f==='stark reduziert').length;
  const nUp=fns.filter(f=>f==='gesteigert').length;
  let was;
  if(nNorm===2)was="Beide Kopien arbeiten normal. Dein K&ouml;rper verarbeitet die betroffenen Medikamente wie erwartet.";
  else if(nUp===2)was="Beide Kopien arbeiten schneller als normal. Dein K&ouml;rper verarbeitet die betroffenen Medikamente rascher &mdash; sie k&ouml;nnen zu schwach wirken.";
  else if(nOff===2)was="Beide Kopien sind ausgefallen. Dein K&ouml;rper kann die betroffenen Medikamente praktisch nicht verarbeiten.";
  else if(nOff===1&&nNorm===1)was="Eine Kopie ist ausgefallen, die andere arbeitet normal. Zusammen ergibt das etwa die halbe Leistung &mdash; betroffene Medikamente bleiben l&auml;nger im K&ouml;rper.";
  else if(nLow===2)was="Beide Kopien arbeiten eingeschr&auml;nkt. Betroffene Medikamente bleiben deutlich l&auml;nger im K&ouml;rper als &uuml;blich.";
  else if(nLow===1&&nNorm===1)was="Eine Kopie arbeitet langsamer, die andere normal. Betroffene Medikamente bleiben etwas l&auml;nger im K&ouml;rper.";
  else if(nOff===1&&nLow===1)was="Eine Kopie ist ausgefallen, die andere arbeitet nur eingeschr&auml;nkt. Es bleibt kaum Leistung &uuml;brig.";
  else was="Wie sich deine zwei Kopien zusammen auswirken, steht unten in der Bewertung des Gens.";
  return `Von jedem Elternteil hast du eine Kopie des Gens <b>${g}</b> geerbt. ${was}`;
}

const GSEV={0:'crit',1:'warn',2:'ok',3:'ultra'};

/* DNA-Helix in Zustandsfarbe: Sprossen zeigen die Funktion,
   gebrochene Sprossen = Funktionsverlust, dichte = gesteigerte Aktivit&auml;t */
function helix(lvl){
  const c=GCOL[lvl];
  const rungs=[[7.5,5.4],[12,7.6],[16.5,5.4],[27.5,5.4],[32,7.6],[36.5,5.4]];
  const ok={0:[],1:[0,1,2],2:[0,1,2,3,4,5],3:[0,1,2,3,4,5]}[lvl];
  const sw=lvl===3?2.6:2.1;
  let bars='';
  rungs.forEach((r,i)=>{
    const [y,hw]=r, live=ok.indexOf(i)>=0;
    if(live){
      bars+=`<path d="M${14-hw} ${y}H${14+hw}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`;
      if(lvl===3)bars+=`<path d="M${14-hw} ${y+1.9}H${14+hw}" stroke="${c}" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>`;
    }else{
      /* gebrochene Sprosse */
      bars+=`<path d="M${14-hw} ${y}h${hw*0.42}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" opacity=".55"/>
             <path d="M${14+hw*0.58} ${y}h${hw*0.42}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" opacity=".55"/>`;
    }
  });
  return `<svg viewBox="0 0 28 44" aria-hidden="true">
    <path d="M6 2.5C6 11 22 13 22 22 22 31 6 33 6 41.5" fill="none" stroke="${c}" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M22 2.5C22 11 6 13 6 22 6 31 22 33 22 41.5" fill="none" stroke="${c}" stroke-width="2.7" stroke-linecap="round" opacity=".55"/>
    ${bars}</svg>`;
}

function alleleFn(g,a){
  const m=AFN[g]||{}; if(m[a])return m[a];
  const base=a.replace(/x\d+$/,''); return m[base]||'unbekannt';
}
function customerAlleles(g){
  const gt=GENO[g]?GENO[g].genotyp:'';
  const st=gt.match(/\*[0-9A-Za-z]+/g);
  if(st&&st.length)return st;
  const sl=gt.split('/').map(x=>x.trim()).filter(Boolean);
  return sl.length===2?sl:[gt];
}

  requestAnimationFrame(()=>requestAnimationFrame(drawLinks));
  setTimeout(drawLinks,60);setTimeout(drawLinks,240);

/* Interaktionspartner direkt untereinander, danach der Rest nach Schweregrad */
function sortedWorkspace(){
  const pairs=DDI.filter(x=>workspace.includes(x.a)&&workspace.includes(x.b));
  const seen=new Set(),out=[];
  pairs.sort((x,y)=>RANK[y.sev]-RANK[x.sev]).forEach(p=>{
    [p.a,p.b].forEach(id=>{if(!seen.has(id)){seen.add(id);out.push(id);}});
  });
  workspace.filter(id=>!seen.has(id))
    .sort((a,b)=>RANK[overallSev(b,workspace)]-RANK[overallSev(a,workspace)]||DRUGS[a].name.localeCompare(DRUGS[b].name))
    .forEach(id=>out.push(id));
  return out;
}

function drawLinks(){
  const ws=document.getElementById('ws'),svg=document.getElementById('wsvg');if(!ws||!svg)return;
  const r=ws.getBoundingClientRect();
  const W=Math.round(ws.clientWidth||r.width), H=Math.round(Math.max(ws.scrollHeight,r.height));
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let out='';
  DDI.filter(x=>workspace.includes(x.a)&&workspace.includes(x.b)).forEach(x=>{
    const ea=ws.querySelector(`[data-row="${x.a}"]`),eb=ws.querySelector(`[data-row="${x.b}"]`);
    if(!ea||!eb)return;
    const ca=ea.querySelector('.card')||ea, cb=eb.querySelector('.card')||eb;
    const ra=ca.getBoundingClientRect(),rb=cb.getBoundingClientRect();
    const ax=ra.left-r.left, ay=ra.top-r.top, aw=ra.width, ah=ra.height;
    const bx=rb.left-r.left, by=rb.top-r.top, bw=rb.width, bh=rb.height;
    const crit=x.sev==='crit';
    const col=crit?'#D0021B':'#E08000';
    let d,cx,cy;
    if(Math.abs(ax-bx)<24){
      /* gleiche Spalte: Klammer im rechten Randstreifen */
      const xr=ax+aw+79, y1=ay+ah/2, y2=by+bh/2;
      d=`M${ax+aw-2},${y1} H${xr} V${y2} H${bx+bw-2}`;
      cx=xr; cy=(y1+y2)/2;
    }else{
      /* verschiedene Spalten: waagrechte S-Kurve */
      const l=ax<bx, x1=l?ax+aw-2:ax+2, x2=l?bx+2:bx+bw-2;
      const y1=ay+ah/2, y2=by+bh/2, mx=(x1+x2)/2;
      d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
      cx=mx; cy=(y1+y2)/2;
    }
    /* dreilagig: weicher Schein, kraeftige Linie, heller Kern */
    out+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity=".16"/>`;
    out+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
    out+=`<path d="${d}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/>`;
    out+=`<g class="ixbtn ${crit?'crit':''}" style="pointer-events:auto;cursor:pointer" onclick="openIx('${x.a}','${x.b}')">
      <circle cx="${cx}" cy="${cy}" r="27" fill="${col}" opacity=".2"/>
      <circle cx="${cx}" cy="${cy}" r="22" fill="#fff"/>
      <circle cx="${cx}" cy="${cy}" r="19" fill="${col}"/>
      <path d="M${cx} ${cy-10.5} L${cx+9.5} ${cy+7} H${cx-9.5} Z" fill="#fff"/>
      <path d="M${cx} ${cy-4.6}v5.6M${cx} ${cy+3.4}v1.1" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>
      <title>Interaktion ansehen</title></g>`;
  });
  svg.innerHTML=out;
}

function drawIxLink(){

  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(W<80||r2.left<r1.right+8){svg.innerHTML='';return;} /* schmal: kein Konnektor */
  const x1=r1.right-r.left, y1=r1.top-r.top+r1.height/2;
  const x2=r2.left-r.left, y2=r2.top-r.top+r2.height/2;
  const mx=(x1+x2)/2, col=ixPair.sev==='crit'?'#E12D2D':'#F08A00';
  svg.innerHTML=`<path d="M${x1},${y1} H${mx} V${y2} H${x2}" fill="none" stroke="var(--plum)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
    <circle cx="${mx}" cy="${(y1+y2)/2}" r="20" fill="#fff"/><circle cx="${mx}" cy="${(y1+y2)/2}" r="16" fill="${col}"/>
    <path d="M${mx} ${(y1+y2)/2-6.8}v7.6M${mx} ${(y1+y2)/2+5}v.9" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>`;
}
function closeIx(){ixPair=null;document.getElementById('scrim').classList.remove('open');document.getElementById('ixmodal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeIx();closeAltPick();closeGene();closeInfo();}});
function toggleAltMenu(id){openAltPick(id);}
function chooseAlt(id,name){if(name)altChoice[id]=name;else delete altChoice[id];altMenuOpen=null;closeAltPick();render();}
function removeWs(id){workspace=workspace.filter(x=>x!==id);delete altChoice[id];render();}
let dragId=null;
function dragStart(e,id){dragId=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='copy';}
function dragEnd(){dragId=null;}
function wsOver(e){e.preventDefault();e.dataTransfer.dropEffect='copy';document.getElementById('ws').classList.add('hot');}
function wsLeave(e){if(e.currentTarget.contains(e.relatedTarget))return;document.getElementById('ws').classList.remove('hot');}
function wsDrop(e){e.preventDefault();document.getElementById('ws').classList.remove('hot');
  const id=e.dataTransfer.getData('text/plain')||dragId;
  if(id&&DRUGS[id]&&!workspace.includes(id))workspace.push(id);
  render();}
document.addEventListener('click',()=>{if(altMenuOpen){altMenuOpen=null;renderWorkspace();}});

/* ================= RENDER ================= */
function render(){
  renderNav();
  const m=document.getElementById('main');
  if(view==='detail'&&detailId)m.innerHTML=vDetail();
  else if(view==='dashboard')m.innerHTML=vDashboard();
  else if(view==='meine')m.innerHTML=vMeine();
  else if(view==='liste')m.innerHTML=vListe();
  else if(view==='gene')m.innerHTML=vGene();
  else if(view==='merk')m.innerHTML=vMerk();
  m.insertAdjacentHTML('beforeend','<div class="foot">Clickdummy &middot; Demo-Daten (fiktive Person &bdquo;Lisa M.&ldquo;) &middot; GENE-IUS PGx</div>');
  if(view==='meine'||view==='liste'){renderList();}
  if(view==='meine'){renderWorkspace();
    const inp=document.getElementById('q');if(inp&&q){inp.focus();inp.setSelectionRange(q.length,q.length);}}
  if(view==='liste'){const inp=document.getElementById('q');if(inp&&q){inp.focus();inp.setSelectionRange(q.length,q.length);}}
}
window.addEventListener('resize',()=>{if(view==='meine')drawLinks();});
render();
</script>
