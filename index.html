<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVO Drug Response</title>
<meta name="description" content="NOVO Drug Response - Pharmakogenetik-Clickdummy. Prototyp zur Abstimmung, kein Medizinprodukt.">
<meta name="theme-color" content="#5E0047">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOVO Drug Response">
<style>
  :root{
    --plum:#5E0047; --plum-700:#400031; --plum-050:#FBF6F9; --plum-100:#F3E8EF;
    --ok:#12A150; --warn:#F08A00; --crit:#E12D2D;
    --ok-t:#0d7d3e; --warn-t:#b06400; --crit-t:#b62220;
    --ok-bg:#EFF9F3; --warn-bg:#FEF6EA; --crit-bg:#FDEFEE;
    --ok-ln:#C4E6D2; --warn-ln:#F3D9AE; --crit-ln:#F2C4C2;
    --unk:#8E8896; --unk-t:#55505E; --unk-bg:#F3F2F6; --unk-ln:#D9D6E0;
    --ink:#1A1620; --muted:#645D6B; --faint:#948C9B;
    --line:#E7E4EA; --line2:#DCD8E0; --bg:#EFEDF1; --panel:#F7F6F9; --cardw:352px;
    --blue:#1f6fb2;
    --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Code",ui-monospace,Consolas,monospace;
    --sh:0 2px 5px rgba(30,10,30,.05),0 14px 34px -16px rgba(40,0,35,.26);
    --sh-lg:0 18px 48px -14px rgba(40,0,35,.34);
    color-scheme:light;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
  .hidden{display:none!important}
  button{font:inherit}

  /* ---------- Shell: vollfl&auml;chige Plum-Sidebar (Design-Vorlage) ---------- */
  .shell{display:grid;grid-template-columns:264px 1fr;align-items:stretch;min-height:100vh}
  @media(max-width:1080px){.shell{grid-template-columns:1fr}}
  nav.rail{background:linear-gradient(178deg,#5E0047 0%,#4d003a 70%,#420031 100%);padding:26px 16px 20px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
  @media(max-width:1080px){nav.rail{position:static;height:auto}}
  .brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:800;font-size:17.5px;letter-spacing:-.015em;padding:2px 6px 30px}
  .brand .logo{width:36px;height:36px;border-radius:11px;background:radial-gradient(120% 120% at 20% 15%,#9DBF00 0%,transparent 52%),rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
  .brand small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.055em;text-transform:uppercase;color:#d8b6cd;margin-top:2px;line-height:1.25}
  .nav-item{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:11px;border:0;background:transparent;
    font-size:14.5px;font-weight:600;letter-spacing:0;color:#e0c7d8;cursor:pointer;text-align:left;width:100%;
    white-space:normal;line-height:1.25;transition:.15s}
  .nav-item .ni{flex:none;display:grid;place-items:center;color:currentColor;opacity:.9}
  .nav-item .ni svg{width:20px;height:20px}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item[aria-current="true"]{background:rgba(255,255,255,.15);color:#fff;font-weight:700}
  .nav-item[aria-current="true"] .ni{opacity:1}
  .nav-badge{margin-left:auto;font-size:11px;font-weight:800;min-width:22px;height:22px;padding:0 7px;border-radius:999px;
    display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .nb-crit{background:var(--crit);color:#fff} .nb-warn{background:var(--warn);color:#fff}
  .patient{margin-top:auto;display:flex;align-items:center;gap:11px;padding:13px 10px 4px;border-top:1px solid rgba(255,255,255,.14)}
  .patient .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#9DBF00,#5E0047);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
  .patient b{font-size:13.5px;color:#fff}.patient span{font-size:11px;color:#cfa9c2}
  main#main{padding:26px 30px 70px;min-width:0}
  @media(max-width:640px){main#main{padding:18px 16px 60px}}

  .sec-title{display:inline-block;font-size:clamp(18px,2.2vw,23px);font-weight:800;letter-spacing:-.015em;color:#fff;
    background:linear-gradient(120deg,var(--plum) 0%,#7d1668 100%);padding:11px 22px;border-radius:999px;box-shadow:0 9px 24px -11px rgba(94,0,71,.75);margin:0 0 8px}
  .sec-sub{margin:0 0 20px;color:var(--muted);font-size:13.5px;max-width:74ch}
  .box{background:#fff;border-radius:20px;box-shadow:var(--sh)}
  .box-h{display:flex;align-items:center;gap:11px;padding:16px 20px;cursor:pointer}
  .box-h h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--plum);padding:6px 14px;border-radius:999px}
  .box-h .bh-note{font-size:12.5px;color:var(--muted);margin-left:4px}
  .box-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
  .box.open .box-h .chev{transform:rotate(180deg)}
  .box-body{display:none;padding:0 20px 20px}
  .box.open .box-body{display:block}
  .box-always{padding:0 20px 18px}

  /* ---------- Kennzahlen (Vorlage: Label oben, Icon + Zahl darunter) ---------- */
  /* min(100%,...) statt fester Breite: oberhalb 352px wie bisher, darunter
     schrumpft die Spalte statt herauszuragen. Ersetzt die frueheren
     420px-Sonderregeln. */
  .dashgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cardw)),1fr));
    justify-content:start;gap:14px}
  .dashgrid .card{margin-bottom:0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,216px),1fr));gap:16px;margin-bottom:24px}
  .kpi{border-radius:16px;padding:16px 18px 17px;box-shadow:0 2px 5px rgba(30,10,30,.07);border:0;color:#fff}
  .kpi .kl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.95;line-height:1.25;margin-bottom:12px}
  .kpi .krow{display:flex;align-items:center;gap:14px}
  .kpi .kic{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
  .kpi .kic svg{width:24px;height:24px;color:#fff}
  .kpi .ktx{min-width:0}
  .kpi b{display:block;font-size:33px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
  .kpi span{display:block;font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.25;opacity:.94}
  .k-teal{background:#74AFA9} .k-plum{background:#6d1259} .k-blue{background:#3C5C86}
  .k-ok{background:#7EB98C} .k-warn{background:#E9A34A} .k-crit{background:#DC6A62}
  .kpi.k-ev{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .kpi.k-ev .kl{color:var(--faint);opacity:1}
  .kpi.k-ev .kic{background:var(--plum-050)}.kpi.k-ev .kic svg{color:var(--plum)}
  .kpi.k-ev .evrow{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .kpi.k-ev .evrow b{display:inline;font-size:14px;font-weight:750;letter-spacing:0;line-height:1.2}
  .dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:#d8d1dc;display:block}.dots i.on{background:var(--plum)}

  /* ---------- Dashboard-Hero ---------- */
  .hero{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:34px 36px;margin-bottom:22px}
  .hero .eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--plum);margin-bottom:14px}
  .hero h1{margin:0;font-size:clamp(28px,4.4vw,46px);font-weight:800;line-height:1.06;letter-spacing:-.03em;max-width:22ch}
  .hero h1 em{font-style:normal;color:var(--plum)}
  .hero p{margin:14px 0 0;font-size:15.5px;color:var(--muted);max-width:62ch;line-height:1.55}
  @media(max-width:640px){.hero{padding:24px 20px}}

  /* ---------- Alternativen-Modal ---------- */
  /* Popup zum Hinzufuegen - breiter als die Alternativenwahl, weil es die
     ganze Medikamentliste mit Filtern zeigt. */
  .addmodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);
    width:min(1080px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;
    box-shadow:var(--sh-lg);z-index:90;opacity:0;pointer-events:none;transition:.24s}
  .addmodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .addmodal .add-b{padding:18px 22px 24px}
  .addmodal .add-h{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
  .altpick{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(680px,94vw);max-height:90vh;overflow:auto;
    background:#fff;border-radius:22px;box-shadow:var(--sh-lg);z-index:90;opacity:0;pointer-events:none;transition:.24s}
  .altpick.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .altpick .ap-b{padding:20px 22px 22px}
  .altpick .apnote{font-size:13px;color:var(--muted);margin:0 0 14px}
  .altpick .card{pointer-events:none}
  .altpick .cardwrap,.altpick .apcur{width:var(--cardw);max-width:100%}
  .altpick .cardwrap:hover .card{border-color:var(--plum);box-shadow:0 4px 10px rgba(94,0,71,.16)}
  .altnote{border-radius:13px;padding:12px 14px;margin-bottom:14px;background:var(--plum-050);
    border:1.5px solid #E7D3E0}
  .altnote.mixed{background:var(--warn-bg);border-color:var(--warn-ln)}
  .altnote .an-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;color:var(--plum);margin-bottom:6px}
  .altnote.mixed .an-h{color:var(--warn-t)}
  .altnote .an-p{font-size:12.5px;line-height:1.55;color:#3c3540}
  .altnote .an-p b{color:var(--plum)} .altnote.mixed .an-p b{color:var(--warn-t)}
  .altnote .an-p2{font-size:11.5px;color:var(--muted);margin-top:7px;padding-top:7px;
    border-top:1px solid rgba(0,0,0,.07)}
  .apcur{border:1.5px dashed var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:16px;background:var(--panel);font-size:12.5px;color:var(--muted)}
  .apcur b{color:var(--ink)}

  /* ---------- Interaktions-Popup ---------- */
  .scrim{position:fixed;inset:0;background:rgba(30,10,26,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.22s;z-index:80}
  .scrim.open{opacity:1;pointer-events:auto}
  .ixmodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(780px,94vw);max-height:92vh;overflow:auto;
    background:#fff;border-radius:22px;box-shadow:var(--sh-lg);z-index:90;opacity:0;pointer-events:none;transition:.24s}
  .ixmodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .ix-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
  .ix-h .ixic{width:36px;height:36px;border-radius:10px;background:var(--plum-050);display:grid;place-items:center;color:var(--plum);flex:none}
  .ix-h h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--plum)}
  .ix-h .x{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
  .ix-h .x:hover{border-color:var(--plum);color:var(--plum)}
  .ix-b{padding:22px 24px 24px}
  .ixpair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0 46px;align-items:start}
  @media(max-width:620px){.ixpair{grid-template-columns:1fr;gap:16px}}
  .ixdrug{border:2px solid var(--plum);border-radius:14px;padding:12px 14px;background:#fff}
  .ixdrug.two{grid-column:2;margin-top:64px}
  @media(max-width:620px){.ixdrug.two{grid-column:1;margin-top:0}}
  .ixdrug .idl{font-size:11.5px;color:var(--muted);font-weight:650}
  .ixdrug .idn{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
  .ixdrug .idu{font-size:11.5px;color:var(--muted);margin-top:5px}
  .ixdrug .idu b{color:#4b4451}
  #ixsvg{position:absolute;inset:0;pointer-events:none}
  .ixfound{margin-top:22px;border:1.5px solid var(--line2);border-radius:16px;padding:18px 20px;background:var(--panel)}
  .ixfound .ixft{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}
  .ixcols{display:grid;grid-template-columns:repeat(3,1fr);gap:0 20px}
  @media(max-width:620px){.ixcols{grid-template-columns:1fr;gap:16px}}
  .ixcol{padding:0 4px}
  .ixcol+.ixcol{border-left:1px solid var(--line2);padding-left:20px}
  @media(max-width:620px){.ixcol+.ixcol{border-left:0;padding-left:4px;border-top:1px solid var(--line2);padding-top:14px}}
  .ixcol h4{margin:0 0 7px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--plum)}
  .ixcol p{margin:0;font-size:13.5px;line-height:1.5;color:#3c3540}
  .ixsrc{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}

  /* ---------- Handy-Ansicht (Merkliste) ---------- */
  .phonewrap{display:flex;justify-content:center;padding:4px 0 10px}
  .phone{width:392px;max-width:100%;background:var(--panel);border:11px solid #1d1520;border-radius:44px;padding:16px 13px 22px;box-shadow:0 26px 60px -22px rgba(40,0,35,.55)}
  .phone .notch{width:104px;height:6px;border-radius:99px;background:#1d1520;opacity:.32;margin:0 auto 15px}
  .phone h2{margin:0 0 15px;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--plum);line-height:1.2;padding:0 4px}
  .phone .card{margin-bottom:11px;border-radius:17px}
  .phone .chead{padding:14px 15px;gap:11px}
  .phone .pill{width:0;height:0;display:none}
  .phone .cname{font-size:19px}
  .phone .cbrands{font-size:12.5px;white-space:normal}
  .phone .cstate{width:58px}
  .phone .cstate svg.st{width:40px;height:40px}
  .phone .cstate .sw{font-size:11px;letter-spacing:.04em}
  .phone .cchev{display:none}
  .phone .mchips{display:flex;flex-wrap:wrap;gap:7px;padding:0 15px 15px}
  .mchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:750;border:1.5px solid}
  .mchip svg{width:15px;height:15px;flex:none}
  .mchip.b-ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-t)}
  .mchip.b-warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn-t)}
  .mchip.b-crit{background:var(--crit-bg);border-color:var(--crit-ln);color:var(--crit-t)}

  /* ---------- Medikamentenkarte (Design-Vorlage: wei&szlig;e Box, Status rechts) ---------- */
  /* EINE Kartengroesse ueberall: feste Breite, identische Innenmasse */
  .card{width:var(--cardw);max-width:100%;border-radius:18px;border:1px solid var(--line);margin-bottom:14px;
    box-shadow:var(--sh);background:#fff;transition:opacity .2s,box-shadow .2s}
  .card:hover{box-shadow:0 4px 8px rgba(30,10,30,.06),0 18px 40px -18px rgba(40,0,35,.32)}
  .c-ok,.c-warn,.c-crit{background:#fff}
  .card.faded{opacity:.42;filter:grayscale(.7)}
  /* flex-start statt center: sonst rutscht der Statusblock bei einem
     dreizeiligen Namen in die Mitte und wirkt wie verrutscht. */
  .chead{position:relative;display:flex;align-items:flex-start;gap:10px;padding:13px 30px 13px 13px;cursor:pointer;min-width:0}
  .chead .pill,.chead .cstate,.chead .cchev{margin-top:1px}
  .pill{flex:none;width:42px;height:42px}
  .cmain{flex:1 1 auto;min-width:0;overflow:hidden}
  /* Umbruch statt Abschneiden. overflow-wrap:anywhere ist noetig, weil
     chemische Namen wie (2-benzhydryloxyethyl)diethyl-methylammonium keine
     Leerzeichen haben und die Karte sonst aufschieben. Nach vier Zeilen
     doch abschneiden, sonst wird eine Karte beliebig hoch - der
     vollstaendige Name steht ohnehin im title-Attribut. Vier statt drei,
     weil bei drei genau ein Name der Datenbank noch geklemmt hat. */
  .cname{font-size:15.5px;font-weight:800;letter-spacing:-.004em;line-height:1.18;color:#221c26;text-transform:uppercase;
    overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .cbrands{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cbrands b{color:#4b4451;font-weight:700}
  .cbrands .nobr{color:var(--faint);font-style:italic}
  /* feste Spalte + zentriert -> Symbole aller Ratings exakt untereinander */
  /* Keine feste Breite mehr: "INTERAKTION" braucht 82px, "OK" 62px reichten.
     Die Spalte waechst auf den Text, .cmain schrumpft dafuer (flex:1 1 auto,
     min-width:0). Die Obergrenze verhindert, dass ein langes Wort die
     Wirkstoffspalte auffrisst. */
  .cstate{flex:none;min-width:62px;max-width:96px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px}
  .cstate svg.st{width:29px;height:29px;flex:none;display:block}
  .cstate .sw{font-size:11px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
    text-align:center;line-height:1.1;max-width:100%;overflow-wrap:anywhere}
  .cchev{position:absolute;right:10px;bottom:9px;width:18px;height:18px;color:var(--faint);transition:transform .2s}
  .card.open .cchev{transform:rotate(180deg)}
  .cbody{display:none;padding:0 13px 14px}
  .card.open .cbody{display:block}
  .cdiv{height:1px;background:var(--line);margin:0 0 12px}

  /* Sub-Themen: farbig eingef&auml;rbt nach Zustand */
  .infogrid{display:grid;grid-template-columns:1fr;gap:8px}
  .ibox{border:1.5px solid;border-radius:12px;padding:10px 11px;display:flex;align-items:center;gap:9px;text-align:left}
  .ibox.b-ok{background:var(--ok-bg);border-color:var(--ok-ln)}
  .ibox.b-warn{background:var(--warn-bg);border-color:var(--warn-ln)}
  .ibox.b-crit{background:var(--crit-bg);border-color:var(--crit-ln)}
  .ibox .ic{flex:none;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(30,10,30,.09)}
  .ibox .ic svg{width:19px;height:19px}
  .ibox .itx{min-width:0}
  .ibox .il{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2}
  .ibox .iv{margin-top:2px;font-size:13px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
  .t-ok{color:var(--ok-t)}.t-warn{color:var(--warn-t)}.t-crit{color:var(--crit-t)}
  .s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-crit{color:var(--crit)}
  /* ---- vierter Zustand: nicht bestimmbar --------------------------------
     Wenn eine Genposition nicht gerufen werden kann oder mehrere Diplotypen
     moeglich bleiben, ist die Aussage weder gruen noch rot. Dafuer gibt es
     eine eigene, bewusst farblose Stufe. Eine erfundene Sicherheit waere
     schlimmer als eine sichtbare Luecke. */
  .s-unk{color:var(--unk)} .t-unk{color:var(--unk-t)}
  .mchip.b-unk,.pillbadge.b-unk{background:var(--unk-bg);border-color:var(--unk-ln);color:var(--unk-t)}
  .ibox.b-unk,.genebox.b-unk{background:var(--unk-bg);border-color:var(--unk-ln)}
  .ibox.b-unk .il,.ibox.b-unk .iv{color:var(--unk-t)}
  .abox.s-unk{border-color:var(--unk)} .abox.s-unk .ab-h{background:#6B6575}
  .rgene.s-unk,.rdrug.s-unk,.grow.s-unk,.mrow.s-unk{border-left-color:var(--unk)}
  .genebox.b-unk .gscale .gs-seg{background:rgba(255,255,255,.82)}
  .gi-unk{background:var(--unk-bg);color:var(--unk-t)}
  .wsleg.h-unk .lr1,.wsleg.h-unk .lr1 svg{color:var(--unk-t)} .wsleg.h-unk .n{background:var(--unk)}
  .genecount{font-size:12.5px;color:var(--muted);font-weight:700;margin:2px 0 12px}
  /* Befundzeile auf der Genkarte */
  .gbef{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750;
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:var(--muted)}
  .gbef svg{width:15px;height:15px;flex:none}
  .gbef.neg{color:var(--plum)}
  /* Positionsblock im aufgeklappten Teil der Genkarte */
  .gpos{margin-top:4px}
  .gpos-r{border:1.5px solid var(--line2);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:#fff}
  .gpos-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin-bottom:5px}
  .gpos-rs{font-family:var(--mono,monospace);font-weight:700}
  .gpos-rs a{color:var(--blue);text-decoration:none}.gpos-rs a:hover{text-decoration:underline}
  .gpos-gt{font-family:var(--mono,monospace);background:var(--panel);border:1.5px solid var(--line2);
    border-radius:6px;padding:0 6px;font-weight:700}
  .gpos-ev{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
  .gpos-ev b{font-weight:700;color:var(--muted);font-size:11px}
  .gpos-s{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.45;margin-top:4px}
  .gpos-s svg{width:15px;height:15px;flex:none;color:var(--muted);margin-top:1px}
  .gpos-s.neg svg{color:var(--plum)}
  .gpos-s b{font-weight:750}.gpos-s span{color:var(--muted)}
  .gpos-rest{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:6px}
  .gpos-rest code{font-family:var(--mono,monospace);background:var(--panel);border-radius:5px;
    padding:0 5px;color:var(--muted);font-size:11.5px}
  /* Einzelpositionen mit Studienhinweis. Bewusst OHNE Ampelfarben - das
     ist eine Beobachtung, keine Bewertung, und darf nie wie eine aussehen. */
  .rsband{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:22px 24px;margin-top:22px}
  .rs-intro{font-size:13px;color:var(--muted);line-height:1.55;margin:6px 0 16px;max-width:78ch}
  .rs-intro b{color:var(--ink)}
  .rsgene{border:1.5px solid var(--line2);border-radius:14px;padding:13px 15px;margin-bottom:10px;background:var(--panel)}
  .rsgene>.rsg-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .rsg-n{font-weight:800;font-size:14px;letter-spacing:.01em}
  .rsg-sub{font-size:11.5px;color:var(--faint)}
  .rspos{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
  .rspos:first-of-type{border-top:0;padding-top:0;margin-top:0}
  .rsp-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px}
  .rsp-rs{font-family:var(--mono,monospace);font-weight:700}
  .rsp-rs a{color:var(--blue);text-decoration:none}.rsp-rs a:hover{text-decoration:underline}
  .rsp-gt{font-family:var(--mono,monospace);background:#fff;border:1.5px solid var(--line2);
    border-radius:7px;padding:1px 7px;font-weight:700}
  /* 11px ist die Untergrenze der Pruefroutine (Abschnitt 7) - nicht darunter */
  .rsp-ev{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint)}
  .rsp-ev b{font-weight:700;color:var(--muted);font-size:11px}
  /* Signalzeile: Umriss statt Fuellung. Kein Rot, kein Gruen. */
  .rssig{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5;
    border:1.5px solid var(--line2);border-radius:10px;padding:7px 10px;margin-bottom:5px;background:#fff}
  .rssig .rsi{flex:none;width:17px;height:17px;color:var(--muted);margin-top:1px}
  .rssig.neg{border-color:#C9B9C9}
  .rssig.neg .rsi{color:var(--plum)}
  .rssig-t{font-weight:750}
  .rssig-d{color:var(--muted)}
  .rsmore{background:none;border:0;font:inherit;font-size:12.5px;font-weight:750;color:var(--plum);
    cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:7px}
  .rsmore svg{transition:.16s}.rsmore[aria-expanded="true"] svg{transform:rotate(180deg)}
/* Abdeckungsblock im Arztbericht: was der Test wirklich lesen konnte */
  .cov{margin:0 0 18px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
  .cov-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--plum-050);
    font-size:17px;font-weight:800;letter-spacing:-.01em;
    border-bottom:1px solid var(--line);font-size:13px;font-weight:800;color:var(--plum)}
  .cov-h svg{flex:none;color:var(--plum)}
  .cov-b{padding:13px 15px 15px}
  .cov-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,132px),1fr));gap:10px;margin-bottom:12px}
  .cov-k{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--panel)}
  .cov-k .n{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.1;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .cov-k .l{display:block;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.35;margin-top:3px}
  .cov-p{margin:0;font-size:12.5px;line-height:1.6;color:#3c3540}
  .cov-p b{color:var(--plum)}
  .cov-sub{font-size:14px;font-weight:800;letter-spacing:-.01em;margin:16px 0 8px;color:var(--ink)}
  /* Alle uebrigen Gene, dicht gesetzt */
  .cov-rest{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:5px 12px}
  .cov-rg{display:flex;align-items:center;gap:7px;font-size:12px;min-width:0}
  .cov-rd{flex:none;width:8px;height:8px;border-radius:50%}
  .cov-rd.ok{background:var(--ok)} .cov-rd.warn{background:var(--warn)}
  .cov-rd.crit{background:var(--crit)}
  .cov-rn{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cov-rp{flex:none;color:var(--faint);font-size:11px}
  .cov-tab{width:100%;border-collapse:collapse;margin-top:11px;font-size:11.5px}
  .cov-tab th{text-align:left;font-weight:800;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--line);
    font-size:10px;letter-spacing:.05em;text-transform:uppercase}
  .cov-tab td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .cov-tab td.mono{font-family:var(--mono);font-size:11px}
  .cov-tab tr.miss td{background:var(--unk-bg)}
  .cov-tab td .warnpin{color:var(--unk-t);font-weight:800}
  /* Liste aller gelesenen Positionen, je Gen aufklappbar */
  .vlist{display:flex;flex-direction:column;gap:8px}
  .vgene{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .vhead{display:flex;align-items:center;gap:9px;width:100%;padding:11px 14px;border:0;
    background:none;font:inherit;cursor:pointer;text-align:left}
  .vhead:hover{background:var(--plum-050)}
  .vchev{flex:none;color:var(--faint);transition:transform .2s}
  .vgene.open .vchev{transform:rotate(90deg)}
  .vg{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--ink)}
  .vn{font-size:11.5px;font-weight:700;color:var(--plum);background:var(--plum-100);
    border-radius:6px;padding:2px 7px}
  .vd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
  .vbody{display:none;padding:0 14px 13px;border-top:1px solid var(--line)}
  .vgene.open .vbody{display:block}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,184px),1fr));gap:4px 12px;
    margin-top:10px}
  .vrow{display:flex;align-items:baseline;gap:8px;font-size:11.5px;padding:2px 0;
    border-bottom:1px solid var(--line)}
  .vrs{font-family:var(--mono);color:var(--muted)}
  .vrs a{color:var(--plum);text-decoration:none}
  .vrs a:hover{text-decoration:underline}
  .vgt{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--ink)}
  /* Eine Leitlinien-Empfehlung von PharmCAT, je Quelle eine Zeile */
  .pw{border-left:3px solid var(--line2);padding:7px 0 7px 11px;margin:9px 0 0}
  .pw.s-crit{border-left-color:var(--crit)} .pw.s-warn{border-left-color:var(--warn)}
  .pw.s-ok{border-left-color:var(--ok)} .pw.s-unk{border-left-color:var(--unk)}
  .pw-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:4px}
  .pw-q{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--plum)}
  .pw-gt{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .pw-kl{font-size:10.5px;font-weight:700;color:var(--muted)}
  .pw-b{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;
    border-radius:5px;padding:2px 6px;border:1px solid}
  .pw-b.b-ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-t)}
  .pw-b.b-warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn-t)}
  .pw-b.b-crit{background:var(--crit-bg);border-color:var(--crit-ln);color:var(--crit-t)}
  .pw-i{font-size:11.5px;font-weight:700;line-height:1.45;color:#3E3947;margin-bottom:3px}
  .pw-t{font-size:12px;line-height:1.55;color:#3c3540}
  /* Befundzeile statt Metabolisierer-Skala bei Risiko- und Zielgenen */
  .gflat{display:flex;align-items:center;gap:7px;margin:9px 0 0;padding:8px 10px;border-radius:9px;
    background:rgba(255,255,255,.72);border:1px solid var(--ok-ln);font-size:12px;font-weight:750;
    line-height:1.35;color:var(--ok-t)}
  .gflat svg{flex:none}
  /* Hinweiszeile auf einer Genkarte, wenn PharmCAT nichts eindeutiges liefert */
  .gwhy{margin:8px 0 0;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.7);
    border:1px solid var(--unk-ln);font-size:11.5px;font-weight:600;line-height:1.45;color:var(--unk-t)}
  .gwhy b{color:#3E3947}

  .btn{border-radius:11px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--line2);background:#fff;color:var(--ink);font-size:13px;font-weight:750;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:.15s}
  .btn:hover{border-color:var(--plum);color:var(--plum)}
  .btn-plum{background:var(--plum);color:#fff;border-color:var(--plum)}
  .btn-plum:hover{background:var(--plum-700);color:#fff}
  .btn-wide{width:100%;justify-content:center;margin-top:14px}
  .btn.act-on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-t)}
  .btn.act-fav{background:#FEF8EC;border-color:#E8B23A;color:#8a6100}
  .btn:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

  /* ---------- Suche / Filter ---------- */
  .toolbar{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px}
  .searchwrap{position:relative}
  .searchwrap svg{position:absolute;left:13px;top:12px;color:var(--faint)}
  .searchwrap input{width:100%;font:inherit;font-size:14.5px;padding:11px 12px 11px 40px;border:1.5px solid var(--line2);border-radius:12px;background:var(--panel)}
  .searchwrap input:focus{outline:0;border-color:var(--plum);background:#fff;box-shadow:0 0 0 4px var(--plum-100)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .fchip{border:1.5px solid var(--line2);background:#fff;font-size:12px;font-weight:700;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
  .fchip:hover{border-color:var(--plum);color:var(--plum)}
  .fchip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
  .fchip.f-crit[aria-pressed="true"]{background:var(--crit);border-color:var(--crit)}
  .fchip.f-warn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
  .fchip.f-fav[aria-pressed="true"]{background:var(--gold,#E8B23A);border-color:#E8B23A;color:#3d2a00}
  .fav{flex:none;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--faint)}
  .fav.on{color:#E8B23A;border-color:#E8B23A;background:#FEF8EC}
  .listcount{font-size:12px;color:var(--muted);margin:2px 0 10px 4px}

  /* ---------- Split: Liste | Arbeitsfl&auml;che ---------- */
  .col-scroll{max-height:78vh;overflow:auto;padding-right:4px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,292px),1fr));
    gap:0 12px;align-items:start;align-content:start}
  .col-scroll>.ws-empty,.col-scroll>.moreb{grid-column:1/-1}
  .wsurface{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:20px 20px 22px;position:relative;min-height:420px}
  .wstitle{font-size:clamp(24px,2.9vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0 0 4px;color:#221c26}
  .wssub{font-size:13px;color:var(--muted);margin:0 0 18px}
  /* Karten schmaler halten &mdash; rechts bleibt ein Streifen fuer Aktionen und Interaktionen */
  .wscols{display:block;position:relative;z-index:1}
  /* Legende: zurueckhaltend unter der Liste */
  .wslegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px;
    padding-top:16px;border-top:1px solid var(--line)}
  @media(max-width:820px){.wslegend{grid-template-columns:1fr}}
  .wsleg{border-radius:11px;padding:9px 11px;background:#fff;border:1.5px solid var(--line2);
    text-align:left;font:inherit;cursor:pointer;transition:.14s;display:block;width:100%}
  .wsleg:hover{border-color:var(--plum);background:var(--plum-050)}
  .wsleg .lr1{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .wsleg .lr1 svg{width:15px;height:15px}
  .wsleg .n{margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px;font-weight:800;
    border-radius:999px;min-width:21px;height:19px;padding:0 6px;display:grid;place-items:center;letter-spacing:0;color:#fff}
  .wsleg .lr2{font-size:11.5px;font-weight:600;line-height:1.35;margin-top:4px;color:var(--muted)}
  .wsleg .lr3{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:750;margin-top:6px;color:var(--plum);opacity:.85}
  .wsleg .lr3 svg{width:12px;height:12px}
  .wsleg:hover .lr3{opacity:1}
  .wsleg.h-crit .lr1,.wsleg.h-crit .lr1 svg{color:var(--crit-t)} .wsleg.h-crit .n{background:var(--crit)}
  .wsleg.h-warn .lr1,.wsleg.h-warn .lr1 svg{color:var(--warn-t)} .wsleg.h-warn .n{background:var(--warn)}
  .wsleg.h-ok .lr1,.wsleg.h-ok .lr1 svg{color:var(--ok-t)} .wsleg.h-ok .n{background:var(--ok)}
  /* Aktionsicons im Randstreifen rechts der Karte */
  .wsactions{position:absolute;top:50%;transform:translateY(-50%);right:-44px;z-index:4;
    display:flex;flex-direction:column;gap:6px}
  .wsactions .wbtn{width:34px;height:34px;border-radius:10px}
  .wbtn.del:hover{border-color:var(--crit);color:var(--crit);background:var(--crit-bg)}
  /* Der Austausch war zwei lose Karten mit einer Textzeile dazwischen -
     man sah zwei Medikamente, nicht einen Vorgang. Jetzt eine Gruppe mit
     Rahmen, Kopfzeile und durchgezogenem Pfeil. */
  .swapbox{border:1.5px solid var(--plum-ln,#D9C3D4);border-radius:16px;background:var(--plum-050);
    padding:10px 11px 11px;position:relative}
  .swaphead{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.09em;
    text-transform:uppercase;color:var(--plum);margin:0 0 9px 2px}
  .swaphead svg{width:15px;height:15px}
  .swapitem{position:relative}
  .swaplabel{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin:0 0 4px 3px}
  .swapitem.alt .swaplabel{color:var(--faint);text-decoration:line-through}
  .swapitem.neu .swaplabel{color:var(--plum)}
  /* Durchgezogener Pfeil statt Textzeile */
  .swaparrow{display:flex;flex-direction:column;align-items:center;margin:5px 0 7px}
  .swaparrow .ln{width:2.5px;height:13px;background:var(--plum);opacity:.5}
  .swaparrow .hd{width:26px;height:26px;border-radius:50%;background:var(--plum);color:#fff;
    display:grid;place-items:center}
  .swaparrow .hd svg{width:15px;height:15px;transform:rotate(90deg)}
  .replrow{display:flex;align-items:center;justify-content:center;gap:7px;margin:-2px 0 8px;color:var(--plum);
    font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .wsurface.hot{outline:2px dashed var(--plum);outline-offset:-6px;background:var(--plum-050)}
  .ws-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .ws-head h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--plum);padding:6px 14px;border-radius:999px}
  /* z-index 2: ueber den Karten (.wrow liegt auf 1), aber unter dem
     Knopfstreifen (.wsactions liegt auf 4). Vorgabe Daniel, 2026-08-07 -
     die Verbindungslinie lief vorher ueber Tausch- und Loeschknopf.
     pointer-events:none bleibt zwingend (Fallstrick 4); der
     Interaktionsknopf sitzt rechts neben dem Streifen und bleibt frei. */
  #wsvg{position:absolute;inset:0;pointer-events:none;z-index:2}
  /* Bilanzband ueber die volle Breite der Einnahmeliste */
  .ixscore{background:var(--panel);border:1.5px solid var(--line2);border-radius:16px;
    padding:15px 18px;margin:2px 0 18px}
  .ixs-grid{display:block}
  /* 11px ist die Untergrenze der Pruefroutine (Abschnitt 7) - nicht darunter */
  .ixs-col>.ist{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);margin-bottom:9px}
  .ixs-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .ixs-trenn{flex:none;width:1px;align-self:stretch;background:var(--line2);margin:2px 4px}
  .ixs-k{display:flex;align-items:baseline;gap:7px;min-width:0}
  .ixs-n{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em}
  .ixs-l{font-size:12px;font-weight:700;color:var(--muted);line-height:1.25}
  .ixs-k.crit .ixs-n{color:var(--crit-t)} .ixs-k.warn .ixs-n{color:var(--warn-t)}
  .ixs-k.ok .ixs-n{color:var(--ok-t)}     .ixs-k.done .ixs-n{color:#7A7382}
  .ixs-k.neutral .ixs-n{color:var(--ink)}
  .ixs-k.null .ixs-n{color:var(--faint)}  .ixs-k.null .ixs-l{color:var(--faint)}
  .ixs-sum{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--faint)}
  /* transform-box:fill-box ist zwingend - ohne das bezieht sich transform-origin
     bei SVG auf den Viewport statt auf das Element, und der Knopf springt beim
     Ueberfahren an eine andere Stelle */
  #wsvg .ixbtn{transition:transform .15s;transform-box:fill-box;transform-origin:center}
  #wsvg .ixbtn:hover{transform:scale(1.12)}
  #wsvg .ixbtn.crit{animation:ixpulse 1.9s ease-in-out infinite}
  @keyframes ixpulse{0%,100%{opacity:1}50%{opacity:.72}}
  @media(prefers-reduced-motion:reduce){#wsvg .ixbtn.crit{animation:none}}
  .wrow{position:relative;z-index:1;display:block;width:var(--cardw);max-width:100%;margin-bottom:14px}
  .wrow.menuopen,.altpair.menuopen{z-index:60}
  .wrow .card{min-width:0;margin-bottom:0}
  .wtools{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:14px;position:relative}
  .wbtn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line2);background:#fff;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--muted);font:inherit}
  .wbtn svg{flex:none;width:17px;height:17px}
  .wb-l{display:none}
  .wbtn.good{border-color:var(--ok-ln);background:var(--ok-bg);color:var(--ok)}
  .wbtn.alt{border-color:var(--warn-ln);background:var(--warn-bg);color:var(--warn-t)}
  .wbtn:hover{border-color:var(--plum);color:var(--plum)}
  .altmenu{position:absolute;top:56px;right:0;z-index:70;background:#fff;border:1.5px solid var(--line2);border-radius:14px;box-shadow:var(--sh-lg);min-width:250px;padding:7px;display:none}
  .altmenu.open{display:block}
  .altmenu .amh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:7px 10px 5px}
  .altmenu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer}
  .altmenu button:hover{background:var(--plum-050)}
  .altmenu button b{font-size:13.5px;font-weight:750}
  .altmenu button span{font-size:11.5px;color:var(--muted)}
  .altpair{position:relative;z-index:1;display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
  .altpair>div{flex:1;min-width:0}
  .altarrow{flex:none;display:grid;place-items:center;color:var(--plum);width:34px}
  .ws-empty{border:2px dashed var(--line2);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}

  /* ---------- Detailseite ---------- */
  .detail-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .glchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 13px;border-radius:999px;color:#fff}
  .gl-cpic{background:#1f6fb2}.gl-dpwg{background:#7a1668}.gl-fda{background:#4a6b18}.gl-cpnds{background:#a0522d}
  .doserec{font-size:21px;font-weight:800;line-height:1.35;letter-spacing:-.015em;color:#241d27}
  .strength{font-size:13.5px;color:#3c3540;margin-top:12px}
  .strength b{color:var(--plum)}
  /* Eine Box fuer Beurteilung und Leitlinie */
  /* Text, der einen anderen Genotyp beschreibt als den des Patienten. Steht
     bewusst blass und mit eigener Ueberschrift, damit er nicht als Aussage
     ueber diese Person gelesen wird - genau das war bei Clopidogrel der Fall. */
  .ab-ursache{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.55;
    border-radius:11px;padding:9px 12px;margin-top:10px;background:var(--warn-bg);color:var(--warn-t)}
  .ab-ursache.s-crit{background:var(--crit-bg);color:var(--crit-t)}
  .ab-ursache svg{flex:none;width:16px;height:16px;margin-top:1px}
  .ab-ursache b{font-weight:800}
  .ab-fremd{opacity:.72;border-left:3px solid var(--line2);padding-left:11px;margin-top:10px}
  .ab-fremd .ab-gh{color:var(--faint)}
  .abox{border-radius:16px;border:2px solid;overflow:hidden;background:#fff;margin:2px 0 4px}
  .abox.s-crit{border-color:var(--crit)} .abox.s-warn{border-color:var(--warn)} .abox.s-ok{border-color:var(--ok)}
  .abox .ab-h{display:flex;align-items:center;gap:9px;padding:10px 14px;color:#fff;
    font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  .abox .ab-h svg{color:#fff}
  .abox.s-crit .ab-h{background:#D02A2A} .abox.s-warn .ab-h{background:#E08000} .abox.s-ok .ab-h{background:#12A150}
  .abox .ab-badge{margin-left:auto;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;
    font-size:11.5px;letter-spacing:.05em}
  .abox .ab-plain{padding:13px 15px;font-size:14.5px;line-height:1.55;color:#2e2733}
  .abox .ab-sep{height:1px;background:var(--line);margin:0 15px}
  .abox .ab-g{padding:12px 15px 14px;background:var(--plum-050)}
  .abox .ab-gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;color:var(--plum);margin-bottom:7px}
  .abox .ab-gh svg{color:var(--plum)}
  .abox .ab-gt{font-family:var(--mono);letter-spacing:.02em;background:#fff;border:1px solid #E7D3E0;
    border-radius:7px;padding:2px 8px}
  .abox .ab-gx{font-size:14px;line-height:1.6;color:#2e2733}
  .abox .ab-gs{font-size:11px;color:var(--muted);margin-top:7px}
  .abox .ab-none{padding:11px 15px 13px;font-size:12.5px;color:var(--faint);font-style:italic}
  .reccard{margin-top:14px;border:1.5px solid var(--plum);border-radius:14px;overflow:hidden;background:var(--plum-050)}
  .reccard .rech{display:flex;align-items:center;gap:8px;background:var(--plum);color:#fff;padding:9px 14px;
    font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  .reccard .rech svg{color:#fff}
  .reccard .recgt{padding:11px 14px 0;font-size:12px;font-weight:800;color:var(--plum);
    letter-spacing:.04em;text-transform:uppercase}
  .reccard .recgt b{font-family:var(--mono)}
  .reccard .rectx{padding:5px 14px 11px;font-size:14px;line-height:1.55;color:#2e2733}
  .reccard .recsrc{padding:0 14px 12px;font-size:11px;color:var(--muted)}
  .protext{margin-top:14px;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#37303c;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px}
  .srclink{color:var(--blue);font-weight:700;text-decoration:underline;font-size:13px}
  .srcrow{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap}

  /* Gen-Karte Variante D: kompakt, Symbolpaar in der Kopfzeile, Skala unten */
  /* min(100%,...) statt fester Breite: oberhalb 352px wie bisher, darunter
     schrumpft die Spalte statt herauszuragen. Ersetzt die frueheren
     420px-Sonderregeln. */
  .genegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cardw)),1fr));
    justify-content:start;gap:14px}
  .genebox{background:#fff;border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 15px 13px;text-align:left;cursor:pointer;transition:.15s}
  /* Pastellton der Karte zeigt den Zustand des Gens auf einen Blick */
  .genebox.b-crit{background:var(--crit-bg);border-color:var(--crit-ln)}
  .genebox.b-warn{background:var(--warn-bg);border-color:var(--warn-ln)}
  .genebox.b-ok{background:var(--ok-bg);border-color:var(--ok-ln)}
  .genebox.b-ultra{background:#E8F5EC;border-color:#B6DFC6}
  /* auf Pastellgrund werden nur die INAKTIVEN Segmente aufgehellt -
     das aktive muss seine Ampelfarbe behalten */
  .genebox.b-crit .gscale .gs-seg:not(.on),.genebox.b-warn .gscale .gs-seg:not(.on),
  .genebox.b-ok .gscale .gs-seg:not(.on),.genebox.b-ultra .gscale .gs-seg:not(.on){background:rgba(255,255,255,.8)}
  .genebox .gb-ic{background:#fff!important}
  .genebox:hover{border-color:var(--plum);box-shadow:0 4px 10px rgba(94,0,71,.14)}
  .genebox.flat{cursor:default}.genebox.flat:hover{border-color:var(--line);box-shadow:var(--sh)}
  .gb-top{display:flex;align-items:center;gap:11px}
  .gb-ic{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center}
  .gb-ic svg{width:34px;height:44px}
  /* Der Knopf traegt jetzt ueberall Text - die Medikamentliste ist der Ort
     zum Hinzufuegen, da muss erkennbar sein, was der Knopf tut. */
  .hb-l{display:inline;font-size:12.5px;font-weight:800;letter-spacing:-.01em}
  /* Kopf der eigenen Liste: Ueberschrift links, Knopf zur Medikamentliste
     rechts - der Weg zum Hinzufuegen muss von hier aus sichtbar sein. */
  .wshead2{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;
    flex-wrap:wrap;margin-bottom:4px}
  .wshead2>div:first-child{min-width:0;flex:1 1 240px}
  .addbtn{flex:none;white-space:nowrap}
  /* Angehefteter Knopf - nur am Telefon. Bei vier oder mehr Medikamenten ist
     der Knopf oben aus dem Bild gescrollt, und genau dann will man etwas
     hinzufuegen. */
  .fab{display:none}
  /* Wechselwirkungszeile - nur am Telefon, dort ersetzt sie die Linie */
  .wsix{display:none}
  .wsix-r{display:flex;align-items:center;gap:9px;width:100%;margin-top:8px;
    padding:11px 12px;min-height:46px;border-radius:12px;cursor:pointer;font:inherit;
    font-size:13.5px;text-align:left;border:1.5px solid var(--crit-ln);
    background:var(--crit-bg);color:var(--crit-t);-webkit-tap-highlight-color:transparent}
  .wsix-r.warn{border-color:var(--warn-ln);background:var(--warn-bg);color:var(--warn-t)}
  .wsix-r.done{border-color:var(--line2);background:var(--panel);color:var(--muted)}
  .wsix-r>svg:first-child{flex:none;width:16px;height:16px}
  .wsix-t{flex:1;min-width:0}
  .wsix-t b{font-weight:800}
  .wsix-c{flex:none;width:15px;height:15px;transform:rotate(-90deg);opacity:.6}
  /* ---------- Tableiste (nur Telefon) ---------- */
  .tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:#fff;border-top:1px solid var(--line2);
    padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -3px 16px rgba(30,10,30,.10)}
  .tabbar .tab{flex:1 1 0;min-width:0;min-height:50px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;border:0;background:none;font:inherit;
    color:var(--muted);cursor:pointer;padding:4px 2px;border-radius:12px;
    -webkit-tap-highlight-color:transparent}
  .tabbar .tab .tb-ic{position:relative;display:grid;place-items:center;line-height:0}
  .tabbar .tab svg{width:22px;height:22px}
  /* Zweizeilig: "Deine Medikamente" passt nicht in ein Fuenftel von 390px
     auf eine Zeile. 11px ist die Untergrenze der Pruefroutine. */
  .tabbar .tab .tb-l{font-size:11px;font-weight:750;letter-spacing:-.015em;
    line-height:1.12;text-align:center;max-width:100%}
  .tabbar .tab.on{color:var(--plum)}
  .tabbar .tab.on .tb-l{font-weight:800}
  .tb-b{position:absolute;top:-5px;right:-9px;min-width:16px;height:16px;border-radius:999px;
    background:var(--plum);color:#fff;font-size:11px;font-weight:800;line-height:16px;
    text-align:center;padding:0 4px}
  /* ---------- Telefon ----------------------------------------------
     Die breiten Raster sind oben schon mitwachsend. Hier bleibt, was sich
     nicht rechnen laesst: nebeneinanderliegende Bloecke, nicht umbrechbare
     Tabellen und der Seitenrand. */
  .gm-split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
  /* Nicht umbrechbare Tabellen scrollen in ihrem eigenen Kasten. Die SEITE
     bleibt damit ueberlauffrei - das verlangt die Pruefroutine, ein Kasten
     darf scrollen. */
  .tabscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media(max-width:820px){
    .gm-split{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .cov-tab{min-width:560px}
    .grow,.mrow{min-width:520px}
    /* Die Aktionsknoepfe sitzen sonst absolut 44px RECHTS AUSSERHALB der
       Zeile - auf dem Telefon ragen sie damit aus dem Bild. Hier stehen sie
       als Reihe unter der Karte. */
    /* Eine Leiste, die an der Karte klebt: die Karte verliert unten ihre
       Rundung, die Leiste bekommt sie - zusammen ein Block. Vorher hingen
       hier zwei nackte Symbolquadrate rechtsbuendig im Nichts. */
    .wsactions{position:static;transform:none;right:auto;top:auto;
      display:grid;grid-template-columns:1fr 1fr;gap:1.5px;margin:0;
      background:var(--line2);border:1.5px solid var(--line2);border-top:0;
      border-radius:0 0 16px 16px;overflow:hidden}
    .wrow .card{border-bottom-left-radius:0;border-bottom-right-radius:0}
    .wsactions .wbtn{width:auto;height:auto;min-height:46px;border:0;border-radius:0;
      font-size:12.5px;font-weight:750;padding:0 10px}
    .wsactions .wbtn.good{color:var(--ok-t)}
    .wsactions .wbtn.del{color:var(--crit-t)}
    .wb-l{display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ixs-trenn{display:none}
    .ixs-row{gap:14px}
    .ixs-n{font-size:22px}
  }
  /* Ab hier ist es eine App: Seitenleiste zur Kopfzeile, Navigation nach
     unten in Daumenreichweite, Schrift groesser, Beruehrflaechen groesser. */
  @media(max-width:820px){
    .shell{grid-template-columns:minmax(0,1fr)}
    nav.rail{flex-direction:row;align-items:center;gap:12px;height:auto;
      padding:10px 14px calc(10px + env(safe-area-inset-top,0px));
      position:sticky;top:0;z-index:50}
    nav.rail .brand{padding:0;font-size:16px;gap:10px}
    nav.rail .brand .logo{width:32px;height:32px;font-size:15px}
    #rail{display:none}
    nav.rail .patient{margin:0 0 0 auto;padding:0;border-top:0;gap:9px}
    nav.rail .patient span{display:none}
    .tabbar{display:flex}
    /* Der Knopf oben ueber die volle Breite statt schmal neben der
       Ueberschrift - er war so kaum als Handlungsaufforderung erkennbar. */
    .wshead2{display:block}
    /* .wshead2 .addbtn statt nur .addbtn: die Sammelregel fuer
       Beruehrflaechen setzt min-height:44px und steht weiter unten im
       Stylesheet - bei gleicher Spezifitaet gewinnt die spaetere. Mit zwei
       Klassen ist die Reihenfolge egal. */
    .wshead2 .addbtn{display:flex;width:100%;min-height:52px;justify-content:center;
      margin-top:14px;font-size:15px}
    .fab{display:flex;align-items:center;gap:9px;position:fixed;right:14px;
      bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:55;
      min-height:52px;padding:0 20px;border:0;border-radius:999px;cursor:pointer;
      background:var(--plum);color:#fff;font:inherit;font-size:14.5px;font-weight:800;
      box-shadow:0 10px 26px -8px rgba(94,0,71,.7);-webkit-tap-highlight-color:transparent}
    .fab svg{flex:none;width:20px;height:20px}
    .fab:active{transform:scale(.97)}
    /* Weniger Platzbedarf. Achtung: .scope, .colh und .wsurface werden
       weiter unten im Stylesheet nochmals definiert und wuerden hier
       verlieren - sie stehen deshalb im Schlussblock. */
    .toolbar{padding:0;background:none;border:0;box-shadow:none}
    .col-scroll{max-height:none;overflow:visible;padding-right:0}
    .wstitle{font-size:20px}
    .sec-title{margin-bottom:10px}
    /* Die Verbindungslinien setzen zwei Spalten und einen 79px-Randstreifen
       voraus. Einspaltig laufen sie ins Leere und der runde Knopf liegt
       ausserhalb des Bildes - deshalb hier die Zeile statt der Linie. */
    #wsvg{display:none}
    .wsix{display:block}
    .wrow{margin-bottom:20px}
    .wrow .card{margin-bottom:0}
    main#main{padding:16px 14px calc(146px + env(safe-area-inset-bottom,0px))}
    /* Schrift: Basis 16px. Darunter zoomt iOS beim Fokussieren von
       Eingabefeldern automatisch hinein - deshalb bekommt die Suche sie fest. */
    body{font-size:16px}
    #q,input,select,textarea{font-size:16px}
    .cname{font-size:17px}
    .cbrands{font-size:13px}
    .cstate .sw{font-size:12px}
    .genebox .gn{font-size:17px}
    .genebox .gs{font-size:15px}
    .sec-sub{font-size:14.5px;max-width:none}
    .ab-plain,.plain{font-size:14.5px}
    .ixs-l{font-size:12.5px}
    .gpos-h,.gpos-s{font-size:13px}
    /* Beruehrflaechen: 44px ist die uebliche Untergrenze */
    .btn,.moreb,.bf,.sfb,.fchip,.heartbtn,.wbtn,.tab{min-height:44px}

    .lirow{margin-bottom:16px}
    .fchip{padding:0 14px}
    .infogrid{grid-template-columns:1fr}
  }
  @media(max-width:430px){
    main#main{padding:14px 12px calc(146px + env(safe-area-inset-bottom,0px))}
    .hero{padding:20px 15px;border-radius:16px}
    .wsurface{padding:15px 13px 17px}
    .rsband,.ixscore{padding:13px 13px}
    .rgene,.rdrug{padding:14px 13px}
    .cov-b{padding:13px}
    .sec-title{font-size:20px}
    .genebox,.card{border-radius:14px}
    .bigfilters{gap:8px}
    .sevfilters{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  /* Kugelsymbol ist quadratisch, nicht hochkant wie die Helix */
  .gb-ic svg.mtico{width:40px;height:40px}
  .gi-ok{background:var(--ok-bg);color:var(--ok-t)}.gi-warn{background:var(--warn-bg);color:var(--warn-t)}
  .gi-crit{background:var(--crit-bg);color:var(--crit-t)}.gi-ultra{background:#E8F5EC;color:#0b6b36}
  .gb-tx{flex:1;min-width:0}
  .genebox .gn{font-family:var(--mono);font-size:16px;font-weight:800;line-height:1.1;color:var(--ink)}
  .genebox .gs{font-size:14px;font-weight:800;margin-top:3px;line-height:1.2;letter-spacing:-.01em}
  .genepair{flex:none;display:flex;gap:5px;width:52px}
  /* Symbolpaar links, Skala rechts - oben ausgerichtet, damit das Paar
     auf einer Linie mit den Segmenten sitzt und nicht mit den Beschriftungen */
  .gsrow{display:flex;align-items:flex-start;gap:14px;margin-top:14px}
  .gsrow .genepair{padding-top:1px}
  .gsbar{flex:1;min-width:0}
  /* Metabolisierertyp bricht nur an sinnvollen Stellen und nie mitten im Wort */
  .genebox .gs{overflow-wrap:normal;word-break:keep-all;text-wrap:balance}
  .genepair svg{flex:1}
  .gscale{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
  .gs-seg{height:7px;border-radius:2px;background:#E4E0E7}
  .gs-seg.s0.on{background:var(--crit)}.gs-seg.s1.on{background:var(--warn)}
  .gs-seg.s2.on{background:var(--ok)}.gs-seg.s3.on{background:#0b6b36}
  /* Beschriftung einzeilig: Grossbuchstaben und Sperrung wurden zu breit und
     haben Woerter mitten im Wort umgebrochen */
  .gs-lab{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:7px}
  .gs-lab span{font-size:11px;font-weight:700;letter-spacing:-.01em;color:var(--faint);
    text-align:center;line-height:1.15;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gs-lab span.on{color:var(--ink);font-weight:800}
  /* Allel-Details in der Gen-Karte */
  .gexp{display:none;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  .genebox.open .gexp{display:block}
  .genebox.open .gchev{transform:rotate(180deg)}
  .gchev{flex:none;width:17px;height:17px;color:var(--faint);transition:transform .2s}
  .gsec{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--plum);margin:0 0 8px}
  .gsec.sp{margin-top:14px}
  .gyour{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
  .gyour .ga{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;border:1.5px solid;font-size:12.5px}
  .gyour .ga b{font-family:var(--mono);font-size:13.5px;font-weight:800}
  .gyour .ga span{margin-left:auto;font-weight:700;font-size:11.5px}
  .ga.f-ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-t)}
  .ga.f-warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn-t)}
  .ga.f-crit{background:var(--crit-bg);border-color:var(--crit-ln);color:var(--crit-t)}
  .ga.f-ultra{background:#E8F5EC;border-color:#B6DFC6;color:#0b6b36}
  .achips{display:flex;flex-wrap:wrap;gap:5px}
  .ach{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);color:var(--muted)}
  .ach.mine{background:var(--plum);border-color:var(--plum);color:#fff}
  .ach.f-ok{border-color:var(--ok-ln)}.ach.f-warn{border-color:var(--warn-ln)}.ach.f-crit{border-color:var(--crit-ln)}
  .ach.mine.f-ok,.ach.mine.f-warn,.ach.mine.f-crit,.ach.mine.f-ultra{background:var(--plum);border-color:var(--plum);color:#fff}
  .gmore{margin-top:12px;width:100%;justify-content:center}

  /* Gen-Modal */
  .genemodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(820px,94vw);max-height:92vh;overflow:auto;
    background:#fff;border-radius:22px;box-shadow:var(--sh-lg);z-index:90;opacity:0;pointer-events:none;transition:.24s}
  .genemodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .genemodal .gm-b{padding:20px 22px 24px}
  /* ---- Erklaer-Popup ---- */
  .infomodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(600px,94vw);max-height:88vh;overflow:auto;
    background:#fff;border-radius:20px;box-shadow:0 40px 90px -30px rgba(30,0,26,.6);opacity:0;pointer-events:none;transition:.22s;z-index:90}
  .infomodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .infomodal .if-b{padding:20px 24px 24px;font-size:14px;line-height:1.6;color:#3c3540}
  .infomodal .if-b p{margin:0 0 12px} .infomodal .if-b p:last-child{margin-bottom:0}
  .infomodal .if-b b{color:var(--plum)}
  .infomodal .if-b .ex{background:var(--plum-050);border-left:3px solid var(--plum);border-radius:0 11px 11px 0;
    padding:11px 14px;font-size:13px;margin:0 0 12px}
  /* Fragezeichen-Knopf */
  .ihelp{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--plum);background:#fff;color:var(--plum);
    font:inherit;font-size:12px;font-weight:800;line-height:1;cursor:pointer;display:inline-grid;place-items:center;
    vertical-align:middle;margin-left:6px;padding:0;transition:.14s}
  .ihelp:hover{background:var(--plum);color:#fff}
  .hero .ihelp,.wsleg .ihelp,.kpi .ihelp{border-color:currentColor;color:inherit;background:rgba(255,255,255,.001)}
  .hero .ihelp{border-color:var(--plum);color:var(--plum)}
  .wsleg .ihelp:hover,.kpi .ihelp:hover{background:#fff;color:var(--ink)}

  .genelist{margin-top:6px}
  .gitem{border:1.5px solid var(--line2);border-radius:14px;margin-bottom:9px;background:#fff}
  .gitem-h{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer}
  .gitem-h .gname{font-family:var(--mono);font-weight:800;font-size:15px}
  .gitem-h .gstat{font-size:13px;font-weight:750}
  .gitem-h .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
  .gitem.open .chev{transform:rotate(180deg)}
  .gitem-b{display:none;padding:0 15px 15px}
  .gitem.open .gitem-b{display:block}
  /* ---- Navigations-Gruppen ---- */
  .nav-group{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#c79cb8;
    padding:16px 14px 6px;line-height:1.2}
  .nav-group:first-child{padding-top:0}
  .nav-badge.nb-plain{background:rgba(255,255,255,.2);color:#fff}

  /* ---- Geltungsbereich-Hinweis: eigene Liste vs. Datenbank ---- */
  .scope{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:13px 16px;margin:0 0 18px;
    font-size:13.5px;line-height:1.5;border:1.5px solid}
  .scope svg{flex:none;margin-top:1px}
  .scope a{color:inherit;font-weight:800}
  .scope-db{background:var(--plum-050);border-color:#E7D3E0;color:#4a3c46}
  .scope-db svg{color:var(--plum)} .scope-db b{color:var(--plum)}
  .scope-me{background:var(--ok-bg);border-color:var(--ok-ln);color:#2c4638}
  .scope-me svg{color:var(--ok-t)} .scope-me b{color:var(--ok-t)}

  /* ---- Grosse Filterbuttons ---- */
  .bigfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,178px),1fr));gap:11px;margin-bottom:16px}
  .bf{text-align:left;border-radius:15px;padding:13px 15px 14px;cursor:pointer;border:2px solid transparent;
    box-shadow:0 2px 6px rgba(30,10,30,.16);transition:.14s;font:inherit;color:#fff}
  .bf .bfn{display:block;font-size:28px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .bf .bfl{display:block;font-size:14.5px;font-weight:800;margin-top:5px;line-height:1.2}
  .bf .bft{display:block;font-size:11.5px;font-weight:600;line-height:1.35;margin-top:4px;color:rgba(255,255,255,.92)}
  .bf-all,.bf-watch{background:var(--plum)} .bf-crit{background:#D02A2A}
  .bf-warn{background:#E08000} .bf-ok{background:#12A150}
  .bf:hover{transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(30,10,30,.5)}
  /* aktiv gewaehlt: weisser Ring plus dunklerer Grundton */
  .bf[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--ink),0 8px 20px -8px rgba(30,10,30,.5)}
  .bf-all[aria-pressed="true"],.bf-watch[aria-pressed="true"]{background:var(--plum-700)}
  .bf-crit[aria-pressed="true"]{background:#A81E1E}
  .bf-warn[aria-pressed="true"]{background:#B36400}
  .bf-ok[aria-pressed="true"]{background:#0B7B3C}

  /* ---- Startblock und Aufforderung ---- */
  .start{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:22px 24px 24px;margin-bottom:20px}
  .start .st-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px}
  .start .st-head>div{flex:1;min-width:260px}
  .start .st-eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ok-t);margin-bottom:8px}
  .start h2{margin:0;font-size:clamp(22px,2.7vw,30px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
  .start p{margin:8px 0 0;font-size:14.5px;color:var(--muted);line-height:1.5;max-width:60ch}
  .start-empty{text-align:center;padding:38px 26px 34px;border:2px dashed #E0C9D8;background:var(--plum-050)}
  .start-empty .st-ic{width:74px;height:74px;border-radius:50%;background:#fff;border:2px solid #E7D3E0;
    display:grid;place-items:center;margin:0 auto 16px;color:var(--plum)}
  .start-empty h2{max-width:24ch;margin:0 auto}
  .start-empty p{margin:11px auto 0}
  .cta{flex:none;border:0;border-radius:13px;background:var(--plum);color:#fff;cursor:pointer;font:inherit;
    font-size:15.5px;font-weight:800;padding:15px 24px;display:inline-flex;align-items:center;gap:10px;
    box-shadow:0 6px 18px -6px rgba(94,0,71,.6);transition:.14s}
  .cta:hover{background:var(--plum-700)} .cta svg{color:#fff}
  .start-empty .cta{margin-top:20px}

  /* ---- Kennzahlen im Kopf: die Zahlen tragen die Aussage ---- */
  .hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:24px;
    padding-top:22px;border-top:1px solid var(--line)}
  .hstat{position:relative;padding:0 22px}
  .hstat:first-child{padding-left:0}
  .hstat+.hstat::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line)}
  .hstat .hsic{width:34px;height:34px;border-radius:10px;background:var(--plum-050);border:1px solid #EEDFE9;
    display:grid;place-items:center;color:var(--plum);margin-bottom:11px}
  .hstat .hsn{font-size:clamp(38px,4.2vw,54px);font-weight:800;letter-spacing:-.04em;line-height:.92;
    color:var(--plum);font-variant-numeric:tabular-nums}
  .hstat .hsl{font-size:14.5px;font-weight:800;color:var(--ink);margin-top:7px;line-height:1.25}
  .hstat .hsd{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px;line-height:1.4}
  .hstat.hs-mark .hsic{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn-t)}
  .hstat.hs-mark .hsn{color:var(--warn-t)}
  @media(max-width:820px){
    .hstats{grid-template-columns:1fr;gap:18px}
    .hstat{padding:0} .hstat+.hstat::before{display:none}
    .hstat+.hstat{padding-top:18px;border-top:1px solid var(--line)}
  }
  /* ---- Verteilung der Medikamente ---- */
  .hband{margin-top:24px;padding:20px 22px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
  .hb-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .hb-n{font-size:clamp(30px,3.4vw,42px);font-weight:800;letter-spacing:-.04em;line-height:1;
    color:var(--plum);font-variant-numeric:tabular-nums}
  .hb-t{font-size:14px;font-weight:800;line-height:1.3;color:var(--ink)}
  .hb-t span{font-size:12.5px;font-weight:600;color:var(--muted)}
  .hb-bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#E4E0E7;
    box-shadow:inset 0 1px 2px rgba(30,10,30,.12)}
  .hbb{height:100%} .hbb.ok{background:#12A150} .hbb.warn{background:#E08000} .hbb.crit{background:#D02A2A}
  .hbb+.hbb{box-shadow:-1px 0 0 rgba(255,255,255,.85)}
  .hb-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
  @media(max-width:760px){.hb-keys{grid-template-columns:1fr}}
  .hbk{text-align:left;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line2);
    border-radius:13px;padding:11px 13px;cursor:pointer;transition:.14s;border-left-width:5px}
  .hbk:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(30,10,30,.4)}
  .hbk .hbkn{display:block;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1;
    font-variant-numeric:tabular-nums}
  .hbk .hbkl{display:block;font-size:13px;font-weight:800;margin-top:5px}
  .hbk .hbkd{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
  .hbk.k-ok{border-left-color:var(--ok)} .hbk.k-ok .hbkn,.hbk.k-ok .hbkl{color:var(--ok-t)}
  .hbk.k-warn{border-left-color:var(--warn)} .hbk.k-warn .hbkn,.hbk.k-warn .hbkl{color:var(--warn-t)}
  .hbk.k-crit{border-left-color:var(--crit)} .hbk.k-crit .hbkn,.hbk.k-crit .hbkl{color:var(--crit-t)}
  /* ---- Erklaerblock auf der Reise ---- */
  .jour{display:flex;gap:18px;background:#fff;border-radius:20px;box-shadow:var(--sh);padding:20px 24px 22px;margin-bottom:20px}
  .jour .jic{flex:none;width:54px;height:54px;border-radius:16px;background:var(--plum-050);border:1.5px solid #EEDFE9;
    display:grid;place-items:center;color:var(--plum)}
  .jour .jtx{min-width:0}
  .jour h3{margin:0 0 7px;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .jour p{margin:0;font-size:14.5px;line-height:1.6;color:#3c3540;max-width:74ch}
  .jour p b{color:var(--plum)}
  .jbtns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
  @media(max-width:640px){.jour{flex-direction:column;gap:12px}}
  .wstitle em{font-style:normal;color:var(--plum)}

  /* ---- Grosse Legende: Farbbox links, Erklaerung rechts, untereinander ---- */
  .lgd{display:flex;flex-direction:column;gap:12px}
  .lg{display:flex;align-items:stretch;gap:0;background:#fff;border-radius:18px;box-shadow:var(--sh);
    border:1.5px solid var(--line);overflow:hidden;text-align:left;font:inherit;color:var(--ink);padding:0;transition:.14s}
  button.lg{cursor:pointer}
  button.lg:hover{border-color:var(--plum);transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(40,0,35,.45)}
  .lgbox{flex:none;width:154px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;padding:20px 12px;color:#fff}
  .lgbox .lgn{font-size:33px;font-weight:800;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  .lgbox .lgic{display:grid;place-items:center;color:#fff}
  .lgbox .lgl{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.95}
  .lg-total .lgbox{background:linear-gradient(160deg,var(--plum),#7d1668)}
  .lg-ok .lgbox{background:#12A150} .lg-crit .lgbox{background:#D02A2A}
  .lg-warn .lgbox{background:#E08000} .lg-ix .lgbox{background:#3f3348}
  .lgtx{flex:1;min-width:0;padding:16px 20px 17px;display:flex;flex-direction:column;justify-content:center}
  .lgtx h4{margin:0 0 5px;font-size:16px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
  .lgtx p{margin:0;font-size:13.5px;line-height:1.55;color:#3c3540;max-width:78ch}
  .lgtx p b{color:var(--plum)}
  .lgmore{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;font-weight:800;
    letter-spacing:.03em;color:var(--plum)}
  .lg-ok .lgmore{color:var(--ok-t)} .lg-crit .lgmore{color:var(--crit-t)} .lg-warn .lgmore{color:var(--warn-t)}
  @media(max-width:640px){.lg{flex-direction:column} .lgbox{width:100%;flex-direction:row;gap:12px;padding:12px 16px}}

  /* ---- Ablauf in drei Schritten, oben in der Box ---- */
  .flow{display:flex;align-items:stretch;gap:4px;padding:4px 4px 16px;margin-bottom:14px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .fstep{flex:1;min-width:190px;display:flex;align-items:center;gap:11px;text-align:left;font:inherit;color:var(--ink);
    background:var(--plum-050);border:1.5px solid #EEDFE9;border-radius:14px;padding:10px 13px;cursor:pointer;transition:.14s}
  .fstep:hover{border-color:var(--plum);background:#fff;box-shadow:0 4px 12px -6px rgba(94,0,71,.5)}
  .fstep .fic{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:var(--plum);
    display:grid;place-items:center;color:#fff}
  .fstep .fic svg{color:#fff}
  .fstep .fnum{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#fff;
    border:2px solid var(--plum);color:var(--plum);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
  .fstep .ftx{min-width:0}
  .fstep .ftt{display:block;font-size:13.5px;font-weight:800;line-height:1.2}
  .fstep .ftd{display:block;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.35;margin-top:2px}
  .farr{flex:none;display:grid;place-items:center;color:var(--plum);opacity:.5;padding:0 2px}
  @media(max-width:820px){.farr{display:none} .fstep{min-width:100%}}

  .kpi.kclick{cursor:pointer;text-align:left;font:inherit;transition:.14s}
  .kpi.kclick:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(40,0,35,.45)}

  /* ---- Zu deiner Liste hinzufuegen ---- */
  .lirow{display:block}
  .moreb{grid-column:1/-1;width:100%;margin:2px 0 18px;padding:13px;border-radius:13px;cursor:pointer;
    border:1.5px dashed var(--line2);background:#fff;color:var(--plum);font:inherit;font-size:13.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:.14s}
  .moreb:hover{border-style:solid;border-color:var(--plum);background:var(--plum-050)}
  /* Medikamentenliste dreispaltig ab Desktop */
  /* min(100%,...) statt fester Breite: oberhalb 352px wie bisher, darunter
     schrumpft die Spalte statt herauszuragen. Ersetzt die frueheren
     420px-Sonderregeln. */
  .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cardw)),1fr));
    justify-content:start;gap:0 14px;align-items:start}
  /* Knopf "Medikament hinzufuegen" - eine eigene Zeile UNTER der Karte, nicht mehr
     als Kreis darueber. Als Ueberlagerung traf er Statuszeile und
     Aufklapppfeil, sobald er eine Beschriftung bekam; ausserdem lagen mit
     display:grid und place-items:center Symbol und Text in derselben
     Rasterzelle und damit uebereinander. Beides ist mit einer normalen
     Flex-Zeile im Fluss per Konstruktion ausgeschlossen. */
  .lirow{width:var(--cardw);max-width:100%}
  /* Fusszeile INNERHALB der Karte: keine eigene Umrandung, nur eine
     Trennlinie nach oben, und unten die Rundung der Karte. Sie steht
     ausserhalb von .cbody und bleibt deshalb auch bei zugeklappter Karte
     sichtbar. */
  .heartbtn{display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:42px;margin:0;padding:0 14px;
    border:0;border-top:1px solid var(--line);border-radius:0 0 17px 17px;
    background:transparent;cursor:pointer;font:inherit;font-weight:750;
    color:var(--plum);transition:.14s}
  .heartbtn:hover{background:var(--plum-050)}
  .heartbtn.on{background:var(--ok-bg);color:var(--ok-t);border-top-color:var(--ok-ln)}
  .heartbtn svg{flex:none;width:17px;height:17px}
  /* Ampelfilter in der Suche */
  .sevfilters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:11px}
  .sfb{display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:12px;font-weight:800;
    letter-spacing:.03em;padding:10px 6px;border-radius:10px;border:2px solid transparent;cursor:pointer;
    color:#fff;transition:.14s;box-shadow:0 2px 5px rgba(30,10,30,.16)}
  .sfb svg{flex:none;color:#fff}
  .sf-crit{background:#D02A2A} .sf-warn{background:#E08000}
  .sf-ok{background:#12A150} .sf-fav{background:var(--plum)}
  .sfb:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(30,10,30,.55)}
  .sfb[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2.5px var(--ink)}
  @media(max-width:520px){.sevfilters{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .flab{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);align-self:center;margin-right:2px}
  .addws{width:100%;margin:-6px 0 14px;border:1.5px solid var(--plum);border-radius:11px;background:#fff;color:var(--plum);
    cursor:pointer;font:inherit;font-size:13px;font-weight:800;padding:9px 12px;display:flex;align-items:center;
    justify-content:center;gap:7px;transition:.14s}
  .addws:hover{background:var(--plum);color:#fff}
  .addws.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-t)}
  .addws.on:hover{background:var(--ok);color:#fff}
  .colh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.09em;
    text-transform:uppercase;color:var(--plum);margin:0 0 10px 2px}
  .wsurface .colh{margin-bottom:6px}

  /* ---- Genkopien in Klartext ---- */
  .plain{font-size:13.5px;line-height:1.55;color:#3c3540;background:var(--panel);border-radius:11px;padding:11px 13px;margin-bottom:4px}
  .plain b{color:var(--plum)}
  .plain.sm{font-size:12.5px;padding:10px 12px}
  .gcopies{display:flex;flex-direction:column;gap:7px}
  .gcopy{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;border:1.5px solid}
  .gcopy .gcic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .gcopy .gctx{min-width:0}
  .gcopy .gck{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
  .gcopy .gck span{font-weight:600;letter-spacing:0;text-transform:none;opacity:.75}
  .gcopy .gcf{font-size:14px;font-weight:800;line-height:1.25;margin-top:2px}
  .gcopy .gcs{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
  .gcopy .gcs b{font-family:var(--mono);font-weight:800;color:inherit}
  .gcopy.c-ok{background:var(--ok-bg);border-color:var(--ok-ln);color:var(--ok-t)}
  .gcopy.c-ok .gcic{background:var(--ok)}
  .gcopy.c-ultra{background:#E8F5EC;border-color:#B6DFC6;color:#0b6b36} .gcopy.c-ultra .gcic{background:#0b6b36}
  .gcopy.c-warn{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn-t)} .gcopy.c-warn .gcic{background:var(--warn)}
  .gcopy.c-crit{background:var(--crit-bg);border-color:var(--crit-ln);color:var(--crit-t)} .gcopy.c-crit .gcic{background:var(--crit)}

  /* ---- Fachdetails hinter zweitem Schalter ---- */
  .techbtn{width:100%;margin-top:12px;border:1.5px dashed var(--line2);border-radius:11px;background:var(--panel);
    color:var(--muted);cursor:pointer;font:inherit;font-size:12px;font-weight:750;padding:9px 12px;
    display:flex;align-items:center;gap:8px;transition:.14s}
  .techbtn:hover{border-color:var(--plum);color:var(--plum)}
  .techbtn.on{border-style:solid;border-color:var(--plum);color:var(--plum);background:var(--plum-050)}
  .techbtn .tchev{flex:none;transition:transform .18s}
  .techbtn.on .tchev{transform:rotate(180deg)}
  .techbox{display:none;margin-top:9px}
  .techbox.open{display:block}


  /* ---- Arztbericht: Einleitung ---- */
  .dintro{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:20px 24px 22px;margin-bottom:6px}
  .dintro h3{margin:0 0 8px;font-size:17px;font-weight:800;letter-spacing:-.015em}
  .dintro p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:#3c3540;max-width:92ch}

  /* ---------- Modale am Telefon: Bottom-Sheets -----------------------
     Steht bewusst am Ende des Stylesheets: die Basisregeln von .genemodal
     und .infomodal kommen weiter oben nach dem Mobilblock, und bei gleicher
     Spezifitaet gewinnt die spaetere Regel.
     Aus dem unteren Rand herein, volle Breite, in Daumenreichweite. Zweiter
     Grund fuer den Umbau: die bisherige Breite haengt an 94vw, und vw loest
     in eingebetteten Ansichten nicht immer auf - gemessen kamen alle vier
     Fenster auf 0px. Mit left/right/bottom statt Breite plus Mittenversatz
     kann das nicht mehr passieren. */
  @media(max-width:820px){
    /* Der Knopf steht seit v82 in allen Groessen unter der Karte; am Telefon
       nur groesser fuer die Beruehrflaeche. */
    .heartbtn{min-height:48px;font-size:14.5px}
    /* Platz sparen: Erklaerkasten kleiner, Schrittzeilen weg - die
       Bereichskopfzeilen sagen dasselbe kuerzer -, Arbeitsflaeche ohne
       eigenen Kasten, weil sie am Telefon die ganze Breite ist. */
    .scope{padding:11px 13px;font-size:13px;margin-bottom:14px}
    .colh{display:none}
    .wsurface{padding:0;background:none;box-shadow:none;min-height:0}
    /* inset statt einzelner Kanten: die Einzelangaben werden vom Browser
       ohnehin zu inset zusammengefasst, und in dieser Form ist eindeutig,
       dass alle vier Kanten gesetzt sind. Hoehe ueber dvh, damit die
       Adressleiste mobiler Browser nicht hineinragt; vh faellt als
       Rueckfall davor. */
    .ixmodal,.genemodal,.altpick,.infomodal,.addmodal{
      inset:auto 0 0 0;width:auto;max-width:none;
      max-height:88vh;max-height:88dvh;border-radius:22px 22px 0 0;
      transform:translateY(18px) scale(1)}
    .ixmodal.open,.genemodal.open,.altpick.open,.infomodal.open,.addmodal.open{
      transform:translateY(0) scale(1)}
    .ixmodal .ix-b,.genemodal .gm-b,.altpick .ap-b,.infomodal .if-b,.addmodal .add-b{
      padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
    .ix-h{padding:16px}
  }

  /* ============================================================
     EINFACH / EXPERTE
     Diese beiden Regeln stehen bewusst am ENDE des Stylesheets.

     in diesem Projekt schon viermal passiert.
     ============================================================ */
  body.m-einfach .x-only{display:none!important}
  body.m-experte .s-only{display:none!important}

  .msw-b{flex:1;min-height:32px;padding:0 10px;border:0;border-radius:8px;cursor:pointer;
    background:transparent;color:#d8b6cd;font:inherit;font-size:12.5px;font-weight:750;

  body.m-einfach .msw-b[data-m="einfach"],
  body.m-experte .msw-b[data-m="experte"]{background:#fff;color:var(--plum)}

    /* Waagrechte Kopfleiste: der Umschalter sitzt zwischen Marke und

    .modesw{margin:0;flex:none}
    /* 38px statt 30: die Kopfleiste ist 60px hoch, mehr passt nicht hinein,
