rs or family history, including those with certain inherited ryanodine receptor (RYR1) or dihydropyridine receptor (CACNA1S) variants.\" See label for more information.","\"CONTRAINDICATIONS: Known or suspected genetic susceptibility to malignant hyperthermia...ULTANE [sevoflurane] can induce malignant hyperthermia in patients with known or suspected susceptibility based on genetic factors or family history, including those with certain inherited ryanodine receptor (RYR1) or dihydropyridine receptor (CACNA1S) variants.\" See label for more information.","\"CYP2D6 ultra-rapid metabolizers may not achieve adequate concentrations of CERDELGA [eliglustat] to achieve a therapeutic effect.\" See label for more information.","\"Individuals who are ultra-rapid metabolizers should not use codeine.\" See label for more information","\"May affect systemic concentrations. Monitor for adverse reactions and clinical effect.\"","\"May alter systemic concentrations.\"","\"May result in higher systemic concentrations and higher adverse reaction risk (central nervous system toxicity). Consider starting at the lower end of the dosage range and monitor serum concentrations. Refer to FDA labeling for specific dosing recommendations. Carriers of CYP2C9*3 alleles may be at increased risk of severe cutaneous adverse reactions. Consider avoiding fosphenytoin as an alternative to carbamazepine in patients who are CYP2C9*3 carriers. Genotyping is not a substitute for clinical vigilance and patient management.\"","\"May result in higher systemic concentrations and higher adverse reaction risk (central nervous system toxicity). Refer to FDA labeling for specific dosing recommendations. Carriers of CYP2C9*3 alleles may be at increased risk of severe cutaneous adverse reactions. Consider avoiding phenytoin as an alternative to carbamazepine in patients who are CYP2C9*3 carriers. Genotyping is not a substitute for clinical vigilance and patient management.\"","\"May result in higher systemic concentrations and higher adverse reaction risk. Monitor for adverse reactions.\"","\"Monitoring for increased adverse reactions is recommended in patients known to carry genetic variants associated with diminished CYP2C9 function.\" See label for more information.","\"Patients who are intermediate or poor metabolizers of CYP2C9 substrates (e.g., *1/*3, *2/*2, *3/*3) may exhibit increased phenytoin serum concentrations compared to patients who are normal metabolizers (e.g., *1/*1). Thus, patients who are known to be intermediate or poor metabolizers may ultimately require lower doses of phenytoin to maintain similar steady-state concentrations compared to normal metabolizers.\" See label for more information.","\"Results in higher systemic active metabolite concentrations and higher adverse reaction risk (life-threatening respiratory depression and death). Codeine is contraindicated in children under 12 years of age.\"","\"Results in higher systemic and breast milk active metabolite concentrations, which may result in respiratory depression and death. Contraindicated in children under 12 and in adolescents following tonsillectomy/adenoidectomy. Breastfeeding is not recommended during treatment.\"","\"Results in higher systemic concentrations. Adjust dosage based on genotype. Do not use in patients with CYP2C9 *3/*3 genotype. Refer to FDA labeling for specific dosing recommendations.\"","\"Results in higher systemic concentrations. Consider reducing dosage in poor metabolizers.\"","\"Results in higher systemic concentrations.\"","\"Results in lower systemic concentrations, lower probability of achieving target concentrations and may result in higher rejection risk. Measure drug concentrations and adjust dosage based on trough whole blood tacrolimus concentrations.\"","\"The use of SUPRANE [desflurane] is contraindicated in...[cases of k]nown or suspected genetic susceptibility to malignant hyperthermia...SUPRANE [desflurane] can induce malignant hyperthermia in patients with known or suspected susceptibility based on genetic factors or family history, including those with certain inherited ryanodine receptor (RYR1) or dihydropyridine receptor (CACNA1S) variants. \" See label for more information.","\"Ultra-Rapid Metabolism of Codeine and Other Risk Factors for Life-threatening Respiratory Depression in Children. Life-threatening respiratory depression and death have occurred in children who received codeine. Most of the reported cases occurred following tonsillectomy and/or adenoidectomy, and many of the children had evidence of being an ultra-rapid metabolizer of codeine due to CYP2D6 polymorphism.\" See label for more information","\"[P]atients who are known to be intermediate or poor metabolizers may ultimately require lower doses to maintain similar steady-state concentrations compared to normal metabolizers. In patients who are known to be carriers of the decreased function CYP2C9*2 or *3 alleles (intermediate and poor metabolizers), consider starting at the low end of the dosage range and monitor serum concentrations to maintain total phenytoin concentrations of 10 to 20 mcg/mL.\" See label for more information.","&middot; Be extra alert to reduced efficacy of the treatment. &middot; Advise the patient to report an inadequate effect. &middot; An alternative can be selected as a precaution. Clonidine is not metabolised by CYP2D6.","&middot; The loading dose does not need to be adjusted. &middot; For the other doses, use 70-75% of the standard dose and assess the dose based on effect and serum concentration after 7&mdash;10 days. &middot; Advise the patient to report side effects (such as ataxia, nystagmus, slurred speech, sedation or rash).","&middot; double the standard dose and monitor the effect and side effects or the plasma concentrations of doxepin and nordoxepin in order to set the maintenance dose &middot; if a dose increase is not wanted due to the potentially cardiotoxic hydroxy metabolites: avoid doxepin. Antidepressants that are not metabolised by CYP2D6, or to a lesser extent, include citalopram and sertraline.","&middot; increase the dose to 1.6 times the normal dose, monitor the effect and side effects or the plasma concentrations and be alert to increased plasma concentrations of the cardiotoxic Z-10-hydroxy metabolites. Plasma concentrations of Z-hydroxy nortriptyline or Z-hydroxy amitriptyline higher than 40 ng/mL are considered toxic. &middot; if a dose increase is not desirable due to the cardiotoxic hydroxy metabolite: avoid amitriptyline Anti- depressants that are not metabolised by CYP2D6, or to a lesser extent, include citalopram and sertraline.","&middot; use 1.5 times the normal dose and monitor the effect and side effects of the plasma concentrations of clomipramine and desmethylclomipramine to set the maintenance dose. &middot; if a dose increase is not wanted due to potential cardiotoxic hydroxy metabolites: avoid clomipramine. Antidepressants that are not metabolised by CYP2D6, or to a lesser extent, include citalopram and sertraline.","&middot; use 65% of the standard initial dose. The genotype-specific initial dose and maintenance dose can be calculated using an algorithm. Algorithms for Caucasian patients usually contain only the *2 and *3 allele. If the activity of the reduced-activity alleles is comparable to the activity of *2 or *3, then the algorithm can be completed as if *1/*2 or *1/*3 is present. See annotation for Excel files containing calculation modules for oral and equivalent intravenous doses. From day 6 on the standard algorithm without genotype information can be used to calculate the dose. Modified dose algorithms have been developed for patients of African or (East) Asian heritage.","As the total analgesic effect changes when the ratio between the mother compound and the active metabolite changes, the effect of a dose reduction cannot be predicted with certainty. &middot; Select an alternative. Do not choose codeine, as it is contra-indicated for CYP2D6 UM. Morphine is not metabolised by CYP2D6. Oxycodone is metabolised by CYP2D6 to a limited extent, but this does not result in differences in side effects in patients. &middot; If an alternative is not possible, use 40% of the standard dose. Advise the patient to report side effects (such as drowsiness, confusion, constipation, nausea and vomiting, respiratory depression or urine retention).","Avoid amitriptyline use; If amitriptyline is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Utilize therapeutic drug monitoring to guide dose adjustment.","Avoid clomipramine use; If clomipramine is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Utilize therapeutic drug monitoring to guide dose adjustment.","Avoid codeine use because of potential for serious toxicity. If opioid use is warranted, consider a non-tramadol opioid.","Avoid doxepin use; If doxepin is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Utilize therapeutic drug monitoring to guide dose adjustment.","Avoid imipramine use; If imipramine is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Utilize therapeutic drug monitoring to guide dose adjustment.","Avoid moderate and strong CYP2D6 inhibitors. Initiate therapy with recommended standard of care dosing (tamoxifen 20 mg/day).","Avoid tramadol use because of potential for toxicity. If opioid use is warranted, consider a non-codeine opioid.","Avoid tricyclic use due to potential lack of efficacy. Consider alternative drug not metabolized by CYP2D6. If a TCA is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Titrate dose to observed clinical response with symptom improvement and minimal (if any) side effects. Utilize therapeutic drug monitoring to guide dose adjustments.","Avoid tricyclic use due to potential lack of efficacy. Consider alternative drug not metabolized by CYP2D6. If a tricyclic antidepressant is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Titrate dose to observed clinical response with symptom improvement and minimal (if any) side effects. Utilize therapeutic drug monitoring to guide dose adjustments.","Avoid trimipramine use; If trimipramine is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Utilize therapeutic drug monitoring to guide dose adjustment.","Based on genotype, there is no indication to change dose or therapy. Use label-recommended dosage and administration.","Choose an alternative or titrate the dose according to the maximum dose for the active metabolite (paliperidone) (oral 12 mg/day for adults and children from 15 years of age weighing at least 51 kg and 6 mg/day for children from 15 years of age weighing less than 51 kg; intramuscular 75 mg per 2 weeks).","Clinical findings, family history, further genetic testing and other laboratory data should guide use of halogenated volatile anesthetics or depolarizing muscle relaxants.","Consider a starting total daily dose of at least 75 mg. Titrate up to 300 mg total daily hydralazine dose as tolerated. NAT2 intermediate metabolizers typically require a 50-100% higher maintenance dose compared to poor metabolizers.","Consider initiating efavirenz with decreased dose of 400 mg/day","DOSES HIGHER THAN 20 mg every 6 hours for adults and 10 mg every 6 hours for children aged 12 years or older AND/OR ADDITIONAL RISK FACTORS, such as co-medication with CYP3A4 inhibitors and/or reduced kidney function: Codeine is contra-indicated. If possible, select an alternative. &middot; For PAIN: do not select tramadol, as this is also metabolised by CYP2D6. Morphine is not metabolised by CYP2D6. Oxycodone is metabolised by CYP2D6 to a limited extent, but this does not result in differences in side effects in patients. &middot; For COUGH: noscapine is not metabolised by CYP2D6. DOSES LOWER THAN OR EQUAL TO 20 mg every 6 hours for adults and 10 mg every 6 hours for children aged 12 years or older AND NO ADDITIONAL RISK FACTORS, such as co-medication with CYP3A4 inhibitors and/or reduced kidney function: No action required.","Determine the efavirenz plasma concentration if side effects occur and reduce the dose if needed. In 14 IM adults, a dose reduction to 400 mg/day (2/3rd of the standard dose) was sufficient to achieve therapeutic plasma concentrations and to reduce or resolve side effects. The therapeutic range established for efavirenz is 1000-4000 ng/ml.","Eliglustat is contraindicated. Avoid eliglustat","If considering clopidogrel, use at standard dose (75 mg/day)","Increase starting dose 1.5 to 2 times recommended starting dose. Total starting dose should not exceed 0.3 mg/kg/day. Use therapeutic drug monitoring to guide dose adjustments.","Initiate standard starting daily dose. Consider increasing dose by 50-100% for the treatment of H. pylori infection and erosive esophagitis. Daily dose may be given in divided doses. Monitor for efficacy.","Initiate therapy with recommended standard of care dosing","Initiate therapy with recommended starting dose","Initiate therapy with recommended starting dose. Consider a slower titration schedule and lower maintenance dose.","Initiate therapy with recommended starting dose. In accordance with the meloxicam prescribing information, use the lowest effective dosage for shortest duration consistent with individual patient treatment goals.","Initiate therapy with recommended starting dose. In accordance with the prescribing information, use the lowest effective dosage for shortest duration consistent with individual patient treatment goals.","Initiate therapy with standard starting dose (e.g., 2 mg/kg/day for autoimmune diseases). During therapy, adjust doses of azathioprine based on disease-specific guidelines. It usually takes at least 2 weeks to reach steady state after each dose adjustment.","Initiate therapy with standard starting dose of mecaptopurine (e.g., 75 mg/m2/day for malignancy or 1.5 mg/kg/day for nonmalignancy). During therapy, adjust the doses of myelosuppressive agents, as per standard clinical practice. It usually takes at least 2 weeks of stable dosing to reach steady state after each dose adjustment.","Initiate therapy with standard starting dose of thioguanine (e.g., 40 mg/m2/day for malignancy). During therapy, adjust the doses of myelosuppressive agents, as per standard clinical practice. It usually takes at least 2 weeks of stable dosing to reach steady state after each dose adjustment.","Initiate with a dose of 0.5 mg/kg/day and increase to 1.2 mg/kg/day after 3 days. If no clinical response and in the absence of adverse events after 2 weeks, consider obtaining a peak plasma concentration (1 to 2 hours after dose administered). If <200 ng/mL, consider a proportional increase in dose to approach 400 ng/mL.","Initiate with a dose of 40 mg/day and increase to 80 mg/day after 3 days. If no clinical response and in the absence of adverse events after 2 weeks, consider increasing dose to 100 mg/day. If no clinical response observed after 2 weeks, consider obtaining a peak plasma concentration (1 to 2 hours after dose administered). If <200 ng/mL, consider a proportional increase in dose to approach 400 ng/mL. Dosages greater than 100 mg/day may be needed to achieve target concentrations.","It is not possible to offer adequately substantiated recommendations for dose adjustment based on the literature. &middot; Either monitor plasma concentrations, perform an ECG and be alert to reduced efficacy of the therapy. &middot; Or choose an alternative. Antiarrhythmic drugs that are hardly if at all metabolised by CYP2D6 include, for example, sotalol, disopyramide, quinidine and amiodarone.","It is not possible to offer substantiated advice for dose adjustment based on the literature. Avoid paroxetine. Antidepressants that are not metabolised by CYP2D6, or to a lesser extent, include for example citalopram or sertraline.","Ivacaftor is not recommended","NO action is needed for this gene-drug interaction.","NO action is required for the gene-drug interaction.","NO action is required for this gene-drug interaction.","No action recommended based on genotype for venlafaxine because of minimal evidence regarding the impact on efficacy or side effects.","No adjustments needed from typical dosing strategies. Subsequent doses should be adjusted according to therapeutic drug monitoring, response and side effects. An HLA-B*15:02 negative test does not eliminate the risk of phenytoin-induced SJS/TEN and patients should be carefully monitored according to a usual standard.","No reason to avoid based on G6PD status","No recommendation","No recommendation due to lack of evidence","No recommendation for hydrocodone therapy because of minimal evidence regarding adverse events or analgesia.","No recommendation for metoprolol therapy due to insufficient evidence regarding diminished metoprolol effectiveness clinically","Prescribe &le;20mg as a starting dose and adjust doses of rosuvastatin based on disease-specific and specific population guidelines. If dose >20mg needed for desired efficacy, consider an alternative statin or combination therapy (i.e., rosuvastatin plus non-statin guideline directed medical therapy) (PMID: 30423391).","Prescribe &le;40mg per day as a starting dose and adjust doses of fluvastatin based on disease-specific guidelines. If dose >40mg needed for desired efficacy, consider an alternative statin or combination therapy (i.e., fluvastatin plus non-statin guideline directed medical therapy) (PMID: 30423391).","Prescribe desired starting dose and adjust doses based on disease-specific guidelines.","RECOMMENDATION LIVER TRANSPLANTATION In addition to the patient's genotype, the metabolism of tacrolimus is also determined by the genotype of the transplanted liver. LIVER is also of the genotyp const P_DIMP=["ABCG2: Increased rosuvastatin exposure compared to normal and decreased function; unknown myopathy risk; increased lipid-lowering effects | SLCO1B1: Typical myopathy risk and statin exposure","An increase of the initial dose can result in an increased chance of reaching a tacrolimus concentration within the target range before the start of therapeutic drug monitoring. However, there is no direct evidence that this results in improved clinical results. The genetic variation results in increased conversion of tacrolimus to inactive metabolites and therefore in a higher required dose.","As a result of the genetic variation, the plasma concentration of the active metabolites 4-hydroxytamoxifen and endoxifen can increase. However, there is no evidence that this results in an increase in the side effects.","CFTR: An individual diagnosed with cystic fibrosis (CF) and negative for a CFTR variant listed in the FDA-approved drug label as being responsive to ivacaftor.","CYP2B6: Higher dose-adjusted trough concentrations of efavirenz compared with normal metabolizers; increased risk of CNS adverse events","CYP2B6: Reduced metabolism of sertraline to less active compounds when compared to CYP2B6 normal metabolizers. | CYP2C19: Normal metabolism","CYP2C19: Normal PPI metabolism; may be at increased risk of therapeutic failure compared to CYP2C19 IMs and PMs","CYP2C19: Normal clopidogrel active metabolite formation; normal on-treatment platelet reactivity","CYP2C19: Normal metabolism","CYP2C19: Normal metabolism of tertiary amines | CYP2D6: Increased metabolism of TCAs to less active compounds compared to normal metabolizers; Lower plasma concentrations of active drug will increase probability of pharmacotherapy failure","CYP2C19: Normal voriconazole metabolism","CYP2C9: Increased fluvastatin exposure as compared to normal metabolizer which may translate to increased myopathy risk. | SLCO1B1: Typical myopathy risk and statin exposure.","CYP2C9: Mildly reduced metabolism","CYP2C9: Slightly reduced phenytoin metabolism; however, this does not appear to translate into increased side effects. | HLA-B: n/a","CYP2D6: Based on very limited data available for CYP2D6 ultrarapid metabolizers taking atomoxetine, it is unlikely ultrarapid metabolizers would achieve adequate serum concentrations for the intended effect at standard dosing.","CYP2D6: Increased formation of O-desmethyltramadol (active metabolite) leading to higher risk of toxicity","CYP2D6: Increased formation of morphine leading to higher risk of toxicity","CYP2D6: Increased metabolism of TCAs to less active compounds compared to normal metabolizers. Lower plasma concentrations of active drug will increase probability of pharmacotherapy failure.","CYP2D6: Increased metabolism of paroxetine to less active compounds when compared to CYP2D6 normal metabolizers. Lower plasma concentrations decrease the probability of clinical benefit. The extent to which ultrarapid metabolizers phenoconvert to normal, intermediate, or poor metabolizers due to paroxetine autoinhibition of CYP2D6 is unclear.","CYP2D6: Increased metabolism of tricyclic antidepressants to less active compounds compared to normal metabolizers. Lower plasma concentrations of active drug will increase probability of pharmacotherapy failure.","CYP2D6: Increased metabolism of venlafaxine to the active metabolite O-desmethylvenlafaxine (desvenlafaxine) and increased O-desmethylvenlafaxine:venlafaxine ratio as compared to CYP2D6 normal metabolizers. There is insufficient evidence supporting the clinical impact of increased O-desmethylvenlafaxine:venlafaxine ratio in CYP2D6 ultrarapid metabolizers.","CYP2D6: Increased metabolism of vortioxetine to inactive compounds when compared to CYP2D6 normal metabolizers. Lower plasma concentrations decrease the probability of clinical benefit.","CYP2D6: Increased metabolism to less active compounds when compared to normal metabolizers and is associated with decreased response to ondansetron and tropisetron (i.e. vomiting).","CYP2D6: Minimal evidence for pharmacokinetic or clinical effect.","CYP2D6: No data available for CYP2D6 ultrarapid metabolizers","CYP2D6: Therapeutic endoxifen concentrations","CYP3A5: Lower dose-adjusted trough concentrations of tacrolimus and decreased chance of achieving target tacrolimus concentrations.","DPYD: Normal DPD activity and \"normal\" risk for fluoropyrimidine toxicity","Efficacy can be reduced due to the gene variation. The gene variation results in an increased conversion of atomoxetine to the active metabolite 4-hydroxyatomoxetine, which has a much lower plasma concentration. As a result, the plasma concentration of the active ingredients decreases.","Efficacy will probably be lacking. The genetic variation increases the conversion of paroxetine.","G6PD: Low risk of acute hemolytic anemia","Genetic variation decreases the sum of the plasma concentrations of propafenone and the active metabolite 5-hydroxypropafenone. This increases the risk of reduced or no efficacy.","Genetic variations increase the efavirenz plasma concentration and therefore the risk of side effects. However, the efavirenz plasma concentration remains within the therapeutic range for the majority of patients.","Increased metabolism of metoprolol leading to decreased drug concentrations; however, it is unclear whether this results in clinically significant changes in heart rate, blood pressure, or clinical outcomes","Normal risk of thiopurine-related leukopenia, neutropenia and myelosuppression. | TPMT NMs have lower erythrocyte concentrations of TGN metabolites and higher concentrations of MeMPNs compared to TPMT IMs and TPMT PMs. This is the 'normal' pattern.","Normal risk of thiopurine-related leukopenia, neutropenia and myelosuppression. | TPMT NMs have lower erythrocyte concentrations of TGN metabolites compared to TPMT IMs and TPMT PMs. This is the 'normal' pattern.","Predicted to have reduced plasma concentrations and efficacy of hydralazine compared to NAT2 poor metabolizers.","SLCO1B1: Typical myopathy risk and statin exposure","The effect on the plasma concentration of venlafaxine + O-desmethylvenlafaxine is small. No reduction of effectiveness or influence on side effects has been demonstrated.","The effectiveness of allopurinol is reduced, meaning that a higher dose is required. The gene variation reduces the excretion of uric acid by kidneys and intestines, meaning that a stronger inhibition of the uric acid production by allopurinol is required to achieve the desired uric acid concentration.","The gene variation increases the conversion of metoprolol to inactive metabolites. This can increase the dose requirement. However, with a target dose of 200 mg/day, there was no effect on the blood pressure and hardly any effect on the reduction of the heart rate.","The gene variation leads to a lower dose requirement, but regular monitoring of patients ensures that this does not lead to a distinct increase in the risk of bleeding.","The gene variation results in a reduction of the exposure to brexpiprazole, but there are no indications supporting a decrease in efficacy.","The genetic variation decreases the plasma concentration of the sum of aripiprazole and the active metabolite dehydroaripiprazole to a limited degree. There is no evidence that this increases the risk of reduced effectiveness.","The genetic variation increases conversion of flecainide to inactive metabolites. A higher dose is possibly required as a result.","The genetic variation increases the conversion of codeine to morphine. This can result in an increase in side effects. Death has occurred in children who received analgesic doses. One adult with reduced kidney function and co-medication with two CYP3A4 inhibitors became comatose after use of codeine for a cough.","The genetic variation increases the conversion of tramadol to a metabolite with a stronger opioid effect. This can result in an increase in potentially life-threatening side effects.","The genetic variation results in a reduction in the required dose and an increase in the risk of excessively severe inhibition of blood clotting during the first month of the treatment. However, the effect is small and GA is also the most common genotype, meaning that the standard treatment will primarily be based on patients with this genotype.","The genetic variation results in a reduction of the required dose, but with the current practice of initiating or reviewing treatment this results in little or no increased risk of bleeding or excessive anticoagulation.","The guideline does not provide a description of the impact of a DPYD activity score of 2 on capecitabine.","The guideline does not provide a description of the impact of a DPYD activity score of 2 on flucytosine.","The guideline does not provide a description of the impact of a DPYD activity score of 2 on fluorouracil.","The guideline does not provide a description of the impact of a DPYD activity score of 2 on tegafur.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on azathioprine.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on citalopram.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on clomipramine.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on clopidogrel.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on escitalopram.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on imipramine.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on lansoprazole.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on mavacamten.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on mercaptopurine.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on omeprazole.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on pantoprazole.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on quetiapine.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on sertraline.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on thioguanine.","The guideline does not provide a description of the impact of a normal metabolizer phenotype on voriconazole.","The guideline does not provide a description of the impact of the normal function phenotype on atorvastatin.","The guideline does not provide a description of the impact of the normal function phenotype on rosuvastatin.","The guideline does not provide a description of the impact of the normal function phenotype on simvastatin.","The normal dose is not effective. The gene variation increases the conversion of eliglustat into inactive metabolites. There are insufficient data to determine an effective dose for all UM.","The percentage of patients with therapy failure increases from 16% to 37%. The gene variation leads to a high ratio of the active metabolite (9-hydroxyrisperidone (paliperidone)) compared to risperidone, which crosses the blood-brain barrier more effectively.","The risk of ineffectiveness and cardiotoxic effects may be increased. The gene variation leads to a decrease in the plasma concentration of nortriptyline and an increase in the plasma concentration of the cardiotoxic metabolite Z-10-hydroxynortriptyline.","The risk of ineffectiveness and cardiotoxic side effects may be increased. The gene variation leads to reduced plasma concentrations of clomipramine and the active metabolite desmethylclomipramine and to increased concentrations of the potentially cardiotoxic hydroxy /* Fuer Transporter und Zielproteine passt das Wort Metabolisierer nicht.
   PharmCAT liefert dort eigene Phaenotyp-Woerter, die im Datenblock schon
   uebersetzt sind - LVLFOR nimmt sie, wenn vorhanden. */
function lvlLabel(g){
  const p=PHENO[g];
  if(!p)return LVL[2];
  if(p.de)return {t:p.de,k:LVL[p.lvl]?LVL[p.lvl].k:"?",s:LVL[p.lvl]?LVL[p.lvl].s:"Offen",
                  col:LVL[p.lvl]?LVL[p.lvl].col:"var(--unk-t)"};
  return LVL[p.lvl]||LVL["-1"];
}

const D_TXT=["Abacavir is not recommended. High risk of hypersensitivity (~6% of patients) due to the presence of at least one *57:01 allele.","Avoid amitriptyline use.","Avoid moderate and strong CYP2D6 inhibitors. Initiate therapy with recommended standard of care dosing.","Avoid tricyclic use due to potential lack of efficacy. Consider alternative drug not metabolized by CYP2D6. If a TCA is warranted, consider titrating to a higher target dose (compared to normal metabolizers). Utilize therapeutic drug monitoring to guide dose adjustments.","Be alert to reduced efficacy or select alternative drug (e.g., methylphenidate, clonidine).","Be extra alert to insufficient response. Consider dose increase by 200%.","Be extra alert to insufficient response. Consider dose increase by 400%.","Be extra alert to insufficient response. Consider dose increase by 50-100%.","Check INR more frequently.","Choose an alternative agent that is not dependent on CYP2C19 metabolism as primary therapy in lieu of voriconazole. Such agents include isavuconazole, liposomal amphotericin B, and posaconazole.","Consider a 25-50% reduction of recommended starting dose and titrate to response or use an alternative drug not metabolized by CYP2D6.","Consider an alternative drug not predominantly metabolized by CYP2C19.","In patients with a heart failure, select alternative drug (e.g., bisoprolol, carvedilol) or reduce dose by 75%. For other indications, be alert to ADEs (e.g., bradycardia, cold extremities) or select alternative drug (e.g., atenolol, bisoprolol).","Increase starting dose 1.5 to 2 times recommended starting dose. Total starting dose should not exceed 0.3mg/kg/day. Use therapeutic drug monitoring to guide dose adjustments.","Increased risk for reduced response to clopidogrel. Consider alternative drug. Prasugrel is not or to a much smaller extent metabolized by CYP2C19 but is associated with an increased bleeding risk compared to clopidogrel","Increased risk of cisplatin-induced ototoxicity (hearing loss) in pediatric patients. Alternative treatments may be prescribed when they have demonstrated equal efficacy, manageable and acceptable toxicity, less ototoxicity, and are considered options within the current standards of care.","Initiate therapy with recommended starting dose. If patient does not respond to recommended maintenance dosing, consider alternative drug not predominantly metabolized by CYP2C19.","Insufficient data to allow calculation of dose adjustment. Select alternate drug - not tramadol or codeine - or be alert to symptoms of insufficient pain relief.","Prescribe a lower dose or consider an alternative statin (e.g. pravastatin or rosuvastatin); consider routine CK surveillance.","Reduce dose by 50% or select alternative drug (e.g., flupenthixol, quetiapine, olanzapine, clozapine).","Reduce dose by 50% or select alternative drug (e.g., pimozide, flupenthixol, fluphenazine, quetiapine, olanzapine, clozapine).","Reduce dose by 50%, record ECG, monitor plasma concentration.","Reduce dose by 70%, record ECG, monitor plasma concentration.","Reduce initial dose by 30% for patients receiving more than 250 mg/m2. Increase dose in response to neutrophil count.","Reduce maximum dose to 10 mg/day (67% of the maximum recommended daily dose).","Select alterantive drug. Fluorouracil or capecitabine are not suitable alternatives because both are also metabolized by DPD.","Select alterantive drug. Tegafur is not a suitable alternative because this drug is also metabolized by DPD.","Select alternative drug (e.g., acetaminophen, NSAID, morphine-not tramadol or oxycodone) or be alert to symptoms of insufficient pain relief.","Select alternative drug (e.g., citalopram, sertraline) or adjust dose to clinical response and monitor (O-desmethyl)venlafaxine plasma concentration.","Select alternative drug (e.g., quetiapine,olanzapine, clozapine) or be extra alert to ADEs and adjust dose to clinical response.","Select alternative drug (not oxycodone or codeine) or be alert to symptoms of insufficient pain relief.","Select alternative drug not predominantly metabolized by CYP2D6.","Select alternative drug or reduce dose by 50%. Increase dose in response of hematologic monitoring and efficacy.","Select and alternative drug not predominantly metabolized by CYP2D6 (i.e. granisetron).","Start with reduced doses (reduce by 30-50%) and adjust doses of thioguanine based on degree of myelosuppression and disease-specific guidelines. Allow 2-4 weeks to reach steady state after each dose adjustment. In setting of myelosuppression, and depending on other therapy, emphasis should be on reducing thioguanine over other agents.","Start with reduced doses (start at 30-70% of full dose) and adjust doses based on degree of myelosuppression and disease-specific guidelines. Allow 2-4 weeks to reach steady state after each dose adjustment. In those who require a dosage reduction based on myelosuppression, the median dose may be ~40% lower (44 mg/m2) than that tolerated in wild-type patients (75 mg/m2). In setting of myelosuppression, and depending on other therapy, emphasis should be on reducing mercaptopurine over other agents.","There is no need to avoid prescribing of atazanavir based on UGT1A1 genetic test result. Inform the patient that some patients stop atazanavir because of jaundice (yellow eyes and skin), but that this patient&rsquo;s genotype makes this unlikely.","Use standard loading dose and reduce maintenance dose by 25%. Evaluate response and serum concentration after 7-10 days. Be alert to ADEs (e.g., ataxia, nystagmus, dysarthria, sedation)."];

const PW_SCHWACH=/less active|lower plasma|lower systemic|decreased plasma|decreased systemic|ineffectiveness|therapeutic failure|lack of efficacy|reduced efficacy|decreased concentration|decreased exposure/;
const PW_STARK=/increased formation|higher systemic|higher plasma|increased plasma|increased systemic|increased exposure|higher dose-adjusted|increased concentration/;

   sonst die erste Quelle, die ueberhaupt etwas sagt. 13 der 94 Wirkstoffe

   auf einem anderen String als die Boxen, stuenden sie wieder im
   Widerspruch. */
function pImpOf(pr){return pr.haupt.imp || (pr.alle.find(x=>x.imp)||{}).imp || '';}

   ausdruecklich nicht als normal - eine Luecke ist kein Freispruch. */
function pImplNormal(imp){
  const t=(imp||'').toLowerCase();
  if(!t)return false;
  const w=!PW_SCHWACH.test(t)&&!PW_STARK.test(t)&&PW_NORMAL.test(t);
  const x=!PT_HOCH.test(t)&&PT_NORMAL.test(t);
  return w&&x;
}
/* Der Deckel. Dass ein anderer Wirkstoff verfuegbar waere, ist kein Befund am
   Patienten: PharmCAT setzt alternateDrugAvailable auch bei "falls mehr
   noetig, Alternative erwaegen". Sind Wirkung und Risiko normal, bleibt als
   Grund fuer ALARM nur die Alternative uebrig - und die traegt ihn nicht.
   Uebrig bleibt, was die Quelle sonst noch verlangt: Dosis anpassen oder
   ueberwachen, sonst nichts. */

  if(sev!=='crit'||!pImplNormal(imp))return sev;

   verfuegbar waere, geht nicht ein - das ist eine Eigenschaft des Marktes,

   stoff=false bei Ziel- und Risikogenen (CFTR, RYR1, CACNA1S, VKORC1): dort
   wird nichts verstoffwechselt, die Skala trifft nicht zu, dort bleibt es
   vorerst bei der Flag-Regel mit Deckel. */

  if(!stoff)return pDeckel(h.sev,h.flags,imp);

/* Ergebnis je Bedingung: true trifft zu, false trifft nicht zu,
   null nicht entscheidbar (Gen fehlt, mehrdeutig oder ohne Ergebnis). */
function condTrifft(c){
  const gen=c[0], code=c[1], roh=c[2];

  if(!p)return [null,gen+' ist nicht Teil des Panels'];
  if(p.mehr)return [null,gen+' ist mehrdeutig &mdash; '+p.kand+' Diplotypen bleiben m&ouml;glich'];
  if(!p.eind)return [null,'f&uuml;r '+gen+' liegt kein Ergebnis vor'];
  if(code){
    const mine=[p.code]; if(PAEQ[p.code])mine.push(PAEQ[p.code]);
    return [mine.indexOf(code)>=0, gen+' ist '+p.code+', die Zeile verlangt '+code];
  }
  /* Kein Phaenotyp-Code: das Spreadsheet vergleicht hier den Diplotyp
     direkt, etwa UGT1A1 *28/*28 oder VKORC1 TT. */
  const gn=GENO[gen];

  if(!a||a==='NICHTBESTIMMBAR')return [null,'f&uuml;r '+gen+' liegt kein Diplotyp vor'];

/* Die Zeile, die zum Profil passt. Zusaetzlich wird festgehalten, ob eine

function recMatch(id){
  const rs=PRECBY[id]; if(!rs)return {rec:null,offen:null};
  let offen=null;
  for(const r of rs){
    if(!r.cond.length)continue;                 /* Warfarin-Dosisformel, s.u. */
    let alle=true, unklar=null;
    for(const c of r.cond){
      const [ok,warum]=condTrifft(c);
      if(ok===false){alle=false;break;}
      if(ok===null){unklar=warum;alle=false;}
    }
    if(alle)return {rec:r,offen:null};
    if(unklar&&!offen)offen={grund:unklar,n:rs.length};
  }
  return {rec:null,offen:offen};
}

/* ================= LOGIK ================= */
function ico(id,cls,size){return `<svg class="${cls||''}" ${size?`width="${size}" height="${size}"`:''}><use href="#${id}"/></svg>`;}
function hasPGx(id){return !!PHENO[DRUGS[id].gene];}
function statusFor(id){
  const d=DRUGS[id],g=d.gene;
  /* 1. Vorrang: PharmCAT hat fuer dieses Genprofil eine fertige Empfehlung.
        Das ist die Referenzimplementierung von CPIC/DPWG, genau auf den
        gerufenen Genotyp bezogen. */
  const pr=pharmRec(id);
  if(pr){
    const h=pr.haupt;
    /* Die Stufe muss zum Genotyp passen, auf den sich die Empfehlung bezieht -
       sonst zeigen die Sub-Bewertungen "Normal", waehrend oben ALARM steht.
       Bei mehreren Genen zaehlt das am staerksten abweichende. */
    let plvl=2, stoff=true, gefunden=0, bestimmt=0;
    Object.keys(PHENO).forEach(g=>{
      if((h.gt||'').indexOf(g)<0)return;
      gefunden++;
      const a=PHENO[g].art;
      if(a!=='enz'&&a!=='trans')stoff=false;
      const l=PHENO[g].lvl; if(l<0)return;
      bestimmt++;
      if(Math.abs(l-2)>Math.abs(plvl-2))plvl=l;
    });
    /* Die Ampel kommt aus dem Genotyp, siehe pGenSev. Das Alt-Flag faerbt die
       Karte nicht mehr; es fuellt nur noch die Box "Handlung". */
    const sev=pGenSev(plvl,gefunden&&stoff,bestimmt,h,pImpOf(pr));
    const gekappt=PSEV.indexOf(sev)<PSEV.indexOf(h.sev);
    const wirkung=sev==='crit'
      ? "Fuer dich ist ein anderer Wirkstoff angezeigt."
      : sev==='warn'
        ? "Die Dosis muss angepasst oder die Wirkung ueberwacht werden."
        : sev==='unk'
          ? "Das dafuer noetige Gen konnte nicht bestimmt werden."
          : "Es ist keine Anpassung noetig.";
    return{sev:sev, lvl:plvl, pharm:true, gekappt:gekappt, flags:h.flags, gt:h.gt,
      text:"Zu "+d.name+" gibt es eine Empfehlung, die genau auf deinen Genotyp "
        +(h.gt||"")+" passt. "+wirkung+" Der Wortlaut steht unten."};
  }
  /* 2. Novogenias eigene Leitlinienzeile, wenn alle Genbedingungen zutreffen. */
  const rc=recFor(id);
  if(rc&&rc.quelle==='matrix')return{sev:rc.sev, lvl:PHENO[rc.cgen]?PHENO[rc.cgen].lvl:2,
    leit:true,
    text:"F&uuml;r "+d.name+" gibt es eine offizielle Empfehlung, die genau auf deinen "
      +"Genotyp "+rc.gt+" passt. Sie steht unten im Wortlaut."};
  /* 3. Eine Leitlinie existiert, laesst sich aber nicht anwenden, weil ein
        dafuer noetiges Gen nicht eindeutig bestimmt werden konnte. */
  const off=recOffen(id);
  if(off)return{sev:"unk", lvl:-1, offen:off,
    text:"F&uuml;r "+d.name+" gibt es offizielle Empfehlungen &mdash; sie h&auml;ngen aber an "
      +"einem Gen, das in deiner Analyse nicht eindeutig bestimmt werden konnte "
      +"("+off.grund+"). Deshalb bleibt die Bewertung offen."};
  if(!PHENO[g])return{sev:"ok",lvl:2,nopgx:true,text:"F&uuml;r "+d.name+" ist &uuml;ber deine getesteten Gene kein relevanter genetischer Einfluss bekannt. Die Standarddosis ist f&uuml;r dich unauff&auml;llig."};
  const lvl=PHENO[g].lvl;let sev,text;
  /* 4. Gen ist im Panel, hat aber kein eindeutiges Ergebnis. */
  if(lvl<0)return{sev:"unk",lvl:-1,
    text:"Ob "+d.name+" zu dir passt, h&auml;ngt von "+g+" ab. Dieses Gen konnte in deiner "
      +"Analyse nicht eindeutig bestimmt werden &mdash; "
      +(PHENO[g].mehr?("es bleiben "+PHENO[g].kand+" m&ouml;gliche Varianten offen")
                     :"die daf&uuml;r n&ouml;tigen Positionen wurden nicht gelesen")
      +". Eine Aussage w&auml;re geraten, deshalb bleibt sie offen."};
  if(d.prodrug){
    if(lvl===2){sev="ok";text="Dein "+g+" arbeitet normal &mdash; "+d.name+" wird zuverl&auml;ssig aktiviert. Die Standarddosis ist f&uuml;r dich passend.";}
    else if(lvl===1){sev="warn";text=d.name+" wird bei dir nur reduziert aktiviert. Die Wirkung kann schw&auml;cher ausfallen &mdash; eine Alternative oder Dosisanpassung sollte gepr&uuml;ft werden.";}
    else if(lvl===0){sev="crit";text=d.name+" wird bei dir kaum aktiviert. Die erwartete Wirkung bleibt aus &mdash; ein alternatives Medikament ist notwendig.";}
    else{sev="warn";text=d.name+" wird bei dir sehr stark aktiviert &mdash; erh&ouml;htes Risiko f&uuml;r Nebenwirkungen.";}
  }else{
    if(lvl===2){sev="ok";text="Dein "+g+" baut "+d.name+" normal ab &mdash; die Standarddosis ist f&uuml;r dich sicher und wirksam.";}
    else if(lvl===1){sev="warn";text="Dein "+g+" baut "+d.name+" vermindert ab. Der Wirkstoff reichert sich an &mdash; die Dosis sollte reduziert werden.";}
    else if(lvl===0){sev="crit";text=d.name+" wird bei dir kaum abgebaut und reichert sich stark an. Die Dosis muss deutlich gesenkt oder ein anderes Medikament gew&auml;hlt werden.";}
    else{sev="warn";text="Dein "+g+" baut "+d.name+" sehr rasch ab &mdash; die Wirkung kann zu schwach sein.";}
  }
  if(d.gene2&&PHENO[d.gene2]&&PHENO[d.gene2].lvl===0)sev="crit";
  return{sev,lvl,text};
}
/* unk liegt zwischen OK und Achtung: eine offene Frage ist ernster als
   ein unauffaelliges Ergebnis, aber kein belegter Handlungsbedarf. */
const RANK={ok:0,unk:1,warn:2,crit:3};
const SLABEL={ok:"OK",unk:"Offen",warn:"Achtung",crit:"ALARM"};
/* Woher kommt die Stufe - aus dem Genprofil oder aus einer Wechselwirkung?
   'ix' nur, wenn die Wechselwirkung die Stufe ANHEBT. Ist ein Wirkstoff
   schon genetisch auf Alarm, bleibt ALARM stehen; sonst verschwaende das
   genetische Ergebnis hinter dem Etikett. */
function sevQuelle(id,pool){
  if(!pool)return 'gen';
  const g=statusFor(id).sev, ges=overallSev(id,pool);
  return RANK[ges]>RANK[g]?'ix':'gen';
}
function sevLabel(id,sev,pool){
  return sevQuelle(id,pool)==='ix'?'Interaktion':SLABEL[sev];
}
function sevIcon(id,sev,pool){
  return sevQuelle(id,pool)==='ix'?'c-ix':(sev==='ok'?'st-ok':'st-excl');
}
function ddisFor(id,pool){return DDI.filter(x=>(x.a===id&&pool.includes(x.b))||(x.b===id&&pool.includes(x.a)));}
/* Geloest = einer der beiden Partner wurde ersetzt. Die Linie bleibt
   sichtbar, aber sie faerbt nichts mehr - sonst stuende Clopidogrel weiter
   auf ALARM, obwohl Omeprazol schon durch Dexlansoprazol ersetzt ist. */
function ixGeloest(x){return !!(altChoice[x.a]||altChoice[x.b]);}
function ddisOffen(id,pool){return ddisFor(id,pool).filter(x=>!ixGeloest(x));}
function overallSev(id,pool){
  const st=statusFor(id);let s=st.sev;
  const dd=ddisOffen(id,pool||workspace);
  dd.forEach(x=>{if(RANK[x.sev]>RANK[s])s=x.sev;});
  return s;
}
const _sevCache={};
function listSev(id){
  let v=_sevCache[id];
  if(v===undefined){v=statusFor(id).sev;_sevCache[id]=v;}
  return v;
}
/* Wechselwirkungen in der eigenen Liste - unabhaengig von der Genetik */
function ixBox(id){
  const dd=ddisFor(id,workspace);
  if(!dd.length)return [];
  const offen=dd.filter(x=>!ixGeloest(x));
  if(!offen.length)return [{l:"Interaktion",v:"Gel&ouml;st",sev:"ok",sym:"c-ix"}];
  const c=offen.some(x=>x.sev==='crit');
  return [{l:"Interaktion",v:c?"Kritisch":"Zu beachten",sev:c?"crit":"warn",sym:"c-ix"}];
}
/* Die vier Boxen aus dem, was die Leitlinie ueber die Folge sagt.
   Die Texte von CPIC und DPWG sind formelhaft; erkannt wird an Wortgruppen,
   nicht geraten. Was der Text nicht hergibt, bleibt "Nicht angegeben". */
function pharmMetrics(id,st){
  const pr=pharmRec(id); if(!pr)return null;
  /* Massgeblich ist die Zeile, die auch die Ampel bestimmt. Erst wenn die
     keine Folge nennt, wird die naechste Quelle herangezogen. */
  const t=pImpOf(pr).toLowerCase();
  const d=DRUGS[id], P=d.prodrug;
  const B=(l,v,sev,sym)=>({l,v,sev,sym});
  const hat=(re)=>re.test(t);

  /* 1. Wirkung - dieselben Wortgruppen, die auch den Deckel setzen */
  let wirk;
  if(PW_SCHWACH.test(t))     wirk=B("Wirkung","Zu schwach","warn","s-down");
  else if(PW_STARK.test(t))  wirk=B("Wirkung","Verst&auml;rkt","crit","s-dblup");
  else if(PW_NORMAL.test(t)) wirk=B("Wirkung","Normal","ok","s-check");
  else wirk=B("Wirkung","Nicht angegeben","unk","c-search");

  /* 2. Umsatz im Koerper */
  let ums;
  if(hat(/increased metabolism|increased conversion|ultrarapid|rapid metaboli/))
    ums=B(P?"Aktivierung":"Abbau","Beschleunigt","warn","s-up");
  else if(hat(/decreased metabolism|reduced metabolism|poor metaboli|reduced .*activity|no .*activity|decreased .*activity/))
    ums=B(P?"Aktivierung":"Abbau","Verlangsamt","warn","s-down");
  else if(hat(/normal metabolism|normal .*activity|mildly reduced|slightly reduced/))
    ums=B(P?"Aktivierung":"Abbau","Normal","ok","s-check");
  else ums=B(P?"Aktivierung":"Abbau","Nicht angegeben","unk","c-search");

  /* 3. Risiko - dieselben Wortgruppen wie im Deckel */
  let tox;
  if(PT_HOCH.test(t))         tox=B("Toxizit&auml;t","Erh&ouml;htes Risiko","crit","s-up");
  else if(PT_NORMAL.test(t))  tox=B("Toxizit&auml;t","Normales Risiko","ok","s-check");
  else tox=B("Toxizit&auml;t","Nicht angegeben","unk","c-search");

  /* 4. Handlung - aus PharmCATs eigenen Feldern */
  const f=st.flags||0;
  const akt=(f&1) ? B("Handlung","Anderer Wirkstoff",st.gekappt?"warn":"crit","s-stop")
          : (f&2) ? B("Handlung","Dosis anpassen","warn","s-up")
          : (f&4) ? B("Handlung","&Uuml;berwachen","warn","s-up")
          :         B("Handlung","Keine Anpassung","ok","s-check");
  /* Was der Text nicht hergibt, wird weggelassen statt grau angezeigt.
     Stattdessen kommt der Genotyp dazu, auf den sich die Empfehlung stuetzt -
     das ist die eigentliche Grundlage und immer vorhanden. */
  const o=[wirk,ums,tox].filter(x=>x.sev!=='unk');
  o.push(akt);
  if(st.gt)o.push(B("Grundlage",st.gt.replace(/ Metabolizer/g,'').replace(/ Function/g,''),
                    st.sev==='ok'?'ok':(st.sev==='crit'?'crit':'warn'),'n-dna'));
  return o;
}
function metrics(id){
  const d=DRUGS[id],st=statusFor(id),P=d.prodrug,o=[];
  const B=(l,v,sev,sym)=>({l,v,sev,sym});
  if(st.nopgx){
    o.push(B("Wirkung","Normal","ok","s-check"),B("Abbau","Normal","ok","s-check"),
           B("Toxizit&auml;t","Normales Risiko","ok","s-check"),B("Dosierung","Standarddosis","ok","s-check"));
  }else if(st.lvl===2){
    o.push(B("Wirkung","Normal","ok","s-check"),B(P?"Aktivierung":"Abbau","Normal","ok","s-check"),
           B("Toxizit&auml;t","Normales Risiko","ok","s-check"),B("Dosierung","Standarddosis","ok","s-check"));
  }else if(st.lvl===1){
    o.push(P?B("Wirkung","Reduziert","warn","s-down"):B("Wirkung","Verst&auml;rkt","ok","s-dblup"),
           B(P?"Aktivierung":"Abbau",P?"Reduziert":"Verlangsamt","warn","s-down"),
           P?B("Toxizit&auml;t","Normales Risiko","ok","s-check"):B("Toxizit&auml;t","Erh&ouml;htes Risiko","warn","s-up"),
           P?B("Dosierung","Dosis anpassen","warn","s-up"):B("Dosierung","Dosis reduzieren","warn","s-down"));
  }else if(st.lvl===0){
    o.push(P?B("Wirkung","Bleibt aus","crit","s-stop"):B("Wirkung","Stark verst&auml;rkt","ok","s-dblup"),
           B(P?"Aktivierung":"Abbau","Findet nicht statt","crit","s-stop"),
           P?B("Toxizit&auml;t","Normales Risiko","ok","s-check"):B("Toxizit&auml;t","Hohes Risiko","crit","s-up"),
           B("Dosierung",P?"Anderes Medikament":"Stark senken","crit","s-stop"));
  }else{
    /* Ultraschnell. Fuer ein Prodrug heisst das: mehr Wirkstoff entsteht,
       also staerkere Wirkung und hoeheres Risiko (Codein zu Morphin).
       Fuer einen normalen Wirkstoff das Gegenteil: er ist zu schnell weg,
       die Wirkung bleibt zu schwach. Das war bisher nicht unterschieden. */
    if(P){
      o.push(B("Wirkung","Stark verst&auml;rkt","crit","s-dblup"),
             B("Aktivierung","Beschleunigt","crit","s-up"),
             B("Toxizit&auml;t","Hohes Risiko","crit","s-up"),
             B("Dosierung","Anderes Medikament","crit","s-stop"));
    }else{
      o.push(B("Wirkung","Zu schwach","warn","s-down"),
             B("Abbau","Beschleunigt","warn","s-up"),
             B("Toxizit&auml;t","Normales Risiko","ok","s-check"),
             B("Dosierung","Dosis erh&ouml;hen","warn","s-up"));
    }
  }
  /* Wenn PharmCAT die Bewertung liefert, werden alle vier Boxen aus dem
     Implikationstext der Quelle abgeleitet - der Prodrug-Schalter reicht
     nicht. Amitriptylin und Codein sind beide CYP2D6 ultraschnell, aber bei
     Codein entsteht MEHR Wirkstoff (Morphin, Toxizitaet), bei Amitriptylin
     WENIGER (Wirkungsverlust). Das steht nur im Text. */
  const pm=pharmMetrics(id,st);
  if(pm)return pm.concat(ixBox(id));
  return o.concat(ixBox(id));
}
function evidDots(ev){const e=EVID[ev];if(!e)return"";let d="";for(let i=1;i<=4;i++)d+=`<i class="${i<=e.n?'on':''}"></i>`;return `<span class="dots">${d}</span> <b>${e.label}</b>`;}

function cardHtml(id,ctx,opts){
  opts=opts||{};
  const d=DRUGS[id],sev=opts.sevPool?overallSev(id,opts.sevPool):listSev(id);
  const key=ctx+":"+id,open=openCards[key];
  return `<div class="card c-${sev} ${open?'open':''} ${opts.faded?'faded':''}" data-id="${id}"
      >
    <div class="chead" onclick="toggleCard('${key}')">
      ${ico('pillimg','pill')}
      <div class="cmain">
        <div class="cname" title="${d.name}">${d.name}</div>
        <div class="cbrands" title="${brandsOf(id).join(', ')}">${brandsOf(id).join(', ')}</div>
      </div>
      <div class="cstate">
        ${ico(sevIcon(id,sev,opts.sevPool),'st s-'+sev)}
        <span class="sw t-${sev}">${sevLabel(id,sev,opts.sevPool)}</span>
      </div>
      ${ico('chev','cchev')}
    </div>
    <div class="cbody">
      <div class="cdiv"></div>
      <div class="infogrid">${metricBoxes(id)}</div>
      ${ctx==='detail'?'':`<button class="btn btn-plum btn-wide" onclick="event.stopPropagation();openDetail('${id}')">Mehr Information ${ico('arr','',16)}</button>`}
    </div>
    ${opts.add?addBtnHtml(id):''}
  </div>`;
}
function metricBoxes(id){
  return metrics(id).map(m=>{
    /* Herleitung statt Folge: "Abbau" und "Aktivierung" erklaeren, WARUM
       etwas passiert, "Grundlage" nennt den Genotyp, auf den sich die
       Empfehlung stuetzt ("CYP2C19 Normal"). Das sind die Felder, die in der
       einfachen Ansicht fallen. Was bleibt - Wirkung, Handlung, Dosierung,
       Interaktion, Risiko - sagt, was ist oder was zu tun ist. */
    const mechanik=(m.l==='Abbau'||m.l==='Aktivierung'||m.l==='Grundlage');
    /* "Toxizitaet" wird umbenannt, NICHT versteckt: ein erhoehtes Risiko ist
       sicherheitsrelevant. Versteckt wird nur Mechanik, nie eine Folge. */
    const lab=(istEinfach()&&m.l==='Toxizit&auml;t')?'Risiko':m.l;
    return `<div class="ibox b-${m.sev}${mechanik?' x-only':''}">
    <div class="ic s-${m.sev}">${ico(m.sym)}</div>
    <div class="itx"><div class="il">${lab}</div><div class="iv t-${m.sev}">${m.v}</div></div>
  </div>`;}).join('');
}

/* ================= GEN-SYMBOLE ================= */
function genePair(lvl){
  const bar=(state)=>{
    const col=state==='off'?'var(--crit)':state==='ultra'?'#0b6b36':'var(--ok)';
    const h=state==='ultra'?15:12, w=44;
    const mark=state==='off'
      ? `<path d="M28.5 ${h/2-3} 34.5 ${h/2+3}M34.5 ${h/2-3} 28.5 ${h/2+3}" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>`
      : `<path d="M28.6 ${h/2} 31.4 ${h/2+2.8} 35.4 ${h/2-3.2}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect x="0" y="0" width="${w}" height="${h}" rx="${h/2}" fill="${col}"/>${mark}</svg>`;
  };
  if(lvl===2)return bar('on')+bar('on');
  if(lvl===1)return bar('on')+bar('off');
  if(lvl===0)return bar('off')+bar('off');
  if(lvl===3)return bar('ultra')+bar('ultra');
  /* nicht bestimmbar: zwei graue Balken mit Fragezeichen statt Haken */
  const q=(w,h)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
    +`<rect x="0" y="0" width="${w}" height="${h}" rx="${h/2}" fill="#8E8896"/>`
    +`<text x="31.5" y="${h/2+3.4}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff"`
    +` font-family="var(--font)">?</text></svg>`;
  return q(44,12)+q(44,12);
}

  /* kurz = Beschriftung der Tableiste. "Deine Medikamente" passt auf einem
     Telefon nicht in ein Fuenftel der Breite. */
  {id:"dashboard",label:"Start",kurz:"Start",ic:"n-dash",group:"&Uuml;bersicht"},
  {id:"meine",label:"Deine Medikamente",kurz:"Deine<br>Medikamente",ic:"n-pill",badge:"ws",group:"Deine Daten"},
  {id:"gene",label:"Deine Gene",kurz:"Gene",ic:"n-dna"},
  {id:"merk",label:"F&uuml;r deinen Arzt",kurz:"Arzt",ic:"star",badge:"watch"},

function renderNav(){
  document.getElementById('rail').innerHTML=NAV.map(n=>{
    const cnt=n.badge==='ws'?workspace.length:n.badge==='watch'?watchlist.size:null;
    const b=cnt!==null?`<span class="nav-badge nb-plain">${cnt}</span>`:'';

      <span class="ni">${ico(n.ic,'',20)}</span> ${n.label} ${b}</button>`;}).join('');

  const tb=document.getElementById('tabbar');

    const cnt=n.badge==='ws'?workspace.length:n.badge==='watch'?watchlist.size:null;

      onclick="go('${n.id}')">
      <span class="tb-ic">${ico(n.ic,'',22)}${cnt?`<span class="tb-b">${cnt}</span>`:''}</span>

/* ================= FILTER / SUCHE ================= */
function filtered(){
  /* Wirkstoffe, deren Bewertung an einem nicht bestimmbaren Gen haengt,
     werden nicht mehr angezeigt (Vorgabe Daniel, 2026-08-05). Sie stehen
     weiterhin im Datenblock - nur eben nicht in der Liste. */
  let ids=Object.keys(DRUGS).filter(i=>listSev(i)!=='unk');
  if(fCat!=='all')ids=ids.filter(i=>DRUGS[i].cat===fCat);
  if(fSev!=='all')ids=ids.filter(i=>listSev(i)===fSev);
  if(fFav)ids=ids.filter(i=>favorites.has(i));
  if(fWatch)ids=ids.filter(i=>watchlist.has(i));
  const s=q.trim().toLowerCase();
  if(s)ids=ids.filter(i=>{const d=DRUGS[i];
    return d.name.toLowerCase().includes(s)||d.brands.some(b=>b.toLowerCase().includes(s))||(d.gene||'').toLowerCase().includes(s);});
  /* Alphabetisch. Vorher standen die schlimmsten oben - dann sieht man auf
     der ersten Seite nur ALARM und bekommt kein Gefuehl fuer das Verhaeltnis.
     Wer gezielt die Alarme will, nimmt den Ampelfilter darueber. */
  return ids.sort((a,b)=>DRUGS[a].name.localeCompare(DRUGS[b].name,'de'));
}

/* ---- Grosse Filterbuttons: ersetzen die frueheren Unterseiten ---- */

var _brandCache=null;
function brandsOf(id){
  if(!_brandCache){
    _brandCache={};
    if(typeof HNAMEN!=='undefined'){
      Object.keys(DRUGS).forEach(k=>{
        const nm=(DRUGS[k].name||'').toLowerCase();
        const t=HNAMEN[nm];
        if(t&&t.length)_brandCache[k]=[...new Set(t)];
      });
    }
  }
  const d=DRUGS[id];
  if(d.brands&&d.brands.length)return d.brands;
  return _brandCache[id]||[];
}

function renderList(){

  const imPopup=addOpen&&document.getElementById('addcol');
  const el=imPopup?document.getElementById('addcol'):document.getElementById('listcol');
  if(!el)return;
  const ids=filtered();
  const cnt=document.getElementById(imPopup?'addcount':'listcount');
  if(cnt)cnt.innerHTML=ids.length.toLocaleString('de-DE')+" Medikamente"
    +(ids.length>listLimit?" &middot; "+listLimit+" angezeigt":"");
  if(!ids.length){el.innerHTML=`<div class="ws-empty" style="grid-column:1/-1">Kein Treffer.</div>`;return;}
  const show=ids.slice(0,listLimit);
  /* Unter "Deine Medikamente" muss die linke Karte genauso aussehen wie die
     rechte. Sie tat es nicht: rechts rechnet overallSev die Wechselwirkungen
     mit der eigenen Liste ein, links stand nur die Genetik - Clopidogrel war
     links gruen und rechts rot. Jetzt derselbe sevPool. */
  const opts=(view==='meine')?{sevPool:workspace}:null;
  el.innerHTML=show.map(i=>listItemHtml(i,'list',opts)).join('')
    +(ids.length>listLimit
      ? `<button class="moreb" onclick="moreList()">Weitere ${Math.min(240,ids.length-listLimit)}
         von ${(ids.length-listLimit).toLocaleString('de-DE')} anzeigen ${ico('chev','',16)}</button>`
      : '');
}

/* Was der Test wirklich lesen konnte. Diese Angaben gehoeren an den Anfang des
   Arztberichts, weil jede Aussage darunter nur so weit tragt wie die Abdeckung. */
function covBlock(){
  const M=P_META, ges=M.posda+M.posfehlt;
  const pct=(100*M.posda/ges).toFixed(0);
  /* Nur die ausgewerteten Gene, wie ueberall sonst auch (Vorgabe Daniel,
     2026-08-05). Die Unvollstaendigkeit steht weiter in den Kennzahlen
     darueber: 611 gelesene Stellen und 58 % Abdeckung. */
  const zeigbar=P_GENES.filter(g=>g.lvl>=0);
  const rows=zeigbar.slice().sort((a,b)=>(a.ok===b.ok?0:a.ok?1:-1)||a.g.localeCompare(b.g))
    .map(g=>{
      const zu=g.pos+g.fehlt;
      const st=g.ok?'bestimmt':(g.mehr?g.kand+' Varianten offen':'nicht bestimmbar');
      return `<tr class="${g.ok?'':'miss'}">
        <td class="mono"><b>${g.g}</b></td>
        <td class="mono">${g.dip||'&mdash;'}</td>
        <td>${g.ok?(g.de||g.phen||'&mdash;'):'nicht bestimmbar'}</td>
        <td class="mono">${g.score||'&mdash;'}</td>
        <td>${g.pos} / ${zu}</td>
        <td>${g.ok?st:`<span class="warnpin">${st}</span>`}</td></tr>`;
    }).join('');
  return `<div class="cov">
    <div class="cov-h">${ico('c-pillbox','',17)} Grundlage dieser Auswertung</div>
    <div class="cov-b">
      <div class="cov-g">
        <div class="cov-k"><span class="n">${geneListe().length}</span><span class="l">Gene ausgewertet</span></div>
        <div class="cov-k"><span class="n">${M.posda.toLocaleString('de-DE')}</span><span class="l">Stellen gelesen</span></div>
        <div class="cov-k"><span class="n">${pct}&thinsp;%</span><span class="l">Abdeckung der ben&ouml;tigten Stellen</span></div>
      </div>
      <p class="cov-p x-only">Probe <b>${M.probe}</b> &middot; Referenz <b>${M.build}</b> &middot;
        Allel-Definitionen <b>ClinPGx</b> &middot; Auswertung <b>PharmCAT ${M.ver}</b> &middot;
        Stand <b>${M.stand}</b>.</p>
      <div class="cov-sub">Gene mit Diplotyp-Auswertung (${zeigbar.length})</div>
      <div class="tabscroll"><table class="cov-tab">
        <thead><tr><th>Gen</th><th>Diplotyp</th><th>Ph&auml;notyp</th><th>Score</th>
          <th>Stellen</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${(()=>{
        /* Alle uebrigen Gene - die ohne Diplotyp, nur ueber Einzelpositionen
           bewertet. Standen bisher gar nicht im Bericht. Auffaellige zuerst. */
        const rest=geneListe().filter(g=>!zeigbar.some(z=>z.g===g));
        if(!rest.length)return '';
        const srt=rest.slice().sort((a,b)=>{
          const R={crit:0,warn:1,ok:2,ultra:2,unk:3};
          return (R[geneSev(a)]||3)-(R[geneSev(b)]||3)||a.localeCompare(b);});
        const auff=srt.filter(g=>['warn','crit'].indexOf(geneSev(g))>=0).length;
        return `<div class="cov-sub">Weitere ausgewertete Gene (${rest.length})</div>
          <p class="cov-p" style="margin:0 0 9px">Ohne Diplotyp, bewertet &uuml;ber
            einzelne Positionen &mdash; <b>${auff}</b> davon auff&auml;llig.</p>
          <div class="cov-rest">${srt.map(g=>{
            const sv=geneSev(g), nP=(RS_BY[g]||[]).length;
            return `<div class="cov-rg"><span class="cov-rd ${sv}"></span>
              <span class="cov-rn">${g}</span>
              <span class="cov-rp">${nP}</span></div>`;}).join('')}</div>`;})()}
    </div></div>`;
}
/* Reihenfolge der Gene: langsam, intermedi&auml;r, normal, ultraschnell */
/* schlechteste Gene zuerst, zuletzt die normalen */
const GORDER=[0,1,-1,3,2];
function sortedGenes(){
  /* Gene ohne eindeutiges Ergebnis werden nicht angezeigt (Vorgabe Daniel,
     2026-08-05). Gilt seit dem Nachtrag auch fuer den Abdeckungsblock im
     Arztbericht; dort belegen jetzt die gelesenen Stellen und die
     Abdeckung in Prozent, wie weit die Auswertung traegt. */
  return Object.keys(PHENO).filter(g=>PHENO[g].lvl>=0).sort((a,b)=>
    GORDER.indexOf(PHENO[a].lvl)-GORDER.indexOf(PHENO[b].lvl)||a.localeCompare(b));
}

   Bewusst eine eigene Ebene: diese Befunde veraendern NIE eine
   Wirkstoffkarte und nie die Ampel. Sie zeigen, wo ein Zusammenhang
   beobachtet wurde - nicht, dass er bei dieser Person eintritt. */
const RS_BY={};
R_POS.forEach(p=>{(RS_BY[p[1]]=RS_BY[p[1]]||[]).push(p);});

   Positionen, tragen aber ein sechstes Feld = 1. Die Wirkstoffindizes

   faellt nur der Generator weg - hier aendert sich nichts. */
const DEMO_GENE={};
if(typeof D_POS!=='undefined'){
  const off=R_DRUGS.length;
  D_DRUGS.forEach(d=>R_DRUGS.push(d));
  D_POS.forEach(p=>{
    const q=[p[0],p[1],p[2],p[3],p[4].map(x=>[x[0],x[1].map(i=>i+off)]),1];
    (RS_BY[p[1]]=RS_BY[p[1]]||[]).push(q);
    if(!PHENO[p[1]])DEMO_GENE[p[1]]=1;
  });
}
function istDemo(p){return p.length>5&&p[5]===1;}
function genIstDemo(g){return !!DEMO_GENE[g];}
const RSRANG={"1A":0,"1B":1,"2A":2,"2B":3,"3":4,"4":5};
/* unguenstig = hoeheres Risiko oder schwaecheres Ansprechen */
function rsNeg(sig){return sig.some(x=>x[0]===1||x[0]===3);}
function rsDots(lv){
  const e=R_EV[lv]||[1,lv]; let d="";
  for(let i=1;i<=4;i++)d+=`<i class="${i<=e[0]?'on':''}"></i>`;
  return `<span class="dots">${d}</span> <b>${e[1]}</b>`;
}

function rsGeneHtml(g,liste){

/* Ab v65 faerben negative Befunde die Genkarte. Die Zusicherung aus v63,
   dass diese Ebene die Bewertung nie anfasst, ist damit aufgehoben -
   Ansage Daniel: "Eine negative Auswirkung hat das Ganze? Gelb oder Rot
   fahren." Die Evidenzstufe entscheidet zwischen Gelb und Rot, weil sie die
   einzige Groesse in den Daten ist, die belegt von beobachtet trennt.
   Guenstige Befunde und reine Abbau-Hinweise faerben nicht. */
function rsGeneSev(g){
  let l=RS_BY[g]; if(!l)return null;
  /* Hat das Gen einen gemessenen Phaenotyp, zaehlen nur die echten
     Positionen. Sonst faerbt eine erfundene Position ein gemessenes
     Ergebnis um - genau so sind CYP3A4 und DPYD in v68 faelschlich auf
     gelb gesprungen. Die Demo-Zeilen bleiben auf der Karte sichtbar,
     sie entscheiden nur nichts. */
  if(PHENO[g]){ l=l.filter(p=>!istDemo(p)); if(!l.length)return null; }
  /* Ein rs-Befund faerbt hoechstens gelb, nie rot (Vorgabe Daniel,
     2026-08-06: "unauffaellig oder auffaellig, in Gruen oder Gelb"). Rot
     vergibt nur der Phaenotyp selbst. Die Evidenzstufe faellt als Farbgeber
     weg - sie steht weiter als Punkte an jeder aufgeklappten rs-Zeile, und
     genau dort gehoert die Abstufung hin. */
  return l.some(p=>p[4].some(x=>x[0]===1||x[0]===3))?'warn':'ok';
}
/* Die Stufe eines Gens: die schaerfere aus Phaenotyp und rs-Befund.
   EINE Stelle, weil Genkarte und Arztbericht sonst auseinanderlaufen -
   in der ersten Fassung war der Berichtsrahmen gelb und die Karte darin
   rot. */
const GSEVR={ok:0,ultra:0,none:0,unk:1,warn:2,crit:3};
function geneSev(g){
  const p=PHENO[g];
  /* Demo-Gene haben keinen Phaenotyp - sie haengen allein am Befund. */
  if(!p)return rsGeneSev(g)||'ok';
  const rsv=rsGeneSev(g);
  /* Ohne Metabolisierer-Status traegt der Befund die Karte allein: gruen,
     wenn nichts Negatives dabei ist, sonst gelb. Kein Grau - das war der
     "Offen"-Zustand, den v62 entfernt hat. */
  if(p.lvl<0)return rsv||'ok';
  const psv=GSEV[p.lvl]||'unk';
  return (rsv&&GSEVR[rsv]>GSEVR[psv])?rsv:psv;
}
/* Positionen eines Gens ohne eigenen Befund - der Vollstaendigkeit halber,

function gPosRest(g){
  const mitBefund={}; (RS_BY[g]||[]).forEach(p=>{mitBefund[p[0]]=1;});
  const pg=PGENE[g];

  const zeilen=bef.map(p=>{

    <div class="gb-ic" style="background:var(--panel);opacity:.45">${helix(2)}</div>
    <div class="gb-tx"><div class="gn">${g}</div><div class="gs" style="color:var(--muted)">nicht getestet</div></div></div></div>`;
  const segs=[0,1,2,3].map(i=>`<div class="gs-seg s${i} ${i===lvl?'on':''}"></div>`).join('');
  const labs=['Langsam','Vermindert','Normal','Schnell'].map((t,i)=>
    `<span class="${i===lvl?'on':''}" title="${['Langsamer Metabolisierer (PM)','Intermedi&auml;rer Metabolisierer (IM)','Normaler Metabolisierer (NM)','Ultraschneller Metabolisierer (UM)'][i]}">${t}</span>`).join('');
  /* Gen ohne Metabolisierer-Status, aber mit gelesenen Positionen. Muss VOR
     `why` und `skala` stehen, die beide darauf zugreifen - const kennt kein
     Hoisting (Fallstrick 5). */
  const nurPos=lvl<0&&PGENE[g]&&(PGENE[g].var||[]).length;
  /* Ohne Metabolisierer-Status gibt es keine andere Aussage als
     auffaellig/unauffaellig - genau danach wurde gefragt. */
  const short=nurPos
    ? ((RS_BY[g]||[]).some(p=>rsNeg(p[4]))?'Auff&auml;llig':'Unauff&auml;llig')
    : lvlLabel(g).t;
  /* Die Statuszeile nennt den Metabolisierertyp - also traegt sie dessen
     Farbe, nicht die der Karte. Sonst stand "Normaler Metabolisierer" in
     Gelb, weil ein rs-Befund der Stufe 3 die Karte gelb faerbt. Von Daniel
     gefunden, 2026-08-08. Die Karte bleibt gelb, die Befundzeile sagt warum. */
  const fsv=nurPos?sv:(has?GSEV[lvl]:sv);
  const colr=fsv==='ultra'?'#0b6b36':fsv==='ok'?'var(--ok-t)':fsv==='warn'?'var(--warn-t)'
    :fsv==='unk'?'var(--unk-t)':'var(--crit-t)';
  /* Bei offenem Ergebnis gehoert der Grund auf die Karte. Ohne den steht dort
     nur "Nicht bestimmbar" und der Nutzer haelt es fuer einen Anzeigefehler. */
  const why=(lvl<0&&!nurPos)?`<div class="gwhy">${gwhyText(g)}</div>`:'';
  /* Risiko-, Ziel- und HLA-Gene haben keinen Metabolisierertyp. Eine
     Metabolisierer-Skala waere dort schlicht falsch, also steht statt der
     Skala der Befund im Wortlaut. */
  /* Ohne Metabolisierer-Status keine Metabolisierer-Skala - die gibt es
     dort nicht, und "Kein Ergebnis" hat v62 aus der Oberflaeche geworfen. */
  const skala=nurPos
    ? `<div class="gflat">${ico('n-dna','',15)} Kein Metabolisierer-Status &mdash;
        ${(PGENE[g].var||[]).length} gelesene Position${(PGENE[g].var||[]).length===1?'':'en'}</div>`
    : (PGENE[g]&&PGENE[g].flach)
    ? `<div class="gflat">${ico('st-ok','',15)} ${PGENE[g].de}</div>`
    : `<div class="gsrow"><div class="genepair">${genePair(lvl)}</div>
      <div class="gsbar"><div class="gscale">${segs}</div><div class="gs-lab">${labs}</div></div></div>`;
  /* Befundzeile auf der Vorderseite - macht sichtbar, warum die Karte
     faerbt, ohne die Detailzeilen schon aufzuklappen. */
  const nBef=(RS_BY[g]||[]).filter(p=>rsNeg(p[4])).length;
  const nGes=(RS_BY[g]||[]).length;
  /* Bei Genen ohne Metabolisierer-Status traegt schon die Statuszeile
     "Auffaellig"/"Unauffaellig" - dann nur die Zahl, sonst steht es zweimal
     auf derselben Karte. */
  const befZeile=nGes
    ? `<div class="gbef ${nBef?'neg':''}">${ico(nBef?'st-excl':'st-ok','',15)}
        ${nurPos?`${nGes} gepr&uuml;fte Position${nGes===1?'':'en'}${nBef?`, ${nBef} mit Befund`:''}`
          :nBef?`Auff&auml;llig &mdash; ${nBef} Position${nBef===1?'':'en'} mit Befund`
               :`Unauff&auml;llig &mdash; ${nGes} gepr&uuml;fte Position${nGes===1?'':'en'}`}</div>`
    : '';
  const key='gene:'+g+(opts.ctx||''), open=openGenes[key];
  if(opts.flat)return `<div class="genebox flat b-${sv}">
    <div class="gb-top"><div class="gb-ic gi-${sv}">${mtIcon(mtStufe(g,lvl),sv)}</div>
      <div class="gb-tx"><div class="gn">${g}</div><div class="gs" style="color:${colr}">${short}</div></div></div>
    ${skala}
    ${why}${befZeile}</div>`;
  return `<div class="genebox b-${sv} ${open?'open':''}" onclick="toggleGene('${key}')">
    <div class="gb-top">
      <div class="gb-ic gi-${sv}">${mtIcon(mtStufe(g,lvl),sv)}</div>
      <div class="gb-tx"><div class="gn">${g}</div><div class="gs" style="color:${colr}">${short}</div></div>
      ${ico('chev','gchev')}
    </div>
    <div class="x-only">${skala}</div>
    ${why}${befZeile}
    <div class="gexp" onclick="event.stopPropagation()">
      <div class="gsec">Was heisst das f&uuml;r dich?</div>
      <div class="plain sm">${plainSentence(g)}</div>
      <div class="x-only">
        <div class="gsec sp">Deine zwei Genkopien</div>
        <div class="gcopies">${copiesHtml(g)}</div>
        ${gPosHtml(g)}
        ${techToggleHtml(g,key+':tech')}
      </div>
      <button class="btn btn-plum gmore" onclick="event.stopPropagation();openGene('${g}')">Alle Details und Empfehlungen ${ico('arr','',15)}</button>
    </div>
  </div>`;
}

/* ================= ARBEITSFL&Auml;CHE ================= */
/* Bilanz der Wechselwirkungen. Gezaehlt werden PAARE, nicht Wirkstoffe:
   bei 4 Medikamenten sind das 6 Paare, und jedes ist genau eines von vier
   Dingen. Die Summe ergibt immer die Paarzahl - so sieht man, wovon die
   Zahl kommt, statt nur eine nackte Trefferzahl. */
function ixScore(){
  const n=workspace.length;
  const paare=n*(n-1)/2;
  let crit=0,warn=0,done=0;
  DDI.filter(x=>workspace.includes(x.a)&&workspace.includes(x.b)).forEach(x=>{
    if(ixGeloest(x))done++; else if(x.sev==='crit')crit++; else warn++;
  });
  return {paare,crit,warn,done,ok:Math.max(0,paare-crit-warn-done)};
}
/* Die Medikamente nach Ampel - aus overallSev(), also derselben Stelle wie
   die Kartenfarbe. Ein ersetzter Wirkstoff zaehlt mit seiner Ersatzwahl. */
/* Nur die GENETISCHE Stufe - die Wechselwirkungen stehen als eigene
   Kacheln daneben. Vorher lief das ueber overallSev, dadurch tauchte
   dieselbe Wechselwirkung in beiden Gruppen auf. */
function medScore(){
  const z={crit:0,warn:0,ok:0,unk:0};
  workspace.forEach(id=>{
    const ersatz=altChoice[id]?findDrug(altChoice[id]):null;
    const s=listSev(ersatz||id);
    z[s]=(z[s]||0)+1;
  });
  return z;
}

/* Interaktionspartner direkt untereinander, danach der Rest nach Schweregrad */
function sortedWorkspace(){
  const pairs=DDI.filter(x=>workspace.includes(x.a)&&workspace.includes(x.b));
  const seen=new Set(),out=[];
  pairs.sort((x,y)=>RANK[y.sev]-RANK[x.sev]).forEach(p=>{
    [p.a,p.b].forEach(id=>{if(!seen.has(id)){seen.add(id);out.push(id);}});
  });
  workspace.filter(id=>!seen.has(id))
    .sort((a,b)=>RANK[overallSev(b,workspace)]-RANK[overallSev(a,workspace)]||DRUGS[a].name.localeCompare(DRUGS[b].name))
    .forEach(id=>out.push(id));
  return out;
}

function drawLinks(){
  const ws=document.getElementById('ws'),svg=document.getElementById('wsvg');if(!ws||!svg)return;
  const r=ws.getBoundingClientRect();
  const W=Math.round(ws.clientWidth||r.width), H=Math.round(Math.max(ws.scrollHeight,r.height));
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let out='';
  DDI.filter(x=>workspace.includes(x.a)&&workspace.includes(x.b)).forEach(x=>{
    const ea=ws.querySelector(`[data-row="${x.a}"]`),eb=ws.querySelector(`[data-row="${x.b}"]`);
    if(!ea||!eb)return;
    const ca=ea.querySelector('.card')||ea, cb=eb.querySelector('.card')||eb;
    const ra=ca.getBoundingClientRect(),rb=cb.getBoundingClientRect();
    const ax=ra.left-r.left, ay=ra.top-r.top, aw=ra.width, ah=ra.height;
    const bx=rb.left-r.left, by=rb.top-r.top, bw=rb.width, bh=rb.height;
    const geloest=ixGeloest(x);
    const crit=x.sev==='crit'&&!geloest;
    const col=geloest?'#9A93A3':(x.sev==='crit'?'#D0021B':'#E08000');
    let d,cx,cy;
    if(Math.abs(ax-bx)<24){
      /* gleiche Spalte: Klammer im rechten Randstreifen */
      const xr=ax+aw+79, y1=ay+ah/2, y2=by+bh/2;
      d=`M${ax+aw-2},${y1} H${xr} V${y2} H${bx+bw-2}`;
      cx=xr; cy=(y1+y2)/2;
    }else{
      /* verschiedene Spalten: waagrechte S-Kurve */
      const l=ax<bx, x1=l?ax+aw-2:ax+2, x2=l?bx+2:bx+bw-2;
      const y1=ay+ah/2, y2=by+bh/2, mx=(x1+x2)/2;
      d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
      cx=mx; cy=(y1+y2)/2;
    }
    /* dreilagig: weicher Schein, kraeftige Linie, heller Kern */
    /* Geloest: duenner, blasser, gestrichelt - noch da, aber sichtbar
       erledigt. Im Knopf steht dann ein Haken statt des Ausrufezeichens. */
    const dick=geloest?5:9, du=geloest?' stroke-dasharray="1 9" stroke-opacity=".85"':'';
    out+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${geloest?12:20}" stroke-linecap="round" stroke-linejoin="round" opacity="${geloest?'.10':'.16'}"/>`;
    out+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${dick}" stroke-linecap="round" stroke-linejoin="round"${du}/>`;
    if(!geloest)out+=`<path d="${d}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/>`;
    const glyph=geloest
      ? `<path d="M${cx-7.5} ${cy+0.5} L${cx-2.5} ${cy+5.5} L${cx+7.5} ${cy-5.5}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<path d="M${cx} ${cy-10.5} L${cx+9.5} ${cy+7} H${cx-9.5} Z" fill="#fff"/>
         <path d="M${cx} ${cy-4.6}v5.6M${cx} ${cy+3.4}v1.1" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`;
    out+=`<g class="ixbtn ${crit?'crit':''}" style="pointer-events:auto;cursor:pointer" opacity="${geloest?'.72':'1'}" onclick="openIx('${x.a}','${x.b}')">
      <circle cx="${cx}" cy="${cy}" r="${geloest?21:27}" fill="${col}" opacity=".2"/>
      <circle cx="${cx}" cy="${cy}" r="${geloest?17:22}" fill="#fff"/>
      <circle cx="${cx}" cy="${cy}" r="${geloest?14.5:19}" fill="${col}"/>
      ${glyph}
      <title>${geloest?'Gel&ouml;st &mdash; Wechselwirkung ansehen':'Interaktion ansehen'}</title></g>`;
  });
  svg.innerHTML=out;
}

function drawIxLink(){

  const r=p.getBoundingClientRect(),r1=d1.getBoundingClientRect(),r2=d2.getBoundingClientRect();
  const W=Math.round(r.width||p.scrollWidth), H=Math.round(Math.max(r.height,p.scrollHeight));
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(W<80||r2.left<r1.right+8){svg.innerHTML='';return;} /* schmal: kein Konnektor */
  const x1=r1.right-r.left, y1=r1.top-r.top+r1.height/2;
  const x2=r2.left-r.left, y2=r2.top-r.top+r2.height/2;
  const mx=(x1+x2)/2, col=ixPair.sev==='crit'?'#E12D2D':'#F08A00';
  svg.innerHTML=`<path d="M${x1},${y1} H${mx} V${y2} H${x2}" fill="none" stroke="var(--plum)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
    <circle cx="${mx}" cy="${(y1+y2)/2}" r="20" fill="#fff"/><circle cx="${mx}" cy="${(y1+y2)/2}" r="16" fill="${col}"/>
    <path d="M${mx} ${(y1+y2)/2-6.8}v7.6M${mx} ${(y1+y2)/2+5}v.9" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>`;
}
function closeIx(){ixPair=null;document.getElementById('scrim').classList.remove('open');document.getElementById('ixmodal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeIx();closeAltPick();closeGene();closeInfo();closeAdd();}});
function toggleAltMenu(id){openAltPick(id);}
function chooseAlt(id,name){if(name)altChoice[id]=name;else delete altChoice[id];altMenuOpen=null;closeAltPick();render();}
function removeWs(id){workspace=workspace.filter(x=>x!==id);delete altChoice[id];render();}
